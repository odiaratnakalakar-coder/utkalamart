<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#138a45">

<title>Utkala Mart - Seller Approval</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        Arial,
        "Noto Sans Odia",
        "Noto Sans Oriya",
        sans-serif;

    background:#f4f7f5;
    color:#222;
}

header{

    background:#138a45;
    color:white;

    padding:15px 20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    position:sticky;

    top:0;

    z-index:1000;

    box-shadow:
        0 3px 12px rgba(0,0,0,.15);
}

.header-title{

    font-size:22px;

    font-weight:800;
}

.header-sub{

    font-size:13px;

    opacity:.9;

    margin-top:3px;
}

.back-btn{

    background:white;

    color:#138a45;

    border:0;

    border-radius:9px;

    padding:10px 14px;

    font-weight:700;

    cursor:pointer;
}

.container{

    width:100%;

    max-width:1100px;

    margin:auto;

    padding:20px;
}

.admin-info{

    background:white;

    padding:15px 18px;

    border-radius:14px;

    margin-bottom:18px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);

    color:#555;
}

.admin-info strong{

    color:#138a45;
}

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    margin-bottom:20px;
}

.stat{

    background:white;

    border-radius:15px;

    padding:18px;

    text-align:center;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);
}

.stat-number{

    font-size:28px;

    font-weight:900;

    color:#138a45;
}

.stat-label{

    margin-top:5px;

    color:#666;

    font-size:14px;
}

.filter-box{

    background:white;

    padding:15px;

    border-radius:14px;

    margin-bottom:18px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);

    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.filter-btn{

    border:1px solid #ddd;

    background:#fff;

    color:#555;

    border-radius:9px;

    padding:10px 15px;

    cursor:pointer;

    font-weight:700;
}

.filter-btn.active{

    background:#138a45;

    color:white;

    border-color:#138a45;
}

.search{

    width:100%;

    padding:13px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:16px;

    margin-top:10px;

    outline:none;
}

.search:focus{

    border-color:#138a45;
}

.message{

    display:none;

    padding:14px;

    border-radius:10px;

    margin-bottom:15px;

    line-height:1.5;
}

.success{

    display:block;

    background:#e8f5e9;

    color:#176522;
}

.error{

    display:block;

    background:#ffebee;

    color:#b71c1c;
}

.info{

    display:block;

    background:#e3f2fd;

    color:#075985;
}

.loading{

    background:white;

    padding:35px;

    text-align:center;

    border-radius:15px;

    color:#777;
}

.empty{

    background:white;

    padding:40px 20px;

    text-align:center;

    border-radius:15px;

    color:#777;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);
}

.seller-card{

    background:white;

    border-radius:17px;

    padding:20px;

    margin-bottom:15px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.07);

    border-left:5px solid #138a45;
}

.seller-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:15px;

    margin-bottom:15px;
}

.seller-name{

    font-size:21px;

    font-weight:900;

    color:#222;
}

.seller-id{

    color:#888;

    font-size:12px;

    margin-top:4px;

    word-break:break-all;
}

.status{

    display:inline-block;

    padding:6px 11px;

    border-radius:20px;

    font-size:12px;

    font-weight:800;

    white-space:nowrap;
}

.status-pending{

    background:#fff3cd;

    color:#856404;
}

.status-approved{

    background:#d4edda;

    color:#155724;
}

.status-rejected{

    background:#f8d7da;

    color:#721c24;
}

.details{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    background:#f8faf9;

    border-radius:12px;

    padding:14px;

    margin-bottom:15px;
}

.detail{

    font-size:14px;

    line-height:1.5;
}

.detail-label{

    color:#777;

    font-size:12px;

    margin-bottom:2px;
}

.detail-value{

    font-weight:700;

    word-break:break-word;
}

.actions{

    display:flex;

    gap:9px;

    flex-wrap:wrap;
}

.action-btn{

    border:0;

    border-radius:9px;

    padding:10px 14px;

    font-size:14px;

    font-weight:800;

    cursor:pointer;
}

.approve{

    background:#138a45;

    color:white;
}

.reject{

    background:#f59e0b;

    color:white;
}

.delete{

    background:#e53935;

    color:white;
}

.restore{

    background:#1976d2;

    color:white;
}

.action-btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}

@media(max-width:700px){

    header{

        padding:12px;

    }

    .header-title{

        font-size:18px;

    }

    .header-sub{

        font-size:11px;

    }

    .back-btn{

        padding:8px 10px;

        font-size:12px;

    }

    .container{

        padding:12px;

    }

    .stats{

        grid-template-columns:
            repeat(2,1fr);

        gap:10px;

    }

    .stat{

        padding:15px 8px;

    }

    .stat-number{

        font-size:23px;

    }

    .details{

        grid-template-columns:1fr;

    }

    .seller-top{

        flex-direction:column;

    }

    .actions{

        display:grid;

        grid-template-columns:
            1fr 1fr;

    }

    .action-btn{

        width:100%;

    }

}

@media(max-width:380px){

    .actions{

        grid-template-columns:1fr;

    }

}

</style>

</head>


<body>


<header>

    <div>

        <div class="header-title">
            👤 Utkala Mart - Seller Approval
        </div>

        <div class="header-sub">
            Office / Admin Management
        </div>

    </div>


    <button
        class="back-btn"
        id="backBtn">

        ← Dashboard

    </button>

</header>



<div class="container">


    <div class="admin-info">

        🔐 Logged in as:

        <strong id="adminEmail">
            Checking...
        </strong>

    </div>


    <div
        id="message"
        class="message">
    </div>



    <!-- STATS -->

    <div class="stats">


        <div class="stat">

            <div
                class="stat-number"
                id="totalCount">

                0

            </div>

            <div class="stat-label">
                Total Sellers
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="pendingCount">

                0

            </div>

            <div class="stat-label">
                Pending

            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="approvedCount">

                0

            </div>

            <div class="stat-label">
                Approved

            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="rejectedCount">

                0

            </div>

            <div class="stat-label">
                Rejected

            </div>

        </div>


    </div>



    <!-- FILTER -->

    <div class="filter-box">


        <button
            class="filter-btn active"
            data-filter="all">

            All

        </button>


        <button
            class="filter-btn"
            data-filter="pending">

            ⏳ Pending

        </button>


        <button
            class="filter-btn"
            data-filter="approved">

            ✅ Approved

        </button>


        <button
            class="filter-btn"
            data-filter="rejected">

            ❌ Rejected

        </button>


        <input
            type="search"
            id="searchInput"

    </div>



    <!-- SELLERS -->

    <div id="sellerList">

        <div class="loading">

            ⏳ Sellers Loading...

        </div>

    </div>


</div>



<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================================
   CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBYJ_KKsS_7SNz108jnw6hpOlmegofRhJg",

    authDomain:
        "utkalamart-1ec68.firebaseapp.com",

    projectId:
        "utkalamart-1ec68",

    storageBucket:
        "utkalamart-1ec68.firebasestorage.app",

    messagingSenderId:
        "664871353747",

    appId:
        "1:664871353747:web:96532fdafe78aabe7f3c66"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_EMAIL =
    "Suryakantabehera629@gmail.com";


/* =========================================================
   GLOBAL
========================================================= */

let allSellers = [];

let currentFilter =
    "all";


/* =========================================================
   ELEMENTS
========================================================= */

const sellerList =
    document.getElementById(
        "sellerList"
    );

const message =
    document.getElementById(
        "message"
    );


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "info"
){

    message.innerText =
        text;

    message.className =
        "message " + type;

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    try{

        if(
            value.toDate
        ){

            return value
            .toDate()
            .toLocaleString(
                "en-IN"
            );

        }


        if(
            typeof value ===
            "string"
        ){

            return new Date(
                value
            )
            .toLocaleString(
                "en-IN"
            );

        }


        return "-";

    }catch{

        return "-";

    }

}


/* =========================================================
   STATUS
========================================================= */

function getStatus(
    seller
){

    const status =
        String(
            seller.status ||
            seller.sellerStatus ||
            seller.approvalStatus ||
            "pending"
        )
        .toLowerCase();


    if(
        status === "approved" ||
        seller.approved === true
    ){

        return "approved";

    }


    if(
        status === "rejected"
    ){

        return "rejected";

    }


    return "pending";

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats(){

    let pending = 0;

    let approved = 0;

    let rejected = 0;


    allSellers.forEach(
        seller => {

            const status =
                getStatus(
                    seller
                );


            if(
                status ===
                "pending"
            ){

                pending++;

            }

            else if(
                status ===
                "approved"
            ){

                approved++;

            }

            else if(
                status ===
                "rejected"
            ){

                rejected++;

            }

        }
    );


    document.getElementById(
        "totalCount"
    ).innerText =
        allSellers.length;


    document.getElementById(
        "pendingCount"
    ).innerText =
        pending;


    document.getElementById(
        "approvedCount"
    ).innerText =
        approved;


    document.getElementById(
        "rejectedCount"
    ).innerText =
        rejected;

}


/* =========================================================
   RENDER
========================================================= */

function renderSellers(){

    updateStats();


    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    let filtered =
        allSellers.filter(
            seller => {

                const status =
                    getStatus(
                        seller
                    );


                if(
                    currentFilter !==
                    "all" &&
                    status !==
                    currentFilter
                ){

                    return false;

                }


                if(!search){

                    return true;

                }


                const text = [

                    seller.name,

                    seller.sellerName,

                    seller.fullName,

                    seller.email,

                    seller.mobile,

                    seller.phone,

                    seller.uid

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    if(
        !filtered.length
    ){

        sellerList.innerHTML = `

            <div class="empty">

                👤 କୌଣସି Seller ମିଳିଲା ନାହିଁ।

            </div>

        `;

        return;

    }


    sellerList.innerHTML = "";


    filtered.forEach(
        seller => {

            const status =
                getStatus(
                    seller
                );


            let statusText =
                "⏳ Pending";

            let statusClass =
                "status-pending";


            if(
                status ===
                "approved"
            ){

                statusText =
                    "✅ Approved";

                statusClass =
                    "status-approved";

            }


            if(
                status ===
                "rejected"
            ){

                statusText =
                    "❌ Rejected";

                statusClass =
                    "status-rejected";

            }


            const name =
                seller.name ||
                seller.sellerName ||
                seller.fullName ||
                "Seller";


            const mobile =
                seller.mobile ||
                seller.phone ||
                "-";


            const email =
                seller.email ||
                "-";


            const uid =
                seller.uid ||
                seller.sellerId ||
                seller.id ||
                "-";


            const created =
                formatDate(
                    seller.createdAt
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "seller-card";


            card.innerHTML = `

                <div class="seller-top">

                    <div>

                        <div class="seller-name">

                            👤 ${escapeHtml(name)}

                        </div>

                        <div class="seller-id">

                            Seller ID:
                            ${escapeHtml(uid)}

                        </div>

                    </div>


                    <span
                        class="status ${statusClass}">

                        ${statusText}

                    </span>

                </div>


                <div class="details">


                    <div class="detail">

                        <div class="detail-label">
                            📧 Email
                        </div>

                        <div class="detail-value">

                            ${escapeHtml(email)}

                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            📱 Mobile
                        </div>

                        <div class="detail-value">

                            ${escapeHtml(mobile)}

                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            📅 Registration
                        </div>

                        <div class="detail-value">

                            ${escapeHtml(created)}

                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            🔐 Status
                        </div>

                        <div class="detail-value">

                            ${escapeHtml(status)}

                        </div>

                    </div>


                </div>


                <div class="actions">


                    ${
                        status !== "approved"

                        ?

                        `

                        <button
                            class="action-btn approve"
                            data-action="approve"
                            data-id="${escapeHtml(uid)}">

                            ✅ Approve

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        status !== "rejected"

                        ?

                        `

                        <button
                            class="action-btn reject"
                            data-action="reject"
                            data-id="${escapeHtml(uid)}">

                            ❌ Reject

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        status === "rejected"

                        ?

                        `

                        <button
                            class="action-btn restore"
                            data-action="approve"
                            data-id="${escapeHtml(uid)}">

                            🔄 Approve Again

                        </button>

                        `

                        :

                        ""

                    }


                    <button
                        class="action-btn delete"
                        data-action="delete"
                        data-id="${escapeHtml(uid)}">

                        🗑️ Delete

                    </button>


                </div>

            `;


            sellerList.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   APPROVE
========================================================= */

async function approveSeller(
    id
){

    const seller =
        allSellers.find(
            item =>
                (
                    item.uid ||
                    item.sellerId ||
                    item.id
                ) === id
        );


    if(!seller){

        return;

    }


    const name =
        seller.name ||
        seller.sellerName ||
        "Seller";


    const ok =
        confirm(
            `"${name}" କୁ Seller ଭାବେ Approve କରିବେ କି?`
        );


    if(!ok){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "sellers",
                id
            ),
            {

                status:
                    "approved",

                sellerStatus:
                    "approved",

                approvalStatus:
                    "approved",

                approved:
                    true,

                approvedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            }
        );


        showMessage(
            "✅ Seller Approved ହୋଇଗଲା।",
            "success"
        );


    }catch(error){

        console.error(
            error
        );


        showMessage(
            "❌ Seller Approve ହୋଇପାରିଲା ନାହିଁ। Firestore Rules check କରନ୍ତୁ।",
            "error"
        );

    }

}


/* =========================================================
   REJECT
========================================================= */

async function rejectSeller(
    id
){

    const seller =
        allSellers.find(
            item =>
                (
                    item.uid ||
                    item.sellerId ||
                    item.id
                ) === id
        );


    if(!seller){

        return;

    }


    const name =
        seller.name ||
        seller.sellerName ||
        "Seller";


    const ok =
        confirm(
            `"${name}" ଙ୍କ Seller Application Reject କରିବେ କି?`
        );


    if(!ok){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "sellers",
                id
            ),
            {

                status:
                    "rejected",

                sellerStatus:
                    "rejected",

                approvalStatus:
                    "rejected",

                approved:
                    false,

                rejectedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            }
        );


        showMessage(
            "❌ Seller Rejected ହୋଇଗଲା।",
            "success"
        );


    }catch(error){

        console.error(
            error
        );


        showMessage(
            "❌ Seller Reject ହୋଇପାରିଲା ନାହିଁ।",
            "error"
        );

    }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteSeller(
    id
){

    const seller =
        allSellers.find(
            item =>
                (
                    item.uid ||
                    item.sellerId ||
                    item.id
                ) === id
        );


    if(!seller){

        return;

    }


    const name =
        seller.name ||
        seller.sellerName ||
        "Seller";


    const ok =
        confirm(
            `⚠️ "${name}" କୁ sellers list ରୁ Delete କରିବେ କି?\n\nଏହି action ପରେ seller profile document delete ହୋଇଯିବ।`
        );


    if(!ok){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "sellers",
                id
            )
        );


        showMessage(
            "🗑️ Seller profile Delete ହୋଇଗଲା।",
            "success"
        );


    }catch(error){

        console.error(
            error
        );


        showMessage(
            "❌ Seller Delete ହୋଇପାରିଲା ନାହିଁ। Firestore Rules check କରନ୍ତୁ।",
            "error"
        );

    }

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

sellerList.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest(
                "button[data-action]"
            );


        if(!button){

            return;

        }


        const action =
            button.dataset.action;


        const id =
            button.dataset.id;


        button.disabled =
            true;


        try{

            if(
                action ===
                "approve"
            ){

                await approveSeller(
                    id
                );

            }

            else if(
                action ===
                "reject"
            ){

                await rejectSeller(
                    id
                );

            }

            else if(
                action ===
                "delete"
            ){

                await deleteSeller(
                    id
                );

            }

        }finally{

            button.disabled =
                false;

        }

    }
);


/* =========================================================
   FILTER BUTTONS
========================================================= */

document
.querySelectorAll(
    ".filter-btn"
)
.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                document
                .querySelectorAll(
                    ".filter-btn"
                )
                .forEach(
                    btn =>
                        btn.classList.remove(
                            "active"
                        )
                );


                button.classList.add(
                    "active"
                );


                currentFilter =
                    button.dataset.filter;


                renderSellers();

            }
        );

    }
);


/* =========================================================
   SEARCH
========================================================= */

document
.getElementById(
    "searchInput"
)
.addEventListener(
    "input",
    () => {

        renderSellers();

    }
);


/* =========================================================
   LOAD SELLERS
========================================================= */

function loadSellers(){

    sellerList.innerHTML = `

        <div class="loading">

            ⏳ Sellers Loading...

        </div>

    `;


    onSnapshot(
        collection(
            db,
            "sellers"
        ),

        snapshot => {

            allSellers =
                [];


            snapshot.forEach(
                sellerDoc => {

                    allSellers.push({

                        id:
                            sellerDoc.id,

                        ...sellerDoc.data()

                    });

                }
            );


            /*
              Newest first
            */

            allSellers.sort(
                (
                    a,
                    b
                ) => {

                    const aTime =
                        a.createdAt
                        ?.seconds ||
                        0;

                    const bTime =
                        b.createdAt
                        ?.seconds ||
                        0;

                    return bTime - aTime;

                }
            );


            renderSellers();

        },

        error => {

            console.error(
                "Seller Load Error:",
                error
            );


            sellerList.innerHTML = `

                <div class="message error">

                    ❌ Seller list load ହୋଇପାରିଲା ନାହିଁ।

                    <br><br>

                    Firebase Firestore Rules
                    check କରନ୍ତୁ।

                </div>

            `;

        }
    );

}


/* =========================================================
   AUTH CHECK
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            window.location.href =
                "admin-login.html";

            return;

        }


        if(
            !user.email ||
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ){

            window.location.href =
                "admin-login.html";

            return;

        }


        document.getElementById(
            "adminEmail"
        ).innerText =
            user.email;


        loadSellers();

    }
);
