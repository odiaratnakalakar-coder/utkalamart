<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>UtkalaMart - Product Details</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        "Noto Sans Oriya",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:#f4f6f8;

    color:#17233c;

}

button,
input,
select{

    font-family:inherit;

}

button{

    cursor:pointer;

}

a{

    text-decoration:none;

    color:inherit;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

    background:#063b78;

    color:white;

    padding:8px 5%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:13px;

}

.topbar-right{

    display:flex;

    gap:20px;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    background:white;

    padding:14px 5%;

    display:flex;

    align-items:center;

    gap:25px;

    box-shadow:
        0 2px 10px
        rgba(0,0,0,.10);

    position:sticky;

    top:0;

    z-index:100;

}


/* LOGO */

.logo{

    min-width:220px;

    display:flex;

    align-items:center;

    gap:10px;

}

.logo-icon{

    width:52px;

    height:52px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ff7900,
            #087f3f
        );

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    font-size:25px;

}

.logo h1{

    color:#123a78;

    font-size:27px;

    line-height:1;

}

.logo h1 span{

    color:#ff6b00;

}

.logo p{

    color:#087f3f;

    font-size:10px;

    margin-top:5px;

}


/* SEARCH */

.search{

    flex:1;

    height:45px;

    display:flex;

    border:
        2px solid #e1e5ea;

    border-radius:25px;

    overflow:hidden;

}

.search input{

    flex:1;

    border:0;

    outline:0;

    padding:0 18px;

    font-size:14px;

}

.search button{

    width:60px;

    border:0;

    background:#ff6b00;

    color:white;

    font-size:19px;

}


/* HEADER ACTIONS */

.header-actions{

    display:flex;

    align-items:center;

    gap:18px;

}

.header-action{

    text-align:center;

    color:#123a78;

    font-size:11px;

}

.header-action-icon{

    display:block;

    font-size:22px;

    margin-bottom:2px;

}


/* =====================================================
   NAV
===================================================== */

.nav{

    background:#062d61;

    color:white;

    display:flex;

    justify-content:center;

    overflow-x:auto;

    white-space:nowrap;

}

.nav a{

    padding:13px 18px;

    font-size:13px;

    border-right:
        1px solid
        rgba(255,255,255,.12);

}

.nav a:hover{

    background:#ff6b00;

}


/* =====================================================
   BREADCRUMB
===================================================== */

.breadcrumb{

    max-width:1250px;

    margin:20px auto 0;

    padding:0 20px;

    color:#687386;

    font-size:13px;

}

.breadcrumb a{

    color:#087f3f;

    font-weight:bold;

}

.breadcrumb span{

    margin:0 7px;

}


/* =====================================================
   MAIN PRODUCT
===================================================== */

.product-container{

    max-width:1250px;

    margin:20px auto 50px;

    padding:0 20px;

}

.product-main{

    background:white;

    border-radius:18px;

    padding:25px;

    display:grid;

    grid-template-columns:
        48% 52%;

    gap:35px;

    box-shadow:
        0 4px 20px
        rgba(0,0,0,.07);

}


/* =====================================================
   IMAGE AREA
===================================================== */

.image-area{

    position:relative;

}

.main-image-box{

    width:100%;

    height:520px;

    background:#f5f6f8;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border:
        1px solid #e4e7eb;

}

.main-image{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

}

.image-placeholder{

    font-size:100px;

    display:none;

}


/* DISCOUNT */

.discount-badge{

    position:absolute;

    top:15px;

    left:15px;

    background:#087f3f;

    color:white;

    padding:8px 13px;

    border-radius:7px;

    font-size:13px;

    font-weight:bold;

}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info{

    padding:5px 10px;

}

.category{

    color:#087f3f;

    font-size:14px;

    font-weight:bold;

    margin-bottom:8px;

}

.product-name{

    font-size:32px;

    color:#17233c;

    line-height:1.4;

    margin-bottom:5px;

}

.product-name-en{

    color:#777;

    font-size:16px;

    margin-bottom:12px;

}

.rating-row{

    display:flex;

    align-items:center;

    gap:10px;

    margin:10px 0;

}

.stars{

    color:#ffae00;

    font-size:18px;

}

.review-text{

    color:#087f3f;

    font-size:13px;

}


/* PRICE */

.price-box{

    margin-top:15px;

    padding:18px;

    background:#fff8ef;

    border-radius:12px;

}

.selling-price{

    color:#123a78;

    font-size:34px;

    font-weight:bold;

}

.mrp{

    color:#888;

    font-size:14px;

    text-decoration:line-through;

    margin-left:10px;

}

.discount-text{

    color:#087f3f;

    font-size:14px;

    font-weight:bold;

    margin-left:8px;

}


/* =====================================================
   PRODUCT DETAILS
===================================================== */

.details-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    margin-top:18px;

}

.detail{

    background:#f7f9fb;

    padding:12px;

    border-radius:8px;

}

.detail-label{

    color:#777;

    font-size:11px;

}

.detail-value{

    color:#17233c;

    font-size:14px;

    font-weight:bold;

    margin-top:4px;

}


/* =====================================================
   STOCK
===================================================== */

.stock-box{

    margin-top:18px;

    padding:12px;

    border-radius:8px;

    background:#eafff1;

    color:#087f3f;

    font-weight:bold;

}

.out-stock{

    background:#fff0f0;

    color:#c62828;

}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-title{

    margin-top:22px;

    margin-bottom:8px;

    font-size:14px;

    font-weight:bold;

}

.quantity-box{

    display:flex;

    align-items:center;

    width:145px;

    height:42px;

    border:
        1px solid #d8dde5;

    border-radius:8px;

    overflow:hidden;

}

.quantity-box button{

    width:42px;

    height:100%;

    border:0;

    background:#f0f2f5;

    font-size:20px;

    color:#123a78;

}

.quantity-box input{

    width:60px;

    height:100%;

    text-align:center;

    border:0;

    outline:0;

    font-size:16px;

    font-weight:bold;

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.action-buttons{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

    margin-top:20px;

}

.cart-btn{

    padding:15px;

    background:#ffb000;

    color:#17233c;

    border:0;

    border-radius:9px;

    font-size:15px;

    font-weight:bold;

}

.buy-btn{

    padding:15px;

    background:#ff6b00;

    color:white;

    border:0;

    border-radius:9px;

    font-size:15px;

    font-weight:bold;

}

.cart-btn:hover{

    background:#ffc329;

}

.buy-btn:hover{

    background:#e95500;

}


/* =====================================================
   SELLER
===================================================== */

.seller-box{

    margin-top:20px;

    border:
        1px solid #e0e4e9;

    border-radius:12px;

    padding:16px;

}

.seller-title{

    color:#123a78;

    font-size:17px;

    font-weight:bold;

    margin-bottom:10px;

}

.seller-row{

    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-top:7px;

    font-size:13px;

}

.seller-label{

    color:#777;

}

.seller-value{

    font-weight:bold;

    text-align:right;

}


/* =====================================================
   DESCRIPTION
===================================================== */

.description-section{

    background:white;

    margin-top:20px;

    padding:25px;

    border-radius:18px;

    box-shadow:
        0 4px 20px
        rgba(0,0,0,.06);

}

.description-section h2{

    color:#123a78;

    font-size:23px;

    margin-bottom:15px;

    border-bottom:
        2px solid #ff6b00;

    padding-bottom:10px;

}

.description{

    color:#555;

    line-height:1.9;

    font-size:15px;

    white-space:pre-line;

}

.description-en{

    margin-top:20px;

    padding-top:20px;

    border-top:
        1px solid #e5e7eb;

    color:#555;

    line-height:1.7;

    font-size:14px;

}


/* =====================================================
   SEARCH KEYWORDS
===================================================== */

.keyword-list{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:15px;

}

.keyword{

    background:#edf5ff;

    color:#063b78;

    padding:6px 10px;

    border-radius:15px;

    font-size:11px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    max-width:700px;

    margin:70px auto;

    text-align:center;

    background:white;

    padding:40px;

    border-radius:15px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.08);

    color:#123a78;

    font-size:18px;

}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    display:none;

    max-width:700px;

    margin:70px auto;

    padding:40px 20px;

    text-align:center;

    background:white;

    border-radius:15px;

}

.error-box h2{

    color:#d32f2f;

    margin-bottom:10px;

}

.back-btn{

    display:inline-block;

    margin-top:20px;

    padding:12px 20px;

    background:#063b78;

    color:white;

    border-radius:8px;

}


/* =====================================================
   TOAST
===================================================== */

.toast{

    position:fixed;

    right:20px;

    bottom:20px;

    background:#063b78;

    color:white;

    padding:15px 20px;

    border-radius:10px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.25);

    display:none;

    z-index:999;

    max-width:350px;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    background:#062d61;

    color:white;

    padding:40px 5% 20px;

    text-align:center;

}

.footer h2{

    font-size:25px;

}

.footer h2 span{

    color:#ff7900;

}

.footer p{

    color:#d5e1ef;

    margin-top:8px;

    font-size:13px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .topbar-right{

        display:none;

    }

    .header{

        flex-wrap:wrap;

        gap:10px;

    }

    .logo{

        min-width:auto;

        flex:1;

    }

    .search{

        order:3;

        flex-basis:100%;

    }

    .product-main{

        grid-template-columns:1fr;

        gap:20px;

    }

    .main-image-box{

        height:420px;

    }

    .product-name{

        font-size:27px;

    }

}


@media(max-width:550px){

    .header{

        padding:11px 4%;

    }

    .logo h1{

        font-size:23px;

    }

    .logo-icon{

        width:45px;

        height:45px;

        font-size:22px;

    }

    .header-action span:last-child{

        display:none;

    }

    .nav{

        justify-content:flex-start;

    }

    .nav a{

        padding:11px 13px;

        font-size:12px;

    }

    .product-container{

        padding:0 10px;

    }

    .product-main{

        padding:15px;

    }

    .main-image-box{

        height:330px;

    }

    .product-name{

        font-size:23px;

    }

    .selling-price{

        font-size:28px;

    }

    .details-grid{

        grid-template-columns:1fr;

    }

    .action-buttons{

        grid-template-columns:1fr;

    }

    .description-section{

        padding:18px;

    }

}


/* =====================================================
   END
===================================================== */

</style>

</head>
