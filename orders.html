<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ===============================
FIREBASE CONFIG
================================ */

const firebaseConfig = {

    apiKey:
        "AIzaSyBYJ_KKsS_7SNz108jnw6hpOlmegofRhJg",

    authDomain:
        "utkalamart-1ec68.firebaseapp.com",

    projectId:
        "utkalamart-1ec68",

    storageBucket:
        "utkalamart-1ec68.firebasestorage.app",

    messagingSenderId:
        "664871353747",

    appId:
        "1:664871353747:web:96532fdafe78aabe7f3c66"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);


/* ===============================
VARIABLES
================================ */

let allOrders = [];

let currentFilter = "all";

let selectedCancelOrder = null;


/* ===============================
STATUS
================================ */

function normalizeStatus(status){

    let value =
        String(
            status || "placed"
        )
        .toLowerCase()
        .trim();


    if(
        value === "placed" ||
        value === "order placed"
    ){

        return "pending";

    }


    if(
        value === "processing" ||
        value === "order confirmed" ||
        value === "confirmed"
    ){

        return "confirmed";

    }


    if(
        value === "order shipped" ||
        value === "shipped"
    ){

        return "shipped";

    }


    if(
        value === "order delivered" ||
        value === "delivered"
    ){

        return "delivered";

    }


    if(
        value === "cancelled" ||
        value === "canceled"
    ){

        return "cancelled";

    }


    return value;

}


function statusText(status){

    const map = {

        pending:"Pending",

        confirmed:"Confirmed",

        shipped:"Shipped",

        delivered:"Delivered",

        cancelled:"Cancelled"

    };


    return (
        map[status] ||
        status
    );

}


/* ===============================
ESCAPE
================================ */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(match){

            const chars = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            };

            return chars[match];

        }
    );

}


/* ===============================
DATE
================================ */

function formatDate(value){

    if(!value){

        return "Date unavailable";

    }


    try{

        let date;


        if(
            value &&
            typeof value.toDate ===
            "function"
        ){

            date =
                value.toDate();

        }
        else{

            date =
                new Date(value);

        }


        if(
            isNaN(
                date.getTime()
            )
        ){

            return "Date unavailable";

        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        );

    }
    catch(error){

        return "Date unavailable";

    }

}


/* ===============================
NUMBER
================================ */

function money(value){

    const number =
        Number(value || 0);


    return "₹" +
        number.toLocaleString(
            "en-IN"
        );

}


/* ===============================
IMAGE
================================ */

function productImage(item){

    if(!item){

        return "logo.png";

    }


    return (
        item.image ||
        item.imageUrl ||
        item.photo ||
        item.productImage ||
        "logo.png"
    );

}


/* ===============================
LOAD FIREBASE ORDERS
================================ */

async function loadOrders(){

    const container =
        document.getElementById(
            "ordersContainer"
        );


    container.innerHTML = `

        <div class="loading">

            ⏳ Firebase ରୁ Real Orders Loading...

        </div>

    `;


    try{

        const snapshot =
            await getDocs(

                collection(
                    db,
                    "orderTracking"
                )

            );


        allOrders = [];


        snapshot.forEach(
            function(orderDoc){

                const data =
                    orderDoc.data();


                let orderId =
                    data.orderId;


                if(!orderId){

                    const parts =
                        orderDoc.id.split("_");

                    orderId =
                        parts[0] ||
                        orderDoc.id;

                }


                let items =
                    Array.isArray(
                        data.items
                    )
                    ?
                    data.items
                    :
                    [];


                allOrders.push({

                    firestoreId:
                        orderDoc.id,

                    orderId:
                        orderId,

                    status:
                        normalizeStatus(
                            data.orderStatus
                        ),

                    items:
                        items,

                    total:
                        Number(
                            data.total ||
                            data.amount ||
                            0
                        ),

                    createdAt:
                        data.createdAt ||
                        data.placedAt ||
                        null,

                    updatedAt:
                        data.updatedAt ||
                        null,

                    mobile:
                        data.mobile ||
                        data.customer?.mobile ||
                        "",

                    customer:
                        data.customer ||
                        {},

                    estimatedDelivery:
                        data.estimatedDelivery ||
                        ""

                });

            }
        );


        /* =========================
           NEWEST FIRST
        ========================= */

        allOrders.sort(
            function(a,b){

                const aTime =
                    getTime(
                        a.createdAt
                    );


                const bTime =
                    getTime(
                        b.createdAt
                    );


                return bTime - aTime;

            }
        );


        displayOrders();

    }
    catch(error){

        console.error(
            "Firebase Order Error:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                <div class="empty-icon">
                    ❌
                </div>

                <h3>
                    Orders Load Error
                </h3>

                <p>
                    Firebase ରୁ Order ଆସିପାରିଲା ନାହିଁ।
                </p>

                <p>
                    Firestore Rules ଏବଂ
                    orderTracking collection
                    check କରନ୍ତୁ।
                </p>

                <button
                    class="retry-btn"
                    onclick="loadOrders()">

                    🔄 Retry

                </button>

            </div>

        `;

    }

}


/* ===============================
TIME
================================ */

function getTime(value){

    if(!value)
        return 0;


    try{

        if(
            value &&
            typeof value.toMillis ===
            "function"
        ){

            return value.toMillis();

        }


        if(
            value &&
            typeof value.toDate ===
            "function"
        ){

            return value.toDate().getTime();

        }


        return new Date(
            value
        ).getTime() || 0;

    }
    catch(error){

        return 0;

    }

}


/* ===============================
DISPLAY
================================ */

function displayOrders(){

    const container =
        document.getElementById(
            "ordersContainer"
        );


    let orders =
        [...allOrders];


    if(
        currentFilter !== "all"
    ){

        orders =
            orders.filter(
                function(order){

                    return (
                        normalizeStatus(
                            order.status
                        ) ===
                        currentFilter
                    );

                }
            );

    }


    if(!orders.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>

                <h3>
                    କୌଣସି Order ନାହିଁ
                </h3>

                <p>
                    ଏହି category ରେ
                    ବର୍ତ୍ତମାନ କୌଣସି Order ନାହିଁ।
                </p>

                <a
                    href="index.html"
                    class="shop-btn">

                    🛍️ Shopping କରନ୍ତୁ

                </a>

            </div>

        `;

        return;

    }


    container.innerHTML =
        orders
        .map(
            createOrderCard
        )
        .join("");

}


/* ===============================
CREATE ORDER CARD
================================ */

function createOrderCard(order){

    const item =
        order.items &&
        order.items.length
        ?
        order.items[0]
        :
        {};


    const productName =
        item.name ||
        item.productName ||
        item.title ||
        "Utkala Mart Product";


    const quantity =
        Number(
            item.quantity ||
            item.qty ||
            1
        );


    const image =
        productImage(
            item
        );


    const status =
        normalizeStatus(
            order.status
        );


    const canCancel =
        status === "pending" ||
        status === "confirmed";


    return `

        <div class="order-card">

            <div class="order-head">

                <div>

                    <div class="order-id">

                        📦 Order #${escapeHtml(
                            order.orderId
                        )}

                    </div>

                    <div class="order-date">

                        ${formatDate(
                            order.createdAt
                        )}

                    </div>

                </div>


                <span
                    class="status ${status}">

                    ${statusText(
                        status
                    )}

                </span>

            </div>


            <div class="product">

                <div class="product-img">

                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(productName)}"
                        onerror="
                            this.onerror=null;
                            this.src='logo.png';
                        "
                    >

                </div>


                <div class="product-info">

                    <div class="product-name">

                        ${escapeHtml(
                            productName
                        )}

                    </div>


                    <small>

                        Quantity:
                        ${quantity}

                    </small>


                    ${
                        item.price
                        ?
                        `
                        <small>
                            Price:
                            ${money(item.price)}
                        </small>
                        `
                        :
                        ""
                    }


                    <small>

                        Utkala Mart Product

                    </small>

                </div>

            </div>


            <div class="order-bottom">

                <div>

                    <div class="amount-label">

                        Total Amount

                    </div>


                    <div class="amount">

                        ${money(
                            order.total
                        )}

                    </div>

                </div>


                <div class="actions">

                    <a
                        href="order-tracking.html?order=${encodeURIComponent(
                            order.orderId
                        )}"
                        class="btn">

                        🚚 Track

                    </a>


                    ${
                        canCancel
                        ?
                        `
                        <button
                            class="btn cancel"
                            onclick="openCancelModal(
                                '${escapeHtml(
                                    order.orderId
                                )}'
                            )">

                            ❌ Cancel Order

                        </button>
                        `
                        :
                        ""
                    }


                    <button
                        class="btn primary"
                        onclick="viewOrder(
                            '${escapeHtml(
                                order.orderId
                            )}'
                        )">

                        View

                    </button>

                </div>

            </div>

        </div>

    `;

}


/* ===============================
FILTER
================================ */

window.filterOrders =
function(
    status,
    button
){

    currentFilter =
        status;


    document
        .querySelectorAll(
            ".filter button"
        )
        .forEach(
            function(btn){

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    displayOrders();

};


/* ===============================
VIEW ORDER
================================ */

window.viewOrder =
function(orderId){

    const order =
        allOrders.find(
            function(item){

                return (
                    item.orderId ===
                    orderId
                );

            }
        );


    if(!order)
        return;


    const item =
        order.items?.[0] ||
        {};


    const name =
        item.name ||
        item.productName ||
        item.title ||
        "Product";


    const quantity =
        Number(
            item.quantity ||
            item.qty ||
            1
        );


    alert(

        "📦 Order Details\n\n" +

        "Order: #" +
        order.orderId +

        "\n\n" +

        "Product: " +
        name +

        "\n" +

        "Quantity: " +
        quantity +

        "\n" +

        "Amount: " +
        money(order.total) +

        "\n\n" +

        "Status: " +
        statusText(
            normalizeStatus(
                order.status
            )
        )

    );

};


/* ===============================
OPEN CANCEL
================================ */

window.openCancelModal =
function(orderId){

    const order =
        allOrders.find(
            function(item){

                return (
                    item.orderId ===
                    orderId
                );

            }
        );


    if(!order){

        alert(
            "Order ମିଳିଲା ନାହିଁ।"
        );

        return;

    }


    const status =
        normalizeStatus(
            order.status
        );


    if(
        status !== "pending" &&
        status !== "confirmed"
    ){

        alert(
            "ଏହି Order ବର୍ତ୍ତମାନ Cancel କରିହେବ ନାହିଁ।"
        );

        return;

    }


    selectedCancelOrder =
        order;


    const item =
        order.items?.[0] ||
        {};


    const name =
        item.name ||
        item.productName ||
        item.title ||
        "Product";


    document.getElementById(
        "cancelOrderDetails"
    ).innerHTML = `

        <b>
            Order #${escapeHtml(
                order.orderId
            )}
        </b>

        <br><br>

        Product:
        ${escapeHtml(name)}

        <br>

        Amount:
        <b>
            ${money(order.total)}
        </b>

    `;


    document.getElementById(
        "cancelReason"
    ).value = "";


    document.getElementById(
        "cancelModal"
    ).style.display =
        "block";

};


/* ===============================
CLOSE CANCEL
================================ */

window.closeCancelModal =
function(){

    document.getElementById(
        "cancelModal"
    ).style.display =
        "none";


    selectedCancelOrder =
        null;

};


/* ===============================
SUBMIT CANCEL REQUEST
================================ */

window.submitCancelRequest =
async function(){

    if(!selectedCancelOrder){

        alert(
            "Order select କରନ୍ତୁ।"
        );

        return;

    }


    const reason =
        document
        .getElementById(
            "cancelReason"
        )
        .value
        .trim();


    if(!reason){

        alert(
            "Cancel କରିବାର କାରଣ ଲେଖନ୍ତୁ।"
        );

        return;

    }


    const button =
        document.getElementById(
            "submitCancelBtn"
        );


    button.disabled =
        true;


    button.textContent =
        "⏳ Saving...";


    try{

        const request = {

            orderId:
                selectedCancelOrder.orderId,

            product:
                selectedCancelOrder
                .items?.[0]?.name ||
                "Product",

            amount:
                Number(
                    selectedCancelOrder.total ||
                    0
                ),

            reason:
                reason,

            status:
                "Pending",

            date:
                new Date()
                .toLocaleDateString(
                    "en-IN"
                ),

            createdAt:
                new Date()
                .toISOString(),

            updatedAt:
                new Date()
                .toISOString()

        };


        await addDoc(

            collection(
                db,
                "orderCancellations"
            ),

            request

        );


        alert(
            "✅ Cancel Request ସଫଳତାର ସହିତ Admin ପାଖକୁ ପଠାଯାଇଛି।"
        );


        closeCancelModal();


    }
    catch(error){

        console.error(
            "Cancel Error:",
            error
        );


        alert(
            "❌ Cancel Request save ହୋଇନାହିଁ। Firebase Rules check କରନ୍ତୁ।"
        );

    }


    button.disabled =
        false;


    button.textContent =
        "❌ Cancel Request Submit";

};


/* ===============================
MODAL OUTSIDE CLICK
================================ */

window.onclick =
function(event){

    const modal =
        document.getElementById(
            "cancelModal"
        );


    if(
        event.target ===
        modal
    ){

        closeCancelModal();

    }

};


/* ===============================
START
================================ */

loadOrders();

</script>
