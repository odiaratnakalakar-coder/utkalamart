<script type="module">


/* =====================================
   FIREBASE IMPORT
===================================== */

import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBYJ_KKsS_7SNz108jnw6hpOlmegofRhJg",

    authDomain:
        "utkalamart-1ec68.firebaseapp.com",

    projectId:
        "utkalamart-1ec68",

    storageBucket:
        "utkalamart-1ec68.firebasestorage.app",

    messagingSenderId:
        "664871353747",

    appId:
        "1:664871353747:web:96532fdafe78aabe7f3c66"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);


/* =====================================
   DEMO ORDERS
===================================== */

const demoOrders = [

    {
        id:"UTK10001",

        date:"20 Sep 2026",

        product:"ଗଞ୍ଜାମ ପାପଡ଼",

        quantity:2,

        amount:"₹240",

        status:"delivered",

        emoji:"🥣"

    },


    {
        id:"UTK10002",

        date:"18 Sep 2026",

        product:"ହସ୍ତ ତିଆରି ଝୁଡ଼ି",

        quantity:1,

        amount:"₹350",

        status:"shipped",

        emoji:"🧺"

    },


    {
        id:"UTK10003",

        date:"12 Sep 2026",

        product:"Sambalpuri Shirt",

        quantity:1,

        amount:"₹850",

        status:"confirmed",

        emoji:"👕"

    }

];


/* =====================================
   VARIABLES
===================================== */

let currentFilter =
    "all";


let selectedCancelOrder =
    null;


const CANCEL_KEY =
    "utkalaOrderCancellations";


/* =====================================
   STATUS TEXT
===================================== */

function getStatusText(
    status
){

    const text = {

        pending:
            "Pending",

        confirmed:
            "Confirmed",

        shipped:
            "Shipped",

        delivered:
            "Delivered",

        cancelled:
            "Cancelled"

    };


    return (
        text[status] ||
        status
    );

}


/* =====================================
   GET FIREBASE CANCEL REQUESTS
===================================== */

async function getCancellationRequests(){

    try{

        const snapshot =
            await getDocs(

                collection(
                    db,
                    "orderCancellations"
                )

            );


        const requests = [];


        snapshot.forEach(
            item => {

                requests.push({

                    ...item.data(),

                    firestoreId:
                        item.id

                });

            }
        );


        return requests;

    }

    catch(error){

        console.error(
            "Cancellation Load Error:",
            error
        );


        return [];

    }

}


/* =====================================
   GET ALL CANCEL REQUESTS
===================================== */

async function getAllCancelRequests(){

    const firestoreRequests =
        await getCancellationRequests();


    const localRequests =
        JSON.parse(

            localStorage.getItem(
                CANCEL_KEY
            ) || "[]"

        );


    const map =
        new Map();


    firestoreRequests.forEach(
        item => {

            if(item.id){

                map.set(
                    item.id,
                    item
                );

            }

        }
    );


    localRequests.forEach(
        item => {

            if(
                item.id &&
                !map.has(item.id)
            ){

                map.set(
                    item.id,
                    item
                );

            }

        }
    );


    return Array.from(
        map.values()
    );

}


/* =====================================
   OPEN CANCEL MODAL
===================================== */

window.openCancelModal =
async function(orderId){

    const order =
        demoOrders.find(
            item =>
                item.id ===
                orderId
        );


    if(!order){

        alert(
            "Order ମିଳିଲା ନାହିଁ।"
        );

        return;

    }


    if(
        order.status !==
            "pending" &&

        order.status !==
            "confirmed"
    ){

        alert(
            "ଏହି Order ବର୍ତ୍ତମାନ Cancel କରିହେବ ନାହିଁ।"
        );

        return;

    }


    const requests =
        await getAllCancelRequests();


    const existing =
        requests.find(
            item =>

                item.orderId ===
                order.id &&

                item.status !==
                "Rejected"
        );


    if(existing){

        alert(
            "ଏହି Order ପାଇଁ Cancel Request ପୂର୍ବରୁ ପଠାଯାଇଛି।"
        );

        return;

    }


    selectedCancelOrder =
        order;


    document.getElementById(
        "cancelOrderDetails"
    ).innerHTML = `

        <b>
            Order #${order.id}
        </b>

        <br><br>

        Product:
        ${order.product}

        <br>

        Quantity:
        ${order.quantity}

        <br>

        Amount:
        <b>${order.amount}</b>

    `;


    document.getElementById(
        "cancelReason"
    ).value = "";


    document.getElementById(
        "cancelModal"
    ).style.display =
        "block";

};


/* =====================================
   CLOSE CANCEL MODAL
===================================== */

window.closeCancelModal =
function(){

    document.getElementById(
        "cancelModal"
    ).style.display =
        "none";


    selectedCancelOrder =
        null;

};


/* =====================================
   SUBMIT CANCEL REQUEST
===================================== */

window.submitCancelRequest =
async function(){

    if(!selectedCancelOrder){

        alert(
            "Order select କରନ୍ତୁ।"
        );

        return;

    }


    const reason =
        document.getElementById(
            "cancelReason"
        ).value.trim();


    if(!reason){

        alert(
            "Cancel କରିବାର କାରଣ ଲେଖନ୍ତୁ।"
        );

        return;

    }


    const submitBtn =
        document.getElementById(
            "submitCancelBtn"
        );


    submitBtn.disabled =
        true;


    submitBtn.textContent =
        "⏳ Saving...";


    const cancelId =
        "CNL" +
        Date.now();


    const request = {

        id:
            cancelId,

        orderId:
            selectedCancelOrder.id,

        product:
            selectedCancelOrder.product,

        quantity:
            selectedCancelOrder.quantity,

        amount:
            selectedCancelOrder.amount,

        reason:
            reason,

        status:
            "Pending",

        date:
            new Date().toLocaleDateString(
                "en-IN"
            ),

        createdAt:
            new Date().toISOString(),

        updatedAt:
            new Date().toISOString()

    };


    try{

        /* ==============================
           FIREBASE SAVE
        ============================== */

        await setDoc(

            doc(
                db,
                "orderCancellations",
                cancelId
            ),

            request,

            {
                merge:true
            }

        );


        /* ==============================
           LOCAL BACKUP
        ============================== */

        let localRequests =
            JSON.parse(

                localStorage.getItem(
                    CANCEL_KEY
                ) || "[]"

            );


        localRequests.unshift(
            request
        );


        localStorage.setItem(

            CANCEL_KEY,

            JSON.stringify(
                localRequests
            )

        );


        alert(
            "✅ Cancel Request Admin ପାଖକୁ ସଫଳତାର ସହିତ ପଠାଯାଇଛି।"
        );


        closeCancelModal();


        displayOrders();

    }

    catch(error){

        console.error(
            "Cancel Request Error:",
            error
        );


        /*
        Firebase fail ହେଲେ
        Local backup
        */

        let localRequests =
            JSON.parse(

                localStorage.getItem(
                    CANCEL_KEY
                ) || "[]"

            );


        localRequests.unshift(
            request
        );


        localStorage.setItem(

            CANCEL_KEY,

            JSON.stringify(
                localRequests
            )

        );


        alert(
            "⚠️ Firebase connection problem। Request phone ରେ save ହୋଇଛି।"
        );


        closeCancelModal();


        displayOrders();

    }


    submitBtn.disabled =
        false;


    submitBtn.textContent =
        "❌ Cancel Request Submit";

};


/* =====================================
   DISPLAY ORDERS
===================================== */

async function displayOrders(){

    const container =
        document.getElementById(
            "ordersContainer"
        );


    container.innerHTML = `

        <div class="loading">

            ⏳ Orders Loading...

        </div>

    `;


    let orders =
        demoOrders;


    if(
        currentFilter !==
        "all"
    ){

        orders =
            demoOrders.filter(
                order =>

                    order.status ===
                    currentFilter
            );

    }


    if(
        orders.length ===
        0
    ){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>

                <h3>
                    କୌଣସି Order ନାହିଁ
                </h3>

                <p>
                    ଏହି category ରେ
                    ବର୍ତ୍ତମାନ କୌଣସି Order ନାହିଁ।
                </p>

                <a
                    href="index.html"
                    class="shop-btn">

                    🛍️ Shopping କରନ୍ତୁ

                </a>

            </div>

        `;

        return;

    }


    const cancelRequests =
        await getAllCancelRequests();


    container.innerHTML =
        orders.map(

            order => {


                const cancelRequest =
                    cancelRequests.find(

                        item =>

                            item.orderId ===
                            order.id &&

                            item.status !==
                            "Rejected"

                    );


                let cancelButton =
                    "";


                /*
                =========================
                CANCEL BUTTON
                =========================
                */

                if(

                    order.status ===
                        "pending" ||

                    order.status ===
                        "confirmed"

                ){

                    if(
                        cancelRequest
                    ){

                        cancelButton = `

                            <button
                                class="btn pending-cancel"
                                disabled>

                                ⏳ Cancel Pending

                            </button>

                        `;

                    }

                    else{

                        cancelButton = `

                            <button
                                class="btn cancel"
                                onclick="openCancelModal(
                                    '${order.id}'
                                )">

                                ❌ Cancel Order

                            </button>

                        `;

                    }

                }


                let cancelInfo =
                    "";


                if(
                    cancelRequest
                ){

                    cancelInfo = `

                        <div
                            class="cancel-info">

                            ⏳ Cancel Request:
                            <b>
                                ${cancelRequest.status}
                            </b>

                            <br>

                            Return/Cancel ID:
                            ${cancelRequest.id}

                        </div>

                    `;

                }


                return `

                <div class="order-card">

                    <div class="order-head">

                        <div>

                            <div class="order-id">

                                Order #${order.id}

                            </div>

                            <div class="order-date">

                                ${order.date}

                            </div>

                        </div>


                        <span
                            class="status ${order.status}">

                            ${getStatusText(
                                order.status
                            )}

                        </span>

                    </div>


                    <div class="product">

                        <div
                            class="product-img">

                            ${order.emoji}

                        </div>


                        <div
                            class="product-info">

                            <div
                                class="product-name">

                                ${order.product}

                            </div>


                            <small>

                                Quantity:
                                ${order.quantity}

                            </small>


                            <small>

                                Utkala Mart Product

                            </small>

                        </div>

                    </div>


                    <div class="order-bottom">

                        <div>

                            <div
                                class="amount-label">

                                Total Amount

                            </div>


                            <div class="amount">

                                ${order.amount}

                            </div>

                        </div>


                        <div class="actions">


                            <a
                                href="order-tracking.html?order=${order.id}"
                                class="btn">

                                🚚 Track

                            </a>


                            ${cancelButton}


                            <button
                                class="btn primary"
                                onclick="viewOrder(
                                    '${order.id}'
                                )">

                                View

                            </button>


                        </div>

                    </div>


                    ${cancelInfo}

                </div>

                `;

            }

        ).join("");

}


/* =====================================
   FILTER ORDERS
===================================== */

window.filterOrders =
function(
    status,
    button
){

    currentFilter =
        status;


    document
        .querySelectorAll(
            ".filter button"
        )
        .forEach(
            btn =>

                btn.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    displayOrders();

};


/* =====================================
   VIEW ORDER
===================================== */

window.viewOrder =
function(orderId){

    const order =
        demoOrders.find(
            item =>
                item.id ===
                orderId
        );


    if(!order){

        return;

    }


    alert(

        "📦 Order Details\n\n" +

        "Order: #" +
        order.id +

        "\n\n" +

        "Product: " +
        order.product +

        "\n" +

        "Quantity: " +
        order.quantity +

        "\n" +

        "Amount: " +
        order.amount +

        "\n" +

        "Status: " +
        getStatusText(
            order.status
        )

    );

};


/* =====================================
   OUTSIDE MODAL CLICK
===================================== */

window.onclick =
function(event){

    const modal =
        document.getElementById(
            "cancelModal"
        );


    if(
        event.target ===
        modal
    ){

        closeCancelModal();

    }

};


/* =====================================
   START
===================================== */

displayOrders();

</script>
