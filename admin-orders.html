<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#075b3b">

<title>
Utkala Mart | Admin Orders
</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Odia",sans-serif;
  background:#f3f6f5;
  color:#222;
}

/* ================= HEADER ================= */

.header{
  background:linear-gradient(135deg,#075b3b,#0b8757);
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.subtitle{
  font-size:13px;
  opacity:.9;
  margin-top:4px;
}

.admin-info{
  text-align:right;
  font-size:13px;
}

.logout-top{
  margin-top:6px;
  background:#fff;
  color:#075b3b;
  border:0;
  padding:7px 13px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* ================= PAGE ================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.page-title{
  font-size:26px;
  font-weight:bold;
  margin-bottom:5px;
}

.page-subtitle{
  color:#666;
  margin-bottom:20px;
}

/* ================= LOGIN ================= */

.login-wrapper{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    linear-gradient(135deg,#eaf8f1,#f8fbfa);
}

.login-card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 8px 35px rgba(0,0,0,.12);
}

.login-icon{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:50%;
  background:#e7f6ef;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}

.login-card h1{
  text-align:center;
  margin:16px 0 5px;
  color:#075b3b;
}

.login-card .login-sub{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:13px;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #d5dcd9;
  border-radius:10px;
  outline:none;
  font-size:15px;
  background:white;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#0b8757;
  box-shadow:0 0 0 3px rgba(11,135,87,.10);
}

.login-btn{
  width:100%;
  margin-top:20px;
  border:0;
  padding:13px;
  border-radius:10px;
  background:#075b3b;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.login-error{
  margin-top:14px;
  color:#c62828;
  background:#ffebee;
  padding:10px;
  border-radius:8px;
  font-size:14px;
  display:none;
}

.login-note{
  margin-top:18px;
  background:#f5f8f7;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  color:#666;
  line-height:1.5;
}

/* ================= HIDDEN ================= */

.hidden{
  display:none !important;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat-card{
  background:white;
  border-radius:15px;
  padding:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.07);
}

.stat-icon{
  font-size:25px;
}

.stat-label{
  color:#777;
  font-size:13px;
  margin-top:8px;
}

.stat-value{
  font-size:25px;
  font-weight:bold;
  margin-top:5px;
  color:#075b3b;
}
