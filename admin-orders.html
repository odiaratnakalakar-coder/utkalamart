<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#138a45">

<title>Utkala Mart - Admin Orders</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Odia",sans-serif;
  background:#f4f7f5;
  color:#222;
}

/* =========================
   HEADER
========================= */

.header{
  background:#138a45;
  color:#fff;
  padding:14px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:100;
}

.header h1{
  margin:0;
  font-size:21px;
}

.header p{
  margin:4px 0 0;
  font-size:12px;
}

/* =========================
   LOGIN
========================= */

.login-box{
  max-width:400px;
  margin:70px auto;
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 18px rgba(0,0,0,.10);
}

.login-box h2{
  text-align:center;
  color:#138a45;
  margin-top:0;
}

.login-box input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

.login-box button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#138a45;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

/* =========================
   MAIN
========================= */

.main{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.search{
  flex:1;
  min-width:220px;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:14px;
}

.filter{
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  background:#fff;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  background:#fff;
  border-radius:12px;
  padding:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.stat h3{
  margin:0;
  font-size:12px;
  color:#777;
}

.stat strong{
  display:block;
  margin-top:6px;
  font-size:22px;
  color:#138a45;
}

/* =========================
   ORDER CARD
========================= */

.order-card{
  background:#fff;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  overflow:hidden;
  border-left:4px solid #138a45;
}

.order-head{
  padding:13px;
  background:#f0f7f2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.order-id{
  font-weight:bold;
  color:#138a45;
  font-size:14px;
  word-break:break-all;
}

.date{
  font-size:11px;
  color:#777;
  margin-top:3px;
}

.order-body{
  padding:13px;
}

/* =========================
   CUSTOMER + ADDRESS
========================= */

.customer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}

.info-box{
  background:#f7faf8;
  padding:11px;
  border-radius:10px;
}

.info-title{
  font-size:11px;
  color:#777;
  margin-bottom:5px;
}

.info-main{
  font-size:14px;
  font-weight:bold;
}

.info-box p{
  margin:4px 0;
  font-size:13px;
}

.info-box a{
  color:#2563eb;
  text-decoration:none;
}

/* =========================
   PRODUCTS
========================= */

.products-box{
  background:#fafafa;
  border-radius:10px;
  padding:11px;
}

.products-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:5px;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.item:last-child{
  border-bottom:0;
}

.item img{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.item-info{
  flex:1;
}

.item-info h4{
  margin:0 0 4px;
  font-size:14px;
}

.item-info p{
  margin:2px 0;
  font-size:11px;
  color:#666;
}

.item-price{
  font-weight:bold;
  font-size:13px;
}

/* =========================
   TOTAL
========================= */

.total-box{
  margin-top:10px;
  padding:11px 0;
  border-top:2px solid #138a45;
  display:flex;
  justify-content:space-between;
  font-size:17px;
  font-weight:bold;
}

/* =========================
   PAYMENT
========================= */

.payment-box{
  background:#f7faf8;
  padding:10px;
  border-radius:9px;
  margin-top:8px;
  font-size:13px;
}

.payment{
  display:inline-block;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
}

.payment-paid{
  background:#dcfce7;
  color:#166534;
}

.payment-pending{
  background:#fff3cd;
  color:#856404;
}

/* =========================
   STATUS
========================= */

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  text-transform:capitalize;
}

.status-placed,
.status-pending{
  background:#fff3cd;
  color:#856404;
}

.status-confirmed{
  background:#dcfce7;
  color:#166534;
}

.status-processing{
  background:#dbeafe;
  color:#1d4ed8;
}

.status-shipped{
  background:#ede9fe;
  color:#6d28d9;
}

.status-delivered{
  background:#dcfce7;
  color:#166534;
}

.status-cancelled{
  background:#fee2e2;
  color:#b91c1c;
}

/* =========================
   CONTROLS
========================= */

.controls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.controls button{
  padding:9px 12px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  font-size:12px;
  cursor:pointer;
}

.view-btn{
  background:#e0f2fe;
  color:#0369a1;
}

.status-btn{
  background:#138a45;
  color:#fff;
}

.whatsapp{
  background:#25D366;
  color:#fff;
}

.call-btn{
  background:#2563eb;
  color:#fff;
}

.cancel-btn{
  background:#fee2e2;
  color:#b91c1c;
}

/* =========================
   RESTORE
========================= */

.restore-badge{
  display:inline-block;
  margin-top:8px;
  padding:6px 9px;
  border-radius:20px;
  background:#e0f2fe;
  color:#0369a1;
  font-size:11px;
  font-weight:bold;
}

/* =========================
   EMPTY / LOADING / ERROR
========================= */

.empty{
  background:#fff;
  padding:45px 20px;
  text-align:center;
  border-radius:15px;
  color:#777;
}

.loading{
  text-align:center;
  padding:40px;
  color:#777;
}

.error{
  background:#ffe8e8;
  color:#a00000;
  padding:14px;
  border-radius:10px;
  margin-bottom:15px;
}

.success{
  background:#e8f8ee;
  color:#087333;
  padding:14px;
  border-radius:10px;
  margin-bottom:15px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.60);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:9999;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 17px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:#fff;
  z-index:2;
}

.modal-header h2{
  margin:0;
  color:#135f3a;
  font-size:19px;
}

.close-btn{
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#eee;
  font-size:18px;
  cursor:pointer;
}

.modal-body{
  padding:15px;
}

.modal-section{
  background:#f7faf8;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

.modal-label{
  color:#888;
  font-size:11px;
  margin-bottom:5px;
}

.modal-value{
  font-size:14px;
  font-weight:bold;
}

.modal-total{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  font-size:17px;
  font-weight:bold;
  border-top:2px solid #138a45;
}

.modal-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.modal-actions button{
  flex:1;
  min-width:120px;
  padding:11px;
  border:0;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   STATUS MODAL
========================= */

.status-modal-box{
  width:100%;
  max-width:480px;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
}

.status-header{
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
}

.status-header h2{
  margin:0;
  color:#135f3a;
  font-size:19px;
}

.status-content{
  padding:15px;
}

.status-order{
  background:#f5f8f6;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}

.status-order strong{
  display:block;
}

.status-content label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.status-select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  margin-bottom:15px;
}

.status-actions{
  display:flex;
  gap:10px;
}

.status-actions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.cancel-modal{
  background:#eee;
}

.save-status{
  background:#138a45;
  color:#fff;
}

.save-status:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .main{
    padding:9px;
  }

  .customer-grid{
    grid-template-columns:1fr;
  }

  .order-head{
    align-items:flex-start;
  }

  .controls{
    display:grid;
    grid-template-columns:repeat(2,1fr);
  }

  .controls button{
    width:100%;
  }

  .modal{
    padding:10px;
  }

  .modal-box{
    max-height:92vh;
  }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

<script type="module">


/* =========================================
   FIREBASE IMPORT
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  updateDoc,
  setDoc,
  doc,
  runTransaction,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyDonHK2CtrUjAkAaro6stnJmdDUwB59JT0",

  authDomain:
  "utkalamart-1ec68.firebaseapp.com",

  projectId:
  "utkalamart-1ec68",

  storageBucket:
  "utkalamart-1ec68.firebasestorage.app",

  messagingSenderId:
  "664871353747",

  appId:
  "1:664871353747:web:96532fdafe78aabe7f3c66"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================================
   ADMIN EMAIL
========================================= */

const ADMIN_EMAIL =
  "suryakantabehera629@gmail.com";


/* =========================================
   VARIABLES
========================================= */

let allOrders = [];

let selectedOrder = null;


/* =========================================
   LOGIN
========================================= */

window.loginAdmin =
async function(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const errorBox =
    document.getElementById(
      "loginError"
    );

  errorBox.innerText = "";


  if(!email || !password){

    errorBox.innerText =
      "Email ଏବଂ Password ଦିଅନ୍ତୁ।";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }

  catch(error){

    console.error(error);

    errorBox.innerText =
      "Login failed: " +
      error.message;

  }

};


/* =========================================
   AUTH CHECK
========================================= */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      document
        .getElementById("loginBox")
        .style.display = "block";

      document
        .getElementById("adminPanel")
        .style.display = "none";

      return;

    }


    if(
      !user.email ||
      user.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ){

      document
        .getElementById("loginBox")
        .style.display = "block";

      document
        .getElementById("adminPanel")
        .style.display = "none";

      document
        .getElementById("loginError")
        .innerText =
        "ଏହି account କୁ Admin access ନାହିଁ।";

      return;

    }


    document
      .getElementById("loginBox")
      .style.display = "none";


    document
      .getElementById("adminPanel")
      .style.display = "block";


    loadOrders();

  }
);


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

  const box =
    document.getElementById(
      "orders"
    );


  box.innerHTML =
    "⏳ Orders Loading...";


  try{

    const q =
      query(
        collection(db,"orders"),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const snapshot =
      await getDocs(q);


    allOrders = [];


    snapshot.forEach(
      orderDoc => {

        allOrders.push({

          id:
            orderDoc.id,

          ...orderDoc.data()

        });

      }
    );


    updateStats();

    filterOrders();

  }

  catch(error){

    console.error(error);

    box.innerHTML = `

      <div class="error">

        ⚠️ Orders load ହୋଇପାରିଲା ନାହିଁ।

        <br><br>

        Missing or insufficient permissions.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(timestamp){

  if(!timestamp){

    return "Date unavailable";

  }


  try{

    if(
      typeof timestamp.toDate ===
      "function"
    ){

      return timestamp
        .toDate()
        .toLocaleString(
          "en-IN",
          {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
          }
        );

    }


    return new Date(
      timestamp
    ).toLocaleString(
      "en-IN"
    );

  }

  catch(e){

    return "Date unavailable";

  }

}


/* =========================================
   MONEY
========================================= */

function money(value){

  return "₹" +
    Number(value || 0)
      .toLocaleString("en-IN");

}


/* =========================================
   STATUS TEXT
========================================= */

function statusText(status){

  const map = {

    placed:
      "⏳ Pending",

    pending:
      "⏳ Pending",

    confirmed:
      "✅ Confirmed",

    processing:
      "⚙️ Processing",

    shipped:
      "🚚 Shipped",

    delivered:
      "🎉 Delivered",

    cancelled:
      "❌ Cancelled"

  };


  return map[
    String(status || "placed")
      .toLowerCase()
  ] || status;

}


/* =========================================
   STATUS CLASS
========================================= */

function statusClass(status){

  return "status status-" +
    String(
      status || "placed"
    )
    .toLowerCase();

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(
  orders
){

  const box =
    document.getElementById(
      "orders"
    );


  if(!orders.length){

    box.innerHTML = `

      <div class="empty">

        📦

        <h3>
          କୌଣସି Order ମିଳିଲା ନାହିଁ
        </h3>

        <p>
          Customer Order କଲେ
          ଏଠାରେ ଦେଖାଯିବ।
        </p>

      </div>

    `;

    return;

  }


  box.innerHTML =
    orders.map(

========================================= */

window.filterOrders =
function(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const filtered =
    allOrders.filter(
      order => {

        const customer =
          order.customer || {};


        const orderId =
          String(
            order.orderId ||
            order.id ||
            ""
          ).toLowerCase();


        const name =
          String(
            customer.name ||
            ""
          ).toLowerCase();


        const mobile =
          String(
            customer.mobile ||
            ""
          ).toLowerCase();


        const currentStatus =
          String(
            order.orderStatus ||
            "placed"
          ).toLowerCase();


        const matchesSearch =

          !search ||

          orderId.includes(
            search
          ) ||

          name.includes(
            search
          ) ||

          mobile.includes(
            search
          );


        const matchesStatus =

          status === "all" ||

          currentStatus === status;


        return (
          matchesSearch &&
          matchesStatus
        );

      }
    );


  renderOrders(
    filtered
  );

};


/* =========================================
   UPDATE STATS
========================================= */

function updateStats(){

  let sales = 0;

  let pending = 0;

  let delivered = 0;


  allOrders.forEach(
    order => {

      const status =
        String(
          order.orderStatus ||
          "placed"
        ).toLowerCase();


      if(
        status === "placed" ||
        status === "pending"
      ){

        pending++;

      }


      if(
        status === "delivered"
      ){

        delivered++;

      }


      if(
        status !== "cancelled"
      ){

        sales +=
          Number(
            order.total ||
            0
          );

      }

    }
  );


  document
    .getElementById(
      "totalOrders"
    )
    .innerText =
    allOrders.length;


  document
    .getElementById(
      "pendingOrders"
    )
    .innerText =
    pending;


  document
    .getElementById(
      "deliveredOrders"
    )
    .innerText =
    delivered;


  document
    .getElementById(
      "totalSales"
    )
    .innerText =
    money(sales);

}

/* =========================================
   SYNC ORDER TRACKING
========================================= */

async function syncOrderTracking(
  order,
  newStatus
){

  const customer =
    order.customer || {};


  const mobile =
    String(
      customer.mobile || ""
    ).replace(
      /\D/g,
      ""
    );


  const orderId =
    String(
      order.orderId ||
      order.id ||
      ""
    ).trim();


  if(
    !orderId ||
    !mobile
  ){

    console.warn(
      "Tracking sync skipped: Order ID or Mobile missing."
    );

    return;

  }


  const trackingId =
    `${orderId}_${mobile}`;


  const items =
    Array.isArray(order.items)
    ? order.items.map(
        item => ({

          name:
            item.name ||
            "Product",

          qty:
            Number(
              item.qty ||
              item.quantity ||
              1
            ),

          price:
            Number(
              item.price ||
              0
            ),

          image:
            item.image ||
            item.imageUrl ||
            "",

          weight:
            item.weight ||
            "",

          weightUnit:
            item.weightUnit ||
            item.unit ||
            ""

        })
      )
    : [];


  const trackingData = {

    orderId:
      orderId,

    orderStatus:
      newStatus,

    total:
      Number(
        order.total ||
        0
      ),

    items:
      items,

    updatedAt:
      serverTimestamp()

  };


  /*
    Keep original createdAt
    whenever available.
  */

  if(
    order.createdAt
  ){

    trackingData.createdAt =
      order.createdAt;

  }else{

    trackingData.createdAt =
      serverTimestamp();

  }


  await setDoc(

    doc(
      db,
      "orderTracking",
      trackingId
    ),

    trackingData,

    {
      merge:true
    }

  );


  console.log(
    "Tracking updated:",
    trackingId,
    newStatus
  );

}

window.saveStatus =
async function(){

  if(!selectedOrder){

    return;

  }


  const newStatus =
    document
      .getElementById(
        "newStatus"
      )
      .value;


  const oldStatus =
    selectedOrder.orderStatus ||
    "placed";


  if(
    oldStatus === newStatus
  ){

    alert(
      "ଏହି Order ର Status ପୂର୍ବରୁ " +
      statusText(newStatus) +
      " ଅଛି।"
    );

    return;

  }


  /* ===============================
     DELIVERED LOCK
  =============================== */

  if(
    oldStatus === "delivered" &&
    newStatus !== "delivered"
  ){

    alert(
      "Delivered Order ର Status ପରିବର୍ତ୍ତନ କରିବା ଯାଉନାହିଁ।"
    );

    closeStatusModal();

    return;

  }


  /* ===============================
     CANCELLED LOCK
  =============================== */

  if(
    oldStatus === "cancelled" &&
    newStatus !== "cancelled"
  ){

    alert(
      "Cancelled Order ର Status ପୁଣି ପରିବର୍ତ୍ତନ କରିହେବ ନାହିଁ।"
    );

    closeStatusModal();

    return;

  }


  /* ===============================
     CONFIRM CANCEL
  =============================== */

  if(
    newStatus === "cancelled"
  ){

    const yes =
      confirm(
        "⚠️ ଏହି Order କୁ Cancel କରିବେ କି?\n\n" +
        "Order: " +
        (
          selectedOrder.orderId ||
          selectedOrder.id
        ) +
        "\n\n" +
        "Cancel ହେଲେ Product Stock automatic restore ହେବ।"
      );


    if(!yes){

      return;

    }

  }


  const saveBtn =
    document.getElementById(
      "saveStatusBtn"
    );


  saveBtn.disabled = true;

  saveBtn.innerText =
    "⏳ Updating...";


  try{


    /* ===============================
       NORMAL STATUS
    =============================== */

    if(
      newStatus !== "cancelled"
    ){

      /*
        First update main order.
      */

      await updateDoc(

        doc(
          db,
          "orders",
          selectedOrder.id
        ),

        {

          orderStatus:
            newStatus,

          updatedAt:
            serverTimestamp()

        }

      );


      /*
        Then update customer
        tracking document.
      */

      await syncOrderTracking(
        {
          ...selectedOrder,
          orderStatus:
            newStatus
        },
        newStatus
      );


      selectedOrder.orderStatus =
        newStatus;


      selectedOrder.updatedAt =
        new Date();


      updateStats();

      closeStatusModal();

      filterOrders();


      showMessage(
        "✅ Order Status Updated: " +
        statusText(newStatus) +
        " । Customer Tracking ମଧ୍ୟ Update ହୋଇଛି।",
        "success"
      );


      return;

    }


    /* ===============================
       CANCEL + RESTORE
    =============================== */

    await cancelOrderAndRestoreStock(
      selectedOrder
    );


    /*
      Update tracking status.
    */

    await syncOrderTracking(
      {
        ...selectedOrder,
        orderStatus:
          "cancelled"
      },
      "cancelled"
    );


    closeStatusModal();


    showMessage(
      "✅ Order Cancelled + Stock Restored + Customer Tracking Updated।",
      "success"
    );


    await loadOrders();

  }

  catch(error){

    console.error(
      "Status Update Error:",
      error
    );


    showMessage(
      "❌ Update failed: " +
      error.message,
      "error"
    );

  }

  finally{

    saveBtn.disabled = false;

    saveBtn.innerText =
      "💾 Save Status";

  }

};

window.cancelOrderDirect =

  const order =
    allOrders.find(
      item =>
        item.id === orderId
    );


  if(!order){

    return;

  }


  const currentStatus =
    order.orderStatus ||
    "placed";


  if(
    currentStatus === "delivered"
  ){

    alert(
      "Delivered Order କୁ Cancel କରିହେବ ନାହିଁ।"
    );

    return;

  }


  if(
    currentStatus === "cancelled"
  ){

    alert(
      "ଏହି Order ପୂର୍ବରୁ Cancelled ଅଛି।"
    );

    return;

  }


  const yes =
    confirm(
      "⚠️ ଏହି Order କୁ Cancel କରିବେ କି?\n\n" +
      "Order: " +
      (
        order.orderId ||
        order.id
      ) +
      "\n\n" +
      "Stock automatic restore ହେବ।"
    );


  if(!yes){

    return;

  }


  try{

    await cancelOrderAndRestoreStock(
      order
    );


    await syncOrderTracking(
      {
        ...order,
        orderStatus:
          "cancelled"
      },
      "cancelled"
    );


    showMessage(
      "✅ Order Cancelled + Stock Restored + Tracking Updated।",
      "success"
    );


    await loadOrders();

  }

  catch(error){

    console.error(
      "Direct Cancel Error:",
      error
    );


    showMessage(
      "❌ Cancel failed: " +
      error.message,
      "error"
    );

  }

};


/* =========================================
   CANCEL + STOCK RESTORE
========================================= */

async function cancelOrderAndRestoreStock(
  order
){

  const items =
    order.items || [];


  if(!items.length){

    throw new Error(
      "ଏହି Order ରେ Product items ନାହିଁ।"
    );

  }


  const orderRef =
    doc(
      db,
      "orders",
      order.id
    );


  await runTransaction(
    db,
    async(transaction) => {


      /* ===============================
         READ ORDER
      =============================== */

      const orderSnap =
        await transaction.get(
          orderRef
        );


      if(!orderSnap.exists()){

        throw new Error(
          "Order ମିଳିଲା ନାହିଁ।"
        );

      }


      const currentOrder =
        orderSnap.data();


      const currentStatus =
        currentOrder.orderStatus ||
        "placed";


      if(
        currentStatus ===
        "cancelled"
      ){

        throw new Error(
          "ଏହି Order ପୂର୍ବରୁ Cancelled ଅଛି।"
        );

      }


      if(
        currentOrder.stockRestored === true
      ){

        throw new Error(
          "ଏହି Order ର Stock ପୂର୍ବରୁ Restore ହୋଇଛି।"
        );

      }


      /* ===============================
         PRODUCT IDS
      =============================== */

      const productIds =
        [
          ...new Set(

            items
              .map(
                item =>
                  item.productId ||
                  item.id
              )
              .filter(Boolean)

          )
        ];


      if(
        !productIds.length
      ){

        throw new Error(
          "Order ର Product ID ମିଳିଲା ନାହିଁ।"
        );

      }


      const productSnapshots =
        [];


      /* ===============================
         READ PRODUCTS
      =============================== */

      for(
        const productId
        of productIds
      ){

        const productRef =
          doc(
            db,
            "products",
            productId
          );


        const productSnap =
          await transaction.get(
            productRef
          );


        if(
          !productSnap.exists()
        ){

          throw new Error(
            "Product ମିଳିଲା ନାହିଁ: " +
            productId
          );

        }


        productSnapshots.push({

          id:
            productId,

          ref:
            productRef,

          data:
            productSnap.data()

        });

      }


      /* ===============================
         RESTORE STOCK
      =============================== */

      for(
        const product
        of productSnapshots
      ){

        let restoreQty = 0;


        items.forEach(
          item => {

            const itemProductId =
              item.productId ||
              item.id;


            if(
              itemProductId ===
              product.id
            ){

              restoreQty +=
                Number(
                  item.qty ||
                  item.quantity ||
                  1
                );

            }

          }
        );


        if(
          restoreQty <= 0
        ){

          continue;

        }


        const data =
          product.data;


        const currentStock =
          Number(
            data.stock ??
            data.stockQty ??
            data.quantity ??
            data.availableStock ??
            0
          );


        const newStock =
          currentStock +
          restoreQty;


        transaction.update(

          product.ref,

          {

            stock:
              newStock,

            stockQty:
              newStock,

            quantity:
              newStock,

            availableStock:
              newStock,

            updatedAt:
              serverTimestamp()

          }

        );

      }


      /* ===============================
         UPDATE ORDER
      =============================== */

      transaction.update(

        orderRef,

        {

          orderStatus:
            "cancelled",

          stockRestored:
            true,

          stockRestoredAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }

      );

    }

  );

}

   WHATSAPP
========================================= */

window.openWhatsApp =
function(
  mobile,
  orderId,
  status,
  total
){

  let number =
    String(mobile)
      .replace(
        /\D/g,
        ""
      );


  if(
    number.length === 10
  ){

    number =
      "91" +
      number;

  }


  const message =
`ନମସ୍କାର 🙏

Utkala Mart ରୁ ଆପଣଙ୍କ Order ବିଷୟରେ ସୂଚନା।

📦 Order ID: ${orderId}

💰 Total: ₹${total}

📋 Order Status: ${statusText(status)}

ଧନ୍ୟବାଦ।
Utkala Mart`;


  const url =
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    url,
    "_blank"
  );

};

/* =========================================
   MESSAGE
========================================= */

function showMessage(
  message,
  type
){

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    type === "success"
    ? "success"
    : "error";


  box.innerText =
    message;


  setTimeout(
    () => {

      box.innerText = "";

      box.className = "";

    },
    5000
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   ESCAPE JS
========================================= */

function escapeJS(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /\\/g,
    "\\\\"
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /"/g,
    '\\"'
  )

  .replace(
    /\n/g,
    "\\n"
  )

  .replace(
    /\r/g,
    "\\r"
  );

}
