<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#138a45">

<title>Utkala Mart - Admin Orders</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Odia",sans-serif;
  background:#f4f7f5;
  color:#222;
}

.header{
  background:#138a45;
  color:#fff;
  padding:16px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:100;
}

.header h1{
  margin:0;
  font-size:22px;
}

.header p{
  margin:5px 0 0;
  font-size:13px;
}

/* LOGIN */

.login-box{
  max-width:400px;
  margin:70px auto;
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 18px rgba(0,0,0,.10);
}

.login-box h2{
  text-align:center;
  color:#138a45;
}

.login-box input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
}

.login-box button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#138a45;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* MAIN */

.main{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

/* TOPBAR */

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.search{
  flex:1;
  min-width:220px;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
}

.filter{
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  background:#fff;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border-radius:12px;
  padding:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.stat h3{
  margin:0;
  font-size:13px;
  color:#777;
}

.stat strong{
  display:block;
  margin-top:7px;
  font-size:23px;
  color:#138a45;
}

/* ORDER CARD */

.order-card{
  background:#fff;
  border-radius:15px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  overflow:hidden;
}

.order-head{
  padding:15px;
  background:#f0f7f2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.order-id{
  font-weight:bold;
  color:#138a45;
}

.date{
  font-size:12px;
  color:#777;
}

.order-body{
  padding:15px;
}

/* CUSTOMER */

.customer{
  background:#fafafa;
  border-radius:10px;
  padding:12px;
  margin-bottom:13px;
}

.customer strong{
  font-size:16px;
}

.customer p{
  margin:5px 0;
  font-size:14px;
}

/* ITEMS */

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.item:last-child{
  border-bottom:0;
}

.item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.item-info{
  flex:1;
}

.item-info h4{
  margin:0 0 5px;
}

.item-info p{
  margin:3px 0;
  font-size:13px;
  color:#666;
}

/* TOTAL */

.total-box{
  margin-top:12px;
  padding-top:12px;
  border-top:2px solid #138a45;
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:bold;
}

/* STATUS */

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  text-transform:capitalize;
}

.status-placed{
  background:#fff3cd;
  color:#856404;
}

.status-confirmed{
  background:#dbeafe;
  color:#1d4ed8;
}

.status-shipped{
  background:#ede9fe;
  color:#6d28d9;
}

.status-delivered{
  background:#dcfce7;
  color:#166534;
}

.status-cancelled{
  background:#fee2e2;
  color:#b91c1c;
}

/* PAYMENT */

.payment{
  display:inline-block;
  padding:5px 9px;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
  background:#eee;
}

.payment-paid{
  background:#dcfce7;
  color:#166534;
}

.payment-pending{
  background:#fff3cd;
  color:#856404;
}

/* RESTORED */

.restore-badge{
  display:inline-block;
  margin-top:10px;
  padding:6px 10px;
  border-radius:20px;
  background:#e0f2fe;
  color:#0369a1;
  font-size:12px;
  font-weight:bold;
}

/* CONTROLS */

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.controls select{
  flex:1;
  min-width:180px;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
}

.controls button{
  padding:11px 15px;
  border:0;
  border-radius:8px;
  background:#138a45;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.controls button:hover{
  background:#0d7138;
}

.whatsapp{
  background:#25D366 !important;
}

.cancel-btn{
  background:#dc2626 !important;
}

/* EMPTY */

.empty{
  background:#fff;
  padding:50px 20px;
  text-align:center;
  border-radius:15px;
  color:#777;
}

/* LOADING */

.loading{
  text-align:center;
  padding:40px;
  color:#777;
}

/* ERROR */

.error{
  background:#ffe8e8;
  color:#a00000;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

/* SUCCESS */

.success{
  background:#e8f8ee;
  color:#087333;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

/* MOBILE */

@media(max-width:800px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .main{
    padding:10px;
  }

  .order-head{
    align-items:flex-start;
  }

  .item img{
    width:55px;
    height:55px;
  }

  .item-info h4{
    font-size:14px;
  }

  .total-box{
    font-size:16px;
  }

  .controls{
    flex-direction:column;
  }

  .controls select,
  .controls button{
    width:100%;
  }

}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">

  <h1>📦 Utkala Mart</h1>

  <p>Admin Order Dashboard</p>

</div>


<!-- LOGIN -->

<div id="loginBox"
class="login-box">

  <h2>🔐 Admin Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    onclick="loginAdmin()">

    Login

  </button>

  <p
    id="loginError"
    style="
      color:#c00;
      text-align:center;
    ">
  </p>

</div>


<!-- ADMIN PANEL -->

<div
  id="adminPanel"
  class="main"
  style="display:none;"
>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <h3>ସମସ୍ତ Order</h3>

      <strong id="totalOrders">
        0
      </strong>

    </div>


    <div class="stat">

      <h3>Placed</h3>

      <strong id="placedOrders">
        0
      </strong>

    </div>


    <div class="stat">

      <h3>Delivered</h3>

      <strong id="deliveredOrders">
        0
      </strong>

    </div>


    <div class="stat">

      <h3>Total Sales</h3>

      <strong id="totalSales">
        ₹0
      </strong>

    </div>

  </div>


  <!-- SEARCH -->

  <div class="topbar">

    <input
      class="search"
      id="search"
      placeholder="🔎 Order ID / Customer / Mobile ଖୋଜନ୍ତୁ..."
      oninput="filterOrders()"
    >


    <select
      class="filter"
      id="statusFilter"
      onchange="filterOrders()">

      <option value="all">
        ସମସ୍ତ Status
      </option>

      <option value="placed">
        Placed
      </option>

      <option value="confirmed">
        Confirmed
      </option>

      <option value="shipped">
        Shipped
      </option>

      <option value="delivered">
        Delivered
      </option>

      <option value="cancelled">
        Cancelled
      </option>

    </select>

  </div>


  <div id="message"></div>


  <div
    id="orders"
    class="loading">

    ⏳ Orders Loading...

  </div>


</div>


<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  updateDoc,
  doc,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBYJ_KKs_7SNz108jnw6hpOlmegofRhJg",

  authDomain:
  "utkalamart-1ec68.firebaseapp.com",

  projectId:
  "utkalamart-1ec68",

  storageBucket:
  "utkalamart-1ec68.firebasestorage.app",

  messagingSenderId:
  "664871353747",

  appId:
  "1:664871353747:web:96532fdafe78aabe7f3c66"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =========================================
   ADMIN EMAIL
========================================= */

const ADMIN_EMAIL =
  "admin@utkalamart.in";


/* =========================================
   VARIABLES
========================================= */

let allOrders = [];


/* =========================================
   LOGIN
========================================= */

window.loginAdmin = async function(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const errorBox =
    document.getElementById(
      "loginError"
    );


  errorBox.innerText = "";


  if(!email || !password){

    errorBox.innerText =
      "Email ଏବଂ Password ଦିଅନ୍ତୁ।";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    errorBox.innerText =
      "Login failed: " +
      error.message;

  }

};


/* =========================================
   AUTH CHECK
========================================= */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      document
        .getElementById("loginBox")
        .style.display = "block";

      document
        .getElementById("adminPanel")
        .style.display = "none";

      return;

    }


    if(
      user.email !== ADMIN_EMAIL
    ){

      document
        .getElementById("loginError")
        .innerText =
        "ଏହି account କୁ Admin access ନାହିଁ।";

      return;

    }


    document
      .getElementById("loginBox")
      .style.display = "none";


    document
      .getElementById("adminPanel")
      .style.display = "block";


    loadOrders();

  }
);


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

  const box =
    document.getElementById(
      "orders"
    );


  box.innerHTML =
    "⏳ Orders Loading...";


  try{

    const q =
      query(
        collection(db,"orders"),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const snapshot =
      await getDocs(q);


    allOrders = [];


    snapshot.forEach(
      orderDoc => {

        allOrders.push({

          id:
            orderDoc.id,

          ...orderDoc.data()

        });

      }
    );


    updateStats();

    renderOrders(
      allOrders
    );


  }catch(error){

    console.error(error);

    box.innerHTML = `

      <div class="error">

        ❌ Orders load ହୋଇପାରିଲା ନାହିଁ।

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================
   DATE
========================================= */

function formatDate(timestamp){

  if(!timestamp){

    return "Date unavailable";

  }


  try{

    const date =
      timestamp.toDate();


    return date.toLocaleString(
      "en-IN",
      {

        day:"2-digit",

        month:"short",

        year:"numeric",

        hour:"2-digit",

        minute:"2-digit"

      }
    );

  }catch(e){

    return "Date unavailable";

  }

}


/* =========================================
   MONEY
========================================= */

function money(value){

  return "₹" +
    Number(value || 0)
      .toLocaleString("en-IN");

}


/* =========================================
   STATUS CLASS
========================================= */

function statusClass(status){

  return (
    "status status-" +
    String(
      status || "placed"
    ).toLowerCase()
  );

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(
  orders
){

  const box =
    document.getElementById(
      "orders"
    );


  if(!orders.length){

    box.innerHTML = `

      <div class="empty">

        📦

        <h3>
          କୌଣସି Order ମିଳିଲା ନାହିଁ
        </h3>

        <p>
          Customer Order କଲେ
          ଏଠାରେ ଦେଖାଯିବ।
        </p>

      </div>

    `;

    return;

  }


  box.innerHTML =
    orders.map(
      order => {

        const customer =
          order.customer || {};


        const items =
          order.items || [];


        const orderStatus =
          order.orderStatus ||
          "placed";


        const paymentStatus =
          order.paymentStatus ||
          "pending";


        const restored =
          order.stockRestored === true;


        return `

        <div
          class="order-card"
          data-id="${escapeHTML(order.id)}"
        >


          <!-- HEADER -->

          <div class="order-head">

            <div>

              <div class="order-id">

                📦
                ${escapeHTML(
                  order.orderId ||
                  order.id
                )}

              </div>

              <div class="date">

                ${formatDate(
                  order.createdAt
                )}

              </div>

            </div>


            <div>

              <span
                class="${statusClass(
                  orderStatus
                )}">

                ${escapeHTML(
                  orderStatus
                )}

              </span>

            </div>

          </div>


          <div class="order-body">


            <!-- CUSTOMER -->

            <div class="customer">

              <strong>

                👤
                ${escapeHTML(
                  customer.name ||
                  "Customer"
                )}

              </strong>


              <p>

                📱

                <a
                  href="tel:${escapeHTML(
                    customer.mobile || ""
                  )}">

                  ${escapeHTML(
                    customer.mobile ||
                    "-"
                  )}

                </a>

              </p>


              <p>

                📍
                ${escapeHTML(
                  customer.address ||
                  ""
                )}

              </p>


              <p>

                ${escapeHTML(
                  customer.district ||
                  ""
                )}

                -

                ${escapeHTML(
                  customer.pin ||
                  ""
                )}

              </p>


              ${
                customer.note
                ? `
                <p>

                  📝
                  ${escapeHTML(
                    customer.note
                  )}

                </p>
                `
                : ""
              }


            </div>


            <!-- PRODUCTS -->

            <div>

              ${
                items.map(
                  item => `

                  <div class="item">

                    <img
                      src="${escapeHTML(
                        item.image ||
                        item.imageUrl ||
                        ""
                      )}"
                      onerror="
                        this.style.display='none'
                      "
                    >


                    <div class="item-info">

                      <h4>

                        ${escapeHTML(
                          item.name ||
                          "Product"
                        )}

                      </h4>


                      <p>

                        Qty:

                        <strong>

                          ${Number(
                            item.qty ||
                            item.quantity ||
                            1
                          )}

                        </strong>

                      </p>


                      ${
                        item.weight
                        ? `
                        <p>

                          ⚖️

                          ${escapeHTML(
                            String(
                              item.weight
                            )
                          )}

                          ${escapeHTML(
                            item.weightUnit ||
                            item.unit ||
                            ""
                          )}

                        </p>
                        `
                        : ""
                      }


                      <p>

                        ${money(
                          item.price
                        )}

                        ×

                        ${Number(
                          item.qty ||
                          item.quantity ||
                          1
                        )}

                      </p>


                    </div>

                  </div>

                `
                ).join("")
              }

            </div>


            <!-- TOTAL -->

            <div class="total-box">

              <span>
                Total
              </span>

              <span>

                ${money(
                  order.total
                )}

              </span>

            </div>


            <!-- PAYMENT -->

            <div
              style="margin-top:12px;">

              💳 Payment:

              <span
                class="
                  payment
                  ${
                    paymentStatus === "paid"
                    ? "payment-paid"
                    : "payment-pending"
                  }
                ">

                ${escapeHTML(
                  order.paymentMethod ||
                  "COD"
                )}

                -

                ${escapeHTML(
                  paymentStatus
                )}

              </span>

            </div>


            <!-- RESTORE MESSAGE -->

            ${
              restored
              ? `

              <div class="restore-badge">

                ♻️ Stock Restored

              </div>

              `
              : ""
            }


            <!-- CONTROLS -->

            <div class="controls">


              <select
                id="status-${escapeHTML(
                  order.id
                )}">

                <option
                  value="placed"
                  ${
                    orderStatus === "placed"
                    ? "selected"
                    : ""
                  }>

                  Placed

                </option>


                <option
                  value="confirmed"
                  ${
                    orderStatus === "confirmed"
                    ? "selected"
                    : ""
                  }>

                  Confirmed

                </option>


                <option
                  value="shipped"
                  ${
                    orderStatus === "shipped"
                    ? "selected"
                    : ""
                  }>

                  Shipped

                </option>


                <option
                  value="delivered"
                  ${
                    orderStatus === "delivered"
                    ? "selected"
                    : ""
                  }>

                  Delivered

                </option>


                <option
                  value="cancelled"
                  ${
                    orderStatus === "cancelled"
                    ? "selected"
                    : ""
                  }>

                  Cancelled

                </option>

              </select>


              <button
                onclick="
                  updateOrderStatus(
                    '${escapeJS(order.id)}'
                  )
                ">

                🔄 Update Status

              </button>


              ${
                customer.mobile
                ? `

                <button
                  class="whatsapp"
                  onclick="
                    openWhatsApp(
                      '${escapeJS(
                        customer.mobile
                      )}',
                      '${escapeJS(
                        order.orderId ||
                        order.id
                      )}',
                      '${escapeJS(
                        orderStatus
                      )}',
                      '${escapeJS(
                        order.total ||
                        0
                      )}'
                    )
                  ">

                  💬 WhatsApp

                </button>

                `
                : ""
              }


            </div>


          </div>

        </div>

        `;

      }
    ).join("");

}


/* =========================================
   UPDATE STATUS
========================================= */

window.updateOrderStatus =
async function(orderId){

  const select =
    document.getElementById(
      "status-" + orderId
    );


  if(!select){

    return;

  }


  const newStatus =
    select.value;


  const order =
    allOrders.find(
      item =>
        item.id === orderId
    );


  if(!order){

    alert(
      "Order ମିଳିଲା ନାହିଁ।"
    );

    return;

  }


  const oldStatus =
    order.orderStatus ||
    "placed";


  /* -------------------------------------
     SAME STATUS
  ------------------------------------- */

  if(
    oldStatus === newStatus
  ){

    alert(
      "ଏହି Order ର Status ପୂର୍ବରୁ " +
      newStatus +
      " ଅଛି।"
    );

    return;

  }


  /* -------------------------------------
     DELIVERED → OTHER
  ------------------------------------- */

  if(
    oldStatus === "delivered" &&
    newStatus !== "delivered"
  ){

    alert(
      "Delivered Order ର Status ପରିବର୍ତ୍ତନ କରିବା ଯାଉନାହିଁ।"
    );

    filterOrders();

    return;

  }


  /* -------------------------------------
     CANCELLED → OTHER
  ------------------------------------- */

  if(
    oldStatus === "cancelled" &&
    newStatus !== "cancelled"
  ){

    alert(
      "Cancelled Order ର Status ପୁଣି ପରିବର୍ତ୍ତନ କରିବା ଯାଉନାହିଁ।"
    );

    filterOrders();

    return;

  }


  /* -------------------------------------
     CONFIRM CANCEL
  ------------------------------------- */

  if(
    newStatus === "cancelled"
  ){

    const yes =
      confirm(
        "⚠️ ଏହି Order କୁ Cancel କରିବେ କି?\n\n" +
        "Order: " +
        (
          order.orderId ||
          order.id
        ) +
        "\n\n" +
        "Cancel ହେଲେ order ର product stock automatic restore ହେବ।"
      );


    if(!yes){

      filterOrders();

      return;

    }

  }


  try{

    /* ===================================
       NORMAL STATUS UPDATE
    =================================== */

    if(
      newStatus !== "cancelled"
    ){

      await updateDoc(

        doc(
          db,
          "orders",
          orderId
        ),

        {

          orderStatus:
            newStatus,

          updatedAt:
            new Date()

        }

      );


      order.orderStatus =
        newStatus;


      updateStats();

      filterOrders();


      showMessage(
        "✅ Order status updated: " +
        newStatus,
        "success"
      );


      return;

    }


    /* ===================================
       CANCEL + STOCK RESTORE
       FIRESTORE TRANSACTION
    =================================== */

    await cancelOrderAndRestoreStock(
      order
    );


    showMessage(
      "✅ Order Cancelled ଏବଂ Stock Automatic Restore ହୋଇଛି।",
      "success"
    );


    await loadOrders();


  }catch(error){

    console.error(
      "STATUS ERROR:",
      error
    );


    showMessage(
      "❌ Update failed: " +
      error.message,
      "error"
    );


    filterOrders();

  }

};


/* =========================================
   CANCEL ORDER + RESTORE STOCK
========================================= */

async function cancelOrderAndRestoreStock(
  order
){

  const items =
    order.items || [];


  if(!items.length){

    throw new Error(
      "ଏହି Order ରେ Product items ନାହିଁ।"
    );

  }


  const orderRef =
    doc(
      db,
      "orders",
      order.id
    );


  await runTransaction(
    db,
    async(transaction) => {


      /* -----------------------------------
         FIRST READ ORDER
      ----------------------------------- */

      const orderSnap =
        await transaction.get(
          orderRef
        );


      if(!orderSnap.exists()){

        throw new Error(
          "Order ମିଳିଲା ନାହିଁ।"
        );

      }


      const currentOrder =
        orderSnap.data();


      const currentStatus =
        currentOrder.orderStatus ||
        "placed";


      /* -----------------------------------
         ALREADY CANCELLED
      ----------------------------------- */

      if(
        currentStatus === "cancelled"
      ){

        throw new Error(
          "ଏହି Order ପୂର୍ବରୁ Cancelled ଅଛି।"
        );

      }


      /* -----------------------------------
         ALREADY RESTORED
      ----------------------------------- */

      if(
        currentOrder.stockRestored === true
      ){

        throw new Error(
          "ଏହି Order ର Stock ପୂର୍ବରୁ Restore ହୋଇଛି।"
        );

      }


      /* -----------------------------------
         PRODUCT REFS
      ----------------------------------- */

      const productIds =
        [
          ...new Set(
            items
              .map(
                item =>
                  item.productId ||
                  item.id
              )
              .filter(Boolean)
          )
        ];


      if(!productIds.length){

        throw new Error(
          "Order ର Product ID ମିଳିଲା ନାହିଁ।"
        );

      }


      const productSnapshots = [];


      /* -----------------------------------
         READ PRODUCTS
      ----------------------------------- */

      for(
        const productId
        of productIds
      ){

        const productRef =
          doc(
            db,
            "products",
            productId
          );


        const productSnap =
          await transaction.get(
            productRef
          );


        if(
          !productSnap.exists()
        ){

          throw new Error(
            "Product ମିଳିଲା ନାହିଁ: " +
            productId
          );

        }


        productSnapshots.push({

          id:
            productId,

          ref:
            productRef,

          data:
            productSnap.data()

        });

      }


      /* -----------------------------------
         CALCULATE RESTORE
      ----------------------------------- */

      for(
        const product
        of productSnapshots
      ){

        const productId =
          product.id;


        const data =
          product.data;


        /*
          Same product cart ରେ
          ଏକାଧିକ line ଥିଲେ
          total quantity calculate।
        */

        let restoreQty = 0;


        items.forEach(
          item => {

            const itemProductId =
              item.productId ||
              item.id;


            if(
              itemProductId ===
              productId
            ){

              restoreQty +=
                Number(
                  item.qty ||
                  item.quantity ||
                  1
                );

            }

          }
        );


        if(
          restoreQty <= 0
        ){

          continue;

        }


        /* --------------------------------
           CURRENT STOCK
        -------------------------------- */

        const currentStock =
          Number(
            data.stock ??
            data.stockQty ??
            data.quantity ??
            data.availableStock ??
            0
          );


        const newStock =
          currentStock +
          restoreQty;


        /* --------------------------------
           UPDATE ALL STOCK FIELDS
        -------------------------------- */

        transaction.update(

          product.ref,

          {

            stock:
              newStock,

            stockQty:
              newStock,

            quantity:
              newStock,

            availableStock:
              newStock,

            updatedAt:
              new Date()

          }

        );

      }


      /* -----------------------------------
         UPDATE ORDER
      ----------------------------------- */

      transaction.update(

        orderRef,

        {

          orderStatus:
            "cancelled",

          stockRestored:
            true,

          stockRestoredAt:
            new Date(),

          updatedAt:
            new Date()

        }

      );

    }

  );

}


/* =========================================
   SEARCH + FILTER
========================================= */

window.filterOrders =
function(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById("statusFilter")
      .value;


  const filtered =
    allOrders.filter(
      order => {

        const customer =
          order.customer || {};


        const orderId =
          String(
            order.orderId ||
            order.id ||
            ""
          ).toLowerCase();


        const name =
          String(
            customer.name ||
            ""
          ).toLowerCase();


        const mobile =
          String(
            customer.mobile ||
            ""
          ).toLowerCase();


        const currentStatus =
          String(
            order.orderStatus ||
            "placed"
          ).toLowerCase();


        const matchesSearch =
          !search ||

          orderId.includes(search) ||

          name.includes(search) ||

          mobile.includes(search);


        const matchesStatus =
          status === "all" ||

          currentStatus === status;


        return (
          matchesSearch &&
          matchesStatus
        );

      }
    );


  renderOrders(
    filtered
  );

};


/* =========================================
   STATS
========================================= */

function updateStats(){

  let sales = 0;

  let placed = 0;

  let delivered = 0;


  allOrders.forEach(
    order => {

      const status =
        order.orderStatus ||
        "placed";


      if(
        status === "placed"
      ){

        placed++;

      }


      if(
        status === "delivered"
      ){

        delivered++;

      }


      if(
        status !== "cancelled"
      ){

        sales +=
          Number(
            order.total ||
            0
          );

      }

    }
  );


  document
    .getElementById(
      "totalOrders"
    )
    .innerText =
    allOrders.length;


  document
    .getElementById(
      "placedOrders"
    )
    .innerText =
    placed;


  document
    .getElementById(
      "deliveredOrders"
    )
    .innerText =
    delivered;


  document
    .getElementById(
      "totalSales"
    )
    .innerText =
    money(sales);

}

window.openWhatsApp =
function(
  mobile,
  orderId,
  status,
  total
){

  let number =
    String(mobile)
      .replace(
        /\D/g,
        ""
      );


  if(
    number.length === 10
  ){

    number =
      "91" + number;

  }


  const message =
`ନମସ୍କାର 🙏

Utkala Mart ରୁ ଆପଣଙ୍କ Order ବିଷୟରେ ସୂଚନା।

📦 Order ID: ${orderId}

💰 Total: ₹${total}

📋 Order Status: ${status}

ଧନ୍ୟବାଦ।
Utkala Mart`;


  const url =
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(
      message
    );


  window.open(
    url,
    "_blank"
  );

};


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  message,
  type
){

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    type === "success"
    ? "success"
    : "error";


  box.innerText =
    message;


  setTimeout(
    () => {

      box.innerText = "";

      box.className = "";

    },
    5000
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   ESCAPE JS
========================================= */

function escapeJS(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}
