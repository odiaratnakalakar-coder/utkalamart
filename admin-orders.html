<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<meta name="theme-color"
      content="#075b3b">

<title>Utkala Mart | Admin Orders</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        Arial,
        "Noto Sans Oriya",
        "Nirmala UI",
        sans-serif;
    background:#f4f7f5;
    color:#222;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    background:#075b3b;
    color:#fff;
    padding:15px 4%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header h1{
    margin:0;
    font-size:23px;
}

.header p{
    margin:4px 0 0;
    font-size:11px;
    opacity:.9;
}

.logout{
    border:0;
    background:#d9272e;
    color:#fff;
    padding:9px 14px;
    border-radius:8px;
    font-weight:800;
}


/* =====================================================
   LOGIN
===================================================== */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#f4f7f5;
}

.login-box{
    width:min(400px,100%);
    background:#fff;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h2{
    margin-top:0;
    color:#075b3b;
}

.login-box p{
    color:#666;
    font-size:13px;
    line-height:1.6;
}

.login-box input{
    width:100%;
    height:44px;
    margin-top:7px;
    padding:0 12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
}

.login-box button{
    width:100%;
    height:44px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    background:#075b3b;
    color:#fff;
    font-weight:900;
}

.login-error{
    display:none;
    margin-top:12px;
    background:#ffe5e5;
    color:#a00000;
    padding:10px;
    border-radius:8px;
    font-size:12px;
}


/* =====================================================
   MAIN
===================================================== */

#adminPanel{
    display:none;
}

.container{
    width:min(1250px,95%);
    margin:20px auto 60px;
}


/* =====================================================
   STATS
===================================================== */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:#fff;
    padding:17px;
    border-radius:13px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat-icon{
    font-size:25px;
}

.stat-label{
    color:#777;
    font-size:11px;
    margin-top:5px;
}

.stat-value{
    font-size:25px;
    font-weight:900;
    color:#075b3b;
    margin-top:3px;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
    background:#fff;
    padding:14px;
    border-radius:13px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.search{
    flex:1;
    min-width:220px;
    height:42px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:0 12px;
    outline:none;
}

.filter{
    height:42px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:0 10px;
    background:#fff;
}

.refresh{
    height:42px;
    border:0;
    border-radius:8px;
    padding:0 15px;
    background:#075b3b;
    color:#fff;
    font-weight:900;
}


/* =====================================================
   ORDER CARD
===================================================== */

.orders{
    display:grid;
    gap:14px;
}

.order-card{
    background:#fff;
    border-radius:14px;
    padding:16px;
    box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
    border-bottom:1px solid #eee;
    padding-bottom:12px;
}

.order-id{
    font-weight:900;
    color:#075b3b;
    font-size:14px;
    word-break:break-all;
}

.order-date{
    color:#777;
    font-size:10px;
    margin-top:5px;
}

.status{
    display:inline-block;
    padding:7px 11px;
    border-radius:20px;
    font-size:10px;
    font-weight:900;
}

.placed{
    background:#fff3cd;
    color:#856404;
}

.confirmed{
    background:#dff4ff;
    color:#075f91;
}

.processing{
    background:#e0f2fe;
    color:#0369a1;
}

.shipped{
    background:#eee7ff;
    color:#6336a3;
}

.delivered{
    background:#dcfce7;
    color:#166534;
}

.cancelled{
    background:#fee2e2;
    color:#b91c1c;
}


/* =====================================================
   ORDER BODY
===================================================== */

.order-body{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:15px;
    padding:15px 0;
}

.info-title{
    color:#075b3b;
    font-size:12px;
    font-weight:900;
    margin-bottom:7px;
}

.info{
    font-size:12px;
    line-height:1.7;
}

.info b{
    color:#333;
}


/* =====================================================
   PRODUCTS
===================================================== */

.products{
    border-top:1px solid #eee;
    padding-top:12px;
}

.product{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid #f0f0f0;
}

.product:last-child{
    border-bottom:0;
}

.product img{
    width:52px;
    height:52px;
    object-fit:cover;
    border-radius:7px;
    background:#eee;
}

.product-info{
    flex:1;
}

.product-name{
    font-weight:800;
    font-size:12px;
}

.product-meta{
    color:#777;
    font-size:10px;
    margin-top:3px;
}

.product-price{
    font-weight:900;
    font-size:12px;
}


/* =====================================================
   TOTAL
===================================================== */

.order-total{
    display:flex;
    justify-content:flex-end;
    gap:20px;
    border-top:2px solid #075b3b;
    margin-top:7px;
    padding-top:10px;
    font-size:17px;
    font-weight:900;
    color:#075b3b;
}


/* =====================================================
   ACTIONS
===================================================== */

.order-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:13px;
}

.action-btn{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    font-size:11px;
    font-weight:900;
    text-decoration:none;
    display:inline-block;
    text-align:center;
}

.view-btn{
    background:#075b3b;
    color:#fff;
}

.status-btn{
    background:#0b8b4f;
    color:#fff;
}

.call-btn{
    background:#e8f7ee;
    color:#087333;
}

.whatsapp-btn{
    background:#dff8e8;
    color:#087333;
}

.cancel-btn{
    background:#ffe5e5;
    color:#b91c1c;
}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.empty{
    background:#fff;
    padding:50px 20px;
    text-align:center;
    border-radius:14px;
    color:#777;
}

.loading{
    background:#fff;
    padding:35px;
    text-align:center;
    border-radius:14px;
    color:#777;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:5000;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-box{
    background:#fff;
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:15px;
    padding:20px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #eee;
    padding-bottom:10px;
    margin-bottom:12px;
}

.modal-head h2{
    margin:0;
    color:#075b3b;
    font-size:20px;
}

.close{
    border:0;
    background:#eee;
    width:34px;
    height:34px;
    border-radius:50%;
    font-size:20px;
}

.modal-section{
    background:#f5f8f6;
    padding:12px;
    border-radius:9px;
    margin-bottom:10px;
}

.modal-section h3{
    margin:0 0 7px;
    color:#075b3b;
    font-size:13px;
}


/* =====================================================
   STATUS MODAL
===================================================== */

.status-options{
    display:grid;
    gap:9px;
}

.status-option{
    border:1px solid #ddd;
    background:#fff;
    border-radius:9px;
    padding:12px;
    text-align:left;
    font-weight:900;
}

.status-option:hover{
    border-color:#075b3b;
    background:#f0f8f3;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    background:#075b3b;
    color:#fff;
    padding:11px 18px;
    border-radius:9px;
    font-size:12px;
    font-weight:800;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:9000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:850px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .order-body{
        grid-template-columns:1fr 1fr;
    }

}


@media(max-width:600px){

    .header{
        padding:12px;
    }

    .header h1{
        font-size:18px;
    }

    .logout{
        padding:8px 10px;
        font-size:11px;
    }

    .container{
        width:94%;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        padding:12px;
    }

    .stat-value{
        font-size:21px;
    }

    .order-body{
        grid-template-columns:1fr;
    }

    .toolbar{
        padding:10px;
    }

    .search{
        min-width:100%;
    }

    .filter{
        flex:1;
    }

    .refresh{
        flex:1;
    }

    .action-btn{
        flex:1;
        min-width:100px;
    }

}


@media(max-width:400px){

    .stats{
        gap:7px;
    }

    .stat-label{
        font-size:9px;
    }

    .stat-value{
        font-size:18px;
    }

    .order-card{
        padding:12px;
    }

}

</style>

<script type="module">

from

}
from

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDonHK2CtrUjAkAaro6stnJmdDUwB59JT0",

    authDomain:
    "utkalamart-1ec68.firebaseapp.com",

    projectId:
    "utkalamart-1ec68",

    storageBucket:
    "utkalamart-1ec68.firebasestorage.app",

    messagingSenderId:
    "664871353747",

    appId:
    "1:664871353747:web:96532fdafe78aabe7f3c66"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   GLOBAL
===================================================== */

let allOrders = [];

let selectedOrder = null;


/* =====================================================
   ADMIN EMAIL
===================================================== */

const ADMIN_EMAIL =
    "suryakantabehera629@gmail.com";


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginBtn")
.addEventListener(
    "click",
    login
);


async function login(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const error =
        document
        .getElementById("loginError");


    error.style.display =
        "none";

        error.innerText =
            "Email ଏବଂ Password ଦିଅନ୍ତୁ।";

        error.style.display =
            "block";

        return;

    }


    const button =
        document
        .getElementById("loginBtn");


    button.disabled =
        true;

    button.innerText =
        "⏳ Login...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }
    catch(error){

        console.error(error);

        const loginError =
            document.getElementById(
                "loginError"
            );

        loginError.innerText =
            "❌ Login failed. Email କିମ୍ବା Password check କରନ୍ତୁ।";

        loginError.style.display =
            "block";

    }


    button.disabled =
        false;

    button.innerText =
        "🔐 Login";

}

   LOGOUT
===================================================== */

window.logout =
async function(){

    await signOut(auth);

};


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    if(!value){
        return "Date unavailable";
    }


    try{

        const date =
            value.toDate
            ? value.toDate()
            : new Date(value);


        if(
            isNaN(
                date.getTime()
            )
        ){
            return "Date unavailable";
        }


        return date.toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch(e){

        return "Date unavailable";

    }

}


/* =====================================================
   STATUS TEXT
===================================================== */

function statusText(status){

    const map = {

        placed:
            "Order Placed",

        confirmed:
            "Order Confirmed",

        processing:
            "Processing",

        shipped:
            "Order Shipped",

        delivered:
            "Order Delivered",

        cancelled:
            "Order Cancelled"

    };


    return map[status] ||
        "Order Placed";

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(match){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[match];

        }
    );

}


/* =====================================================
   CUSTOMER
===================================================== */

function getCustomer(order){

    return order.customer || {};

}


/* =====================================================
   MOBILE
===================================================== */

function getMobile(order){

    const customer =
        getCustomer(order);

    return String(
        customer.mobile ||
        customer.phone ||
        ""
    )
    .replace(
        /\D/g,
        ""
    )
    .slice(-10);

}


/* =====================================================
   CUSTOMER ORDER ID
===================================================== */

/*
   IMPORTANT:

   order.orderId =
   UTK-20260917-6911

   order.id =
   Firebase internal document ID

   Customer tracking uses order.orderId.
*/

function getCustomerOrderId(order){

    return String(
        order.orderId ||
        ""
    ).trim();

}


/* =====================================================
   ADMIN REFERENCE ID
===================================================== */

function getFirebaseDocumentId(order){

    return String(
        order.id ||
        ""
    ).trim();

}


/* =====================================================
   IMAGE
===================================================== */

function getImage(item){

    return String(
        item.image ||
        item.imageUrl ||
        item.photo ||
        "logo.png"
    ).trim() || "logo.png";

}


/* =====================================================
   LOAD ORDERS
===================================================== */

window.loadOrders =
async function(){

    const container =
        document.getElementById(
            "orders"
        );


    container.innerHTML = `

        <div class="loading">

            ⏳ Orders load ହେଉଛି...

        </div>

    `;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "orders"
                )
            );


        allOrders = [];


        snapshot.forEach(
            function(orderDoc){

                allOrders.push({

                    id:
                        orderDoc.id,

                    ...orderDoc.data()

                });

            }
        );


        allOrders.sort(
            function(a,b){

                const aTime =
                    a.createdAt?.toMillis
                    ? a.createdAt.toMillis()
                    : 0;

                const bTime =
                    b.createdAt?.toMillis
                    ? b.createdAt.toMillis()
                    : 0;

                return bTime - aTime;

            }
        );


        updateStats();

        renderOrders();

    }
    catch(error){

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                ❌ Orders load ହୋଇପାରିଲା ନାହିଁ।

                <br><br>

                Firebase Rules / Admin Login check କରନ୍ତୁ।

            </div>

        `;

    }

};


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    const total =
        allOrders.length;


    const pending =
        allOrders.filter(
            order => {

                const status =
                    String(
                        order.orderStatus ||
                        "placed"
                    ).toLowerCase();

                return [
                    "placed",
                    "confirmed",
                    "processing",
                    "shipped"
                ].includes(status);

            }
        ).length;


    const delivered =
        allOrders.filter(
            order =>
                String(
                    order.orderStatus ||
                    ""
                ).toLowerCase()
                ===
                "delivered"
        ).length;


    const sales =
        allOrders.reduce(
            function(sum,order){

                const status =
                    String(
                        order.orderStatus ||
                        ""
                    ).toLowerCase();


                if(
                    status ===
                    "cancelled"
                ){
                    return sum;
                }


                return sum +
                    Number(
                        order.total || 0
                    );

            },
            0
        );


    document
    .getElementById(
        "totalOrders"
    )
    .innerText =
        total;


    document
    .getElementById(
        "pendingOrders"
    )
    .innerText =
        pending;


    document
    .getElementById(
        "deliveredOrders"
    )
    .innerText =
        delivered;


    document
    .getElementById(
        "sales"
    )
    .innerText =
        "₹" +
        sales.toLocaleString(
            "en-IN"
        );

}

function renderOrders(){

    const container =
        document.getElementById(
            "orders"
        );


    const query =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const filter =
        document
        .getElementById(
            "statusFilter"
        )
        .value;


    const filtered =
        allOrders.filter(
            function(order){

                const customer =
                    getCustomer(order);


                const status =
                    String(
                        order.orderStatus ||
                        "placed"
                    ).toLowerCase();


                const searchable = [

                    getCustomerOrderId(order),

                    getFirebaseDocumentId(order),

                    customer.name,

                    customer.mobile,

                    customer.phone,

                    customer.address,

                    customer.city,

                    customer.pincode,

                    customer.pin

                ]
                .map(
                    value =>
                        String(
                            value || ""
                        ).toLowerCase()
                )
                .join(" ");


                const matchesSearch =
                    !query ||
                    searchable.includes(
                        query
                    );


                const matchesStatus =
                    filter === "all" ||
                    status === filter;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    container.innerHTML = "";


    if(!filtered.length){

        container.innerHTML = `

            <div class="empty">

                📦 କୌଣସି Order ମିଳିଲା ନାହିଁ।

            </div>

        `;

        return;

    }


    filtered.forEach(
        function(order){

            container.appendChild(
                createOrderCard(order)
            );

        }
    );

}

const statusOrder = [

    "placed",
    "confirmed",
    "processing",
    "shipped",
    "delivered"

];


/* =====================================================
   BUILD TRACKING DATA
===================================================== */

function buildTrackingData(
    order,
    newStatus,
    existingData = {}
){

    const mobile =
        getMobile(order);


    if(!mobile){

        throw new Error(
            "Customer mobile number missing"
        );

    }


    const customerOrderId =
        getCustomerOrderId(order);


    if(!customerOrderId){

        throw new Error(
            "Customer Order ID missing"
        );

    }


    const trackingData = {

        orderId:
            customerOrderId,

        orderStatus:
            newStatus,

        total:
            Number(
                order.total || 0
            ),

        items:
            Array.isArray(order.items)
            ?
            order.items.map(
                item => ({

                    name:
                        item.name ||
                        "Product",

                    qty:
                        Number(
                            item.qty || 1
                        ),

                    price:
                        Number(
                            item.price || 0
                        ),

                    image:
                        item.image ||
                        item.imageUrl ||
                        "",

                    weight:
                        item.weight ||
                        "",

                    weightUnit:
                        item.weightUnit ||
                        ""

                })
            )
            :
            [],

        updatedAt:
            serverTimestamp()

    };


    /*
       Preserve estimated delivery
       information if already present.
    */

    if(
        order.estimatedDelivery
    ){

        trackingData.estimatedDelivery =
            order.estimatedDelivery;

    }

    if(
        order.estimatedDeliveryStart
    ){

        trackingData.estimatedDeliveryStart =
            order.estimatedDeliveryStart;

    }

    if(
        order.estimatedDeliveryEnd
    ){

        trackingData.estimatedDeliveryEnd =
            order.estimatedDeliveryEnd;

    }

    if(
        order.estimatedDeliveryMinDays !==
        undefined
    ){

        trackingData.estimatedDeliveryMinDays =
            order.estimatedDeliveryMinDays;

    }

    if(
        order.estimatedDeliveryMaxDays !==
        undefined
    ){

        trackingData.estimatedDeliveryMaxDays =
            order.estimatedDeliveryMaxDays;

    }


    /*
       If tracking document does not have
       createdAt yet, preserve existing
       or use order createdAt.
    */

    if(
        !existingData.createdAt
    ){

        trackingData.createdAt =
            order.createdAt ||
            serverTimestamp();

    }


    /*
       Preserve placedAt.
    */

    if(
        !existingData.placedAt &&
        (
            newStatus === "placed" ||
            !existingData.orderStatus
        )
    ){

        trackingData.placedAt =
            order.createdAt ||
            serverTimestamp();

    }


    /*
       Status timestamp.
    */

    if(newStatus === "placed"){

        trackingData.placedAt =
            existingData.placedAt ||
            serverTimestamp();

    }

    if(newStatus === "confirmed"){

        trackingData.confirmedAt =
            existingData.confirmedAt ||
            serverTimestamp();

    }

    if(newStatus === "processing"){

        trackingData.processingAt =
            existingData.processingAt ||
            serverTimestamp();

    }

    if(newStatus === "shipped"){

        trackingData.shippedAt =
            existingData.shippedAt ||
            serverTimestamp();

    }

    if(newStatus === "delivered"){

        trackingData.deliveredAt =
            existingData.deliveredAt ||
            serverTimestamp();

    }

    if(newStatus === "cancelled"){

        trackingData.cancelledAt =
            existingData.cancelledAt ||
            serverTimestamp();

    }


    return trackingData;

}


/* =====================================================
   CHANGE STATUS
===================================================== */

window.changeStatus =
async function(newStatus){

    if(!selectedOrder){
        return;
    }


    const order =
        selectedOrder;


    const currentStatus =
        String(
            order.orderStatus ||
            "placed"
        ).toLowerCase();


    if(
        currentStatus ===
        newStatus
    ){

        toast(
            "ℹ️ Order already has this status."
        );

        return;

    }


    if(
        currentStatus ===
        "delivered"
    ){

        toast(
            "❌ Delivered Orderର status change କରାଯିବ ନାହିଁ।"
        );

        return;

    }


    if(
        currentStatus ===
        "cancelled"
    ){

        toast(
            "❌ Cancelled Orderର status change କରାଯିବ ନାହିଁ।"
        );

        return;

    }


    if(
        newStatus !==
        "cancelled"
    ){

        const currentIndex =
            statusOrder.indexOf(
                currentStatus
            );


        const newIndex =
            statusOrder.indexOf(
                newStatus
            );


        if(
            newIndex <
            currentIndex
        ){

            toast(
                "⚠️ Order status ପଛକୁ change କରିହେବ ନାହିଁ।"
            );

            return;

        }

    }


    if(
        newStatus ===
        "cancelled"
    ){

        const yes =
            confirm(
                "ଏହି Order cancel କରିବେ କି?\n\nStock automatically restore ହେବ।"
            );


        if(!yes)return;


        await cancelOrderInternal(
            order
        );

        return;

    }


    try{

        toast(
            "⏳ Status update ହେଉଛି..."
        );


        const customerOrderId =
            getCustomerOrderId(
                order
            );


        if(!customerOrderId){

            throw new Error(
                "Customer Order ID missing"
            );

        }


        const mobile =
            getMobile(order);


        if(!mobile){

            throw new Error(
                "Customer mobile number missing"
            );

        }


        /*
           Tracking document uses:

           UTK-20260917-6911_9827275681
        */

        const trackingId =
            `${customerOrderId}_${mobile}`;


        const orderRef =
            doc(
                db,
                "orders",
                getFirebaseDocumentId(order)
            );


        const trackingRef =
            doc(
                db,
                "orderTracking",
                trackingId
            );


        /*
           Use batch so main Order and
           Customer Tracking update together.
        */

        const batch =
            writeBatch(db);


        batch.update(
            orderRef,
            {

                orderStatus:
                    newStatus,

                updatedAt:
                    serverTimestamp(),

                adminConfirmed:
                    newStatus === "confirmed"
                    ?
                    true
                    :
                    order.adminConfirmed ||
                    false

            }
        );


        const trackingData =
            buildTrackingData(
                order,
                newStatus
            );


        batch.set(
            trackingRef,
            trackingData,
            {
                merge:true
            }
        );


        await batch.commit();


        /*
           Update local copy.
        */

        order.orderStatus =
            newStatus;


        closeStatusModal();

        updateStats();

        renderOrders();


        toast(
            "✅ Status update ହୋଇଗଲା। Customer tracking ମଧ୍ୟ update ହେଲା।"
        );

    }
    catch(error){

        console.error(
            "STATUS UPDATE ERROR:",
            error
        );


        toast(
            "❌ Status update failed: " +
            (
                error.message ||
                "Firebase error"
            )
        );

    }

};


/* =====================================================
   CANCEL ORDER INTERNAL
===================================================== */

async function cancelOrderInternal(
    order
){

    try{

        toast(
            "⏳ Order cancel + stock restore..."
        );


        const firebaseDocumentId =
            getFirebaseDocumentId(
                order
            );


        const customerOrderId =
            getCustomerOrderId(
                order
            );


        const mobile =
            getMobile(order);


        if(!customerOrderId){

            throw new Error(
                "Customer Order ID missing"
            );

        }


        if(!mobile){

            throw new Error(
                "Customer mobile number missing"
            );

        }


        /*
           FIRST:
           Read all product documents.

           Firestore transaction requires
           reads before writes.
        */

        await runTransaction(
            db,
            async function(transaction){

                const orderRef =
                    doc(
                        db,
                        "orders",
                        firebaseDocumentId
                    );


                const orderSnap =
                    await transaction.get(
                        orderRef
                    );


                if(
                    !orderSnap.exists()
                ){

                    throw new Error(
                        "Order not found"
                    );

                }


                const freshOrder =
                    orderSnap.data();


                const currentStatus =
                    String(
                        freshOrder.orderStatus ||
                        "placed"
                    ).toLowerCase();


                if(
                    currentStatus ===
                    "cancelled"
                ){

                    throw new Error(
                        "Order already cancelled"
                    );

                }


                if(
                    currentStatus ===
                    "delivered"
                ){

                    throw new Error(
                        "Delivered order cannot be cancelled"
                    );

                }


                const items =
                    Array.isArray(
                        freshOrder.items
                    )
                    ?
                    freshOrder.items
                    :
                    [];


                const productRefs = [];

                const productSnaps = [];


                /*
                   READ PRODUCTS
                */

                if(
                    freshOrder.stockRestored
                    !== true
                ){

                    for(
                        const item of items
                    ){

                        /*
                           IMPORTANT:

                           Checkout stores:
                           productId

                           Older code checked:
                           item.id

                           Now both are supported.
                        */

                        const productId =
                            item.productId ||
                            item.id ||
                            "";


                        if(!productId){
                            continue;
                        }


                        const productRef =
                            doc(
                                db,
                                "products",
                                productId
                            );


                        const productSnap =
                            await transaction.get(
                                productRef
                            );


                        productRefs.push(
                            {
                                ref:
                                    productRef,

                                snap:
                                    productSnap,

                                item:
                                    item
                            }
                        );

                    }


                    /*
                       NOW WRITE STOCK
                    */

                    for(
                        const productData
                        of productRefs
                    ){

                        const productSnap =
                            productData.snap;


                        if(
                            !productSnap.exists()
                        ){

                            continue;

                        }


                        const product =
                            productSnap.data();


                        const item =
                            productData.item;


                        const qty =
                            Number(
                                item.qty || 1
                            );


                        const field =
                            product.stockQty !== undefined
                            ?
                            "stockQty"
                            :
                            product.availableStock !== undefined
                            ?
                            "availableStock"
                            :
                            product.stock !== undefined
                            ?
                            "stock"
                            :
                            product.quantity !== undefined
                            ?
                            "quantity"
                            :
                            "stockQty";


                        const currentStock =
                            Number(
                                product[field] || 0
                            );


                        transaction.update(
                            productData.ref,
                            {

                                [field]:
                                    currentStock +
                                    qty

                            }
                        );

                    }

                }


                /*
                   UPDATE MAIN ORDER
                */

                transaction.update(
                    orderRef,
                    {

                        orderStatus:
                            "cancelled",

                        stockRestored:
                            true,

                        updatedAt:
                            serverTimestamp(),

                        cancelledAt:
                            serverTimestamp()

                    }
                );

            }
        );


        /*
           UPDATE CUSTOMER TRACKING

           Uses CUSTOMER Order ID,
           not Firebase document ID.
        */

        const trackingId =
            `${customerOrderId}_${mobile}`;


        const trackingRef =
            doc(
                db,
                "orderTracking",
                trackingId
            );


        const trackingData =
            buildTrackingData(
                order,
                "cancelled"
            );


        await setDoc(
            trackingRef,
            trackingData,
            {
                merge:true
            }
        );


        order.orderStatus =
            "cancelled";


        order.stockRestored =
            true;


        closeStatusModal();

        updateStats();

        renderOrders();


        toast(
            "✅ Order Cancelled ଏବଂ Customer Tracking update ହୋଇଗଲା।"
        );

    }
    catch(error){

        console.error(
            "CANCEL ERROR:",
            error
        );


        toast(
            "❌ Cancel failed: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


/* =====================================================
   CANCEL BUTTON
===================================================== */

window.cancelOrder =
async function(firebaseDocumentId){

    const order =
        findOrder(
            firebaseDocumentId
        );


    if(!order)return;


    const status =
        String(
            order.orderStatus ||
            "placed"
        ).toLowerCase();


    if(
        status ===
        "delivered"
    ){

        toast(
            "❌ Delivered Order cancel କରିହେବ ନାହିଁ।"
        );

        return;

    }


    if(
        status ===
        "cancelled"
    ){

        toast(
            "ℹ️ Order already cancelled."
        );

        return;

    }


    const yes =
        confirm(
            "Order Cancel କରିବେ କି?\n\nCancel ପରେ stock automatically restore ହେବ।"
        );


    if(!yes)return;


    await cancelOrderInternal(
        order
    );

};

window.openWhatsApp =
function(
    mobile,
    orderId
){

    const message =
        `ନମସ୍କାର, Utkala Mart Order ${orderId} ବିଷୟରେ ଯୋଗାଯୋଗ କରୁଛୁ।`;


    const url =
        "https://wa.me/91" +
        mobile +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank"
    );

};


/* =====================================================
   TOAST
===================================================== */

function toast(message){

    const element =
        document.getElementById(
            "toast"
        );


    element.innerText =
        message;


    element.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function(){

                element.classList.remove(
                    "show"
                );

            },
            3000
        );

}
