<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>UtkalaMart - Checkout</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,"Noto Sans Oriya","Nirmala UI",sans-serif;
    background:#eaeded;
    color:#172337;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

.header{
    background:#131921;
    color:white;
    padding:11px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    color:#78c7ff;
    font-size:27px;
    font-weight:bold;
    text-decoration:none;
}

.logo span{
    color:#ff7518;
}

.logo small{
    display:block;
    color:#b7e9c8;
    font-size:10px;
    font-weight:normal;
    margin-top:3px;
}

.secure{
    color:#b7e9c8;
    font-size:13px;
}

/* PROGRESS */

.progress{
    background:white;
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
    color:#777;
    font-size:14px;
}

.progress span{
    color:#087f3f;
    font-weight:bold;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.title{
    margin-bottom:20px;
}

.title h1{
    font-size:29px;
}

.title h1 span{
    color:#ff6b00;
}

.title p{
    color:#666;
    margin-top:6px;
    font-size:14px;
}

/* LAYOUT */

.checkout-layout{
    display:grid;
    grid-template-columns:1fr 370px;
    gap:20px;
    align-items:start;
}

/* CARD */

.card{
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:22px;
    margin-bottom:18px;
}

.card h2{
    font-size:21px;
    margin-bottom:18px;
    border-bottom:2px solid #ff9900;
    padding-bottom:10px;
}

/* FORM */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.full{
    grid-column:1/-1;
}

.field label{
    display:block;
    color:#243b5a;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

.required{
    color:#d00;
}

.field input,
.field textarea,
.field select{
    width:100%;
    padding:13px;
    border:1px solid #ccd2d9;
    border-radius:7px;
    outline:none;
    background:white;
    color:#111;
    font-size:14px;
}

.field textarea{
    min-height:105px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#087f3f;
    box-shadow:0 0 0 3px rgba(8,127,63,.08);
}

.address-note{
    background:#f3fff7;
    color:#087f3f;
    padding:12px;
    border-radius:7px;
    font-size:12px;
    line-height:1.6;
    margin-bottom:17px;
}

/* ORDER ITEMS */

.order-item{
    display:grid;
    grid-template-columns:75px 1fr auto;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.order-image{
    width:75px;
    height:75px;
    border:1px solid #ddd;
    border-radius:7px;
    overflow:hidden;
    background:#f7f7f7;
}

.order-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.order-name{
    font-size:14px;
    font-weight:bold;
    line-height:1.5;
}
