<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Utkala Mart</title>

<meta name="theme-color" content="#138a45">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Odia",sans-serif;
  background:#f5f7f6;
  color:#222;
}

header{
  background:#138a45;
  color:white;
  padding:16px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:5px 0 0;
  font-size:14px;
}

.container{
  max-width:900px;
  margin:20px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  color:#138a45;
  font-size:20px;
}

.product{
  display:flex;
  gap:12px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.product:last-child{
  border-bottom:none;
}

.product img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}

.product-info{
  flex:1;
}

.product-info h3{
  margin:0 0 5px;
  font-size:16px;
}

.product-info p{
  margin:3px 0;
  font-size:13px;
  color:#666;
}

.price{
  font-weight:bold;
  color:#138a45;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:14px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#138a45;
}

textarea{
  min-height:90px;
  resize:vertical;
}

label{
  font-weight:bold;
  font-size:14px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
}

.total{
  border-top:2px solid #138a45;
  margin-top:8px;
  padding-top:12px;
  font-size:20px;
  font-weight:bold;
}

.payment-option{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
}

.payment-option input{
  width:auto;
  margin:0;
}

button{
  width:100%;
  border:none;
  padding:14px;
  border-radius:10px;
  background:#138a45;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#0d7138;
}

button:disabled{
  background:#999;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#777;
}

.back{
  display:inline-block;
  margin-bottom:15px;
  color:#138a45;
  text-decoration:none;
  font-weight:bold;
}

.status-box{
  display:none;
  padding:14px;
  border-radius:10px;
  margin-bottom:15px;
  font-weight:bold;
}

.success{
  background:#e8f8ee;
  color:#087333;
}

.error{
  background:#ffecec;
  color:#b00000;
}

@media(max-width:600px){

  .container{
    margin:10px auto;
  }

  .card{
    padding:14px;
  }

  .product img{
    width:60px;
    height:60px;
  }

  .product-info h3{
    font-size:14px;
  }

}
</style>
</head>

<body>

<header>
  <h1>🛍️ Utkala Mart</h1>
  <p>ଗଞ୍ଜାମର ପ୍ରଡକ୍ଟ — ଆପଣଙ୍କ ଘରେ</p>
</header>

<div class="container">

<a href="index.html" class="back">← Shopping କୁ ଫେରନ୍ତୁ</a>

<div id="statusBox" class="status-box"></div>

<!-- ORDER ITEMS -->
<div class="card">
  <h2>🛒 ଆପଣଙ୍କ Order</h2>
  <div id="cartItems"></div>
</div>

<!-- CUSTOMER DETAILS -->
<div class="card">

  <h2>👤 Customer Details</h2>

  <label>ନାମ *</label>
  <input
    type="text"
    id="customerName"
    placeholder="ଆପଣଙ୍କ ନାମ"
  >

  <label>Mobile Number *</label>
  <input
    type="tel"
    id="mobile"
    maxlength="10"
    placeholder="10 digit mobile number"
  >

  <label>ଠିକଣା *</label>
  <textarea
    id="address"
    placeholder="ଘର ନମ୍ବର, ଗ୍ରାମ/ସହର, ରାସ୍ତା..."
  ></textarea>

  <label>ଜିଲ୍ଲା *</label>
  <input
    type="text"
    id="district"
    placeholder="ଉଦାହରଣ: Ganjam"
  >

  <label>PIN Code *</label>
  <input
    type="tel"
    id="pin"
    maxlength="6"
    placeholder="6 digit PIN"
  >

  <label>ଅତିରିକ୍ତ Note</label>
  <textarea
    id="note"
    placeholder="କୌଣସି ବିଶେଷ ନିର୍ଦ୍ଦେଶ ଥିଲେ ଲେଖନ୍ତୁ..."
  ></textarea>

</div>

<!-- PAYMENT -->
<div class="card">

  <h2>💳 Payment Method</h2>

  <label class="payment-option">
    <input
      type="radio"
      name="payment"
      value="COD"
      checked
    >
    <span>💵 Cash on Delivery</span>
  </label>

  <label class="payment-option">
    <input
      type="radio"
      name="payment"
      value="UPI"
    >
    <span>📱 UPI Payment</span>
  </label>

</div>

<!-- SUMMARY -->
<div class="card">

  <h2>🧾 Order Summary</h2>

  <div class="summary-row">
    <span>Subtotal</span>
    <strong id="subtotal">₹0</strong>
  </div>

  <div class="summary-row">
    <span>Delivery</span>
    <strong id="delivery">₹0</strong>
  </div>

  <div class="summary-row total">
    <span>Total</span>
    <strong id="total">₹0</strong>
  </div>

  <br>

  <button id="placeOrderBtn" onclick="placeOrder()">
    ✅ Order Place କରନ୍ତୁ
  </button>

</div>

</div>


<script type="module">

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ==============================
   CART
================================ */

let cart = [];

try{

  cart = JSON.parse(
    localStorage.getItem("utkalaCart")
  ) || [];

}catch(e){

  cart = [];

}


/* ==============================
   STATUS
================================ */

function showStatus(message,type){

  const box =
    document.getElementById("statusBox");

  box.style.display="block";

  box.className =
    "status-box " + type;

  box.innerText = message;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==============================
   NUMBER
================================ */

function money(value){

  return "₹" +
    Number(value || 0).toLocaleString("en-IN");

}


/* ==============================
   RENDER CART
================================ */

function renderCart(){

  const container =
    document.getElementById("cartItems");

  if(!cart.length){

    container.innerHTML = `
      <div class="empty">
        🛒 Cart ଖାଲି ଅଛି।
        <br><br>
        Shopping କୁ ଫେରି ପ୍ରଡକ୍ଟ Add କରନ୍ତୁ।
      </div>
    `;

    document.getElementById("placeOrderBtn")
      .disabled = true;

    return;
  }


  let subtotal = 0;

  container.innerHTML = cart.map(item => {

    const qty =
      Number(item.qty || item.quantity || 1);

    const price =
      Number(
        item.price ||
        item.utkalaPrice ||
        item.sellingPrice ||
        0
      );

    subtotal += price * qty;

    const weight =
      item.weight
      ? `${item.weight} ${item.weightUnit || item.unit || ""}`
