<style>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <img
        id="logo"

        src="logo.png"
        alt="Utkala Mart">

    <div class="brand">

        ଉତ୍କଳ
        <span>Mart</span>

    </div>

</header>


<!-- =====================================================
     PRODUCT
===================================================== -->

<main class="container">

    <div
        id="loading"
        class="loading">

        ⏳ Product load ହେଉଛି...

    </div>


    <div
        id="productCard"
        class="card"
        style="display:none;">

        <img
            id="productImage"
            class="product-image"
            src="logo.png"

        <h1
            id="productName"
            class="product-name">

            Utkala Mart Product

        </h1>


        <div
            id="productPrice"
            class="product-price">

            ₹0

        </div>


        <div
            id="productDescription"

            ଓଡ଼ିଆ ପ୍ରଡକ୍ଟ

        <a

            🛒 Buy Now

<!-- =====================================================
     FOOTER

    <br>

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import { db } from "./js/firebase-config.js";

import {
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const productId =
    params.get("id");


const sourceParam =
    params.get("source");


const allowedSources = [

    "products",

    "martProducts"

];


/* =====================================================
   GET IMAGE
===================================================== */

function getImage(product){

    return String(

        product.imageUrl ||

        product.image ||

        product.photoUrl ||

        product.photo ||

        "logo.png"

    ).trim() || "logo.png";

}


/* =====================================================
   GET PRICE
===================================================== */

function getPrice(product){

    return Number(

        product.utkalaPrice ??

        product.price ??

        product.sellingPrice ??

        0

    );

}


/* =====================================================
   GET NAME
===================================================== */

function getName(product){

    return (

        product.name ||

        product.productName ||

        "Utkala Mart Product"

    );

}


/* =====================================================
   GET DESCRIPTION
===================================================== */

function getDescription(product){

    return (

        product.description ||

        product.details ||

        product.productDescription ||

        "ଓଡ଼ିଆ ପ୍ରଡକ୍ଟ — Utkala Mart"

    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(match){

            return {

                "&":"&amp;",

                "<":"&lt;",

                ">":"&gt;",

                '"':"&quot;",

                "'":"&#039;"

            }[match];

        }
    );

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct(){

    if(!productId){

        showError();

        return;

    }


    try{

        let product = null;

        let source = null;


        /* =================================================
           DIRECT SOURCE
        ================================================= */

        if(

            sourceParam &&

            allowedSources.includes(
                sourceParam
            )

        ){

            const ref =
                doc(
                    db,
                    sourceParam,
                    productId
                );


            const snap =
                await getDoc(ref);


            if(snap.exists()){

                product = {

                    id:
                        snap.id,

                    source:
                        sourceParam,

                    ...snap.data()

                };

                source =
                    sourceParam;

            }

        }


        /* =================================================
           FALLBACK
        ================================================= */

        if(!product){

            for(
                const collectionName
                of
                allowedSources
            ){

                try{

                    const ref =
                        doc(
                            db,
                            collectionName,
                            productId
                        );


                    const snap =
                        await getDoc(ref);


                    if(snap.exists()){

                        product = {

                            id:
                                snap.id,

                            source:
                                collectionName,

                            ...snap.data()

                        };

                        source =
                            collectionName;

                        break;

                    }

                }
                catch(error){

                    console.log(
                        "Read error:",
                        error
                    );

                }

            }

        }


        if(!product){

            showError();

            return;

        }


        displayProduct(
            product,
            source
        );

    }
    catch(error){

        console.error(
            "Share Product Error:",
            error
        );

        showError();

    }

}


/* =====================================================
   DISPLAY
===================================================== */

function displayProduct(
    product,
    source
){

    const name =
        getName(product);


    const price =
        getPrice(product);


    const image =
        getImage(product);


    const description =
        getDescription(product);


    /* =================================================
       PRODUCT URL
    ================================================= */

    const productUrl =
        window.location.origin +
        window.location.pathname
        .replace(
            "share.html",
            "product.html"
        ) +
        "?id=" +
        encodeURIComponent(
            product.id
        ) +
        "&source=" +
        encodeURIComponent(
            source
        );


    /* =================================================
       PAGE TITLE
    ================================================= */

    document.title =
        name +
        " | Utkala Mart";


    /* =================================================
       PAGE
    ================================================= */

    document
        .getElementById(
            "productImage"
        )
        .src =
            image;


    document
        .getElementById(
            "productImage"
        )
        .alt =
            name;


    document
        .getElementById(
            "productName"
        )
        .innerText =
            name;


    document
        .getElementById(
            "productPrice"
        )
        .innerText =
            "₹" +
            price.toLocaleString(
                "en-IN"
            );


    document
        .getElementById(
            "productDescription"
        )
        .innerText =
            description;


    document
        .getElementById(
            "buyButton"
        )
        .href =
            productUrl;


    /* =================================================
       OPEN GRAPH
    ================================================= */

    setMeta(
        "ogTitle",
        name +
        " | Utkala Mart"
    );


    setMeta(
        "ogDescription",
        "💰 Price: ₹" +
        price.toLocaleString(
            "en-IN"
        ) +
        " | 🌿 Utkala Mart"
    );


    setMeta(
        "ogImage",
        image
    );


    setMeta(
        "ogUrl",
        productUrl
    );


    /* =================================================
       TWITTER
    ================================================= */

    setMeta(
        "twitterTitle",
        name +
        " | Utkala Mart"
    );


    setMeta(
        "twitterDescription",
        "💰 Price: ₹" +
        price.toLocaleString(
            "en-IN"
        ) +
        " | 🌿 Utkala Mart"
    );


    setMeta(
        "twitterImage",
        image
    );


    /* =================================================
       SHOW
    ================================================= */

    document
        .getElementById(
            "loading"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "productCard"
        )
        .style.display =
            "block";


    /*
     * Browser ରେ open କଲେ
     * original product page କୁ
     * redirect କରିବା ନାହିଁ।
     *
     * User Buy Now କଲେ
     * product.html କୁ ଯିବେ।
     */

}


/* =====================================================
   SET META
===================================================== */

function setMeta(
    id,
    value
){

    const element =
        document.getElementById(
            id
        );


    if(element){

        element.setAttribute(
            "content",
            value
        );

    }

}


/* =====================================================
   ERROR
===================================================== */

function showError(){

    document
        .getElementById(
            "loading"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "errorBox"
        )
        .style.display =
            "block";

}


/* =====================================================
   START
===================================================== */

loadProduct();

</script>

</body>
