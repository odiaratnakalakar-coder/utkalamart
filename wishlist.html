<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#075b3b">

<title>ମୋ ପସନ୍ଦ | Utkala Mart</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        Arial,
        "Noto Sans Odia",
        "Noto Sans Oriya",
        sans-serif;
    background:#f5f7f6;
    color:#222;
    padding-bottom:80px;
}

/* TOP BAR */

.topbar{
    background:#075b3b;
    color:#fff;
    padding:8px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
}

.topbar a{
    color:#fff;
    text-decoration:none;
    margin-left:10px;
}

/* HEADER */

.header{
    background:#fff;
    padding:10px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
    text-decoration:none;
}

.logo{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
}

.brand h1{
    margin:0;
    font-size:24px;
    color:#e87522;
}

.brand h1 span{
    color:#08734b;
}

.brand p{
    margin:2px 0 0;
    font-size:10px;
    color:#777;
}

.header-links{
    display:flex;
    gap:12px;
}

.header-links a{
    text-decoration:none;
    color:#333;
    text-align:center;
    font-size:11px;
}

.header-links .icon{
    display:block;
    font-size:23px;
}

/* MAIN */

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.back{
    display:inline-block;
    margin-bottom:12px;
    color:#075b3b;
    text-decoration:none;
    font-weight:bold;
}

/* TITLE */

.page-title{
    background:linear-gradient(
        135deg,
        #075b3b,
        #0b8054
    );
    color:#fff;
    padding:19px;
    border-radius:16px;
    margin-bottom:15px;
}

.page-title h2{
    margin:0;
    font-size:22px;
}

.page-title p{
    margin:6px 0 0;
    font-size:13px;
    opacity:.9;
}

/* WISHLIST GRID */

.wishlist-grid{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:14px;
}

/* PRODUCT CARD */

.product-card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:
        0 2px 8px rgba(0,0,0,.07);
    position:relative;
}

.product-image{
    height:190px;
    background:#f1f3f2;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-emoji{
    font-size:65px;
}

.heart-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#fff;
    box-shadow:0 2px 7px rgba(0,0,0,.15);
    color:#e53935;
    font-size:20px;
    cursor:pointer;
}

.product-info{
    padding:13px;
}

.product-name{
    font-weight:bold;
    font-size:16px;
    margin-bottom:5px;
    line-height:1.4;
}

.product-category{
    color:#888;
    font-size:11px;
    margin-bottom:8px;
}

.price-row{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:5px;
}

.market-price{
    color:#999;
    text-decoration:line-through;
    font-size:12px;
}

.product-price{
    color:#075b3b;
    font-size:19px;
    font-weight:bold;
}

.save-text{
    color:#08734b;
    font-size:11px;
    margin-bottom:10px;
}

.buttons{
    display:flex;
    gap:7px;
}

.btn{
    flex:1;
    border-radius:8px;
    padding:9px 6px;
    font-size:12px;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
}

.cart-btn{
    background:#075b3b;
    color:#fff;
    border:1px solid #075b3b;
}

.buy-btn{
    background:#fff;
    color:#075b3b;
    border:1px solid #075b3b;
}

/* EMPTY */

.empty{
    background:#fff;
    border-radius:18px;
    padding:55px 20px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.empty-icon{
    font-size:65px;
}

.empty h3{
    color:#075b3b;
    margin:12px 0 6px;
}

.empty p{
    color:#777;
    font-size:13px;
}

.shop-btn{
    display:inline-block;
    margin-top:12px;
    background:#075b3b;
    color:#fff;
    text-decoration:none;
    padding:12px 22px;
    border-radius:9px;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%);
    background:#222;
    color:#fff;
    padding:11px 18px;
    border-radius:25px;
    font-size:13px;
    display:none;
    z-index:500;
    white-space:nowrap;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:67px;
    background:#fff;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.bottom-nav a{
    color:#555;
    text-decoration:none;
    text-align:center;
    font-size:11px;
}

.bottom-nav .icon{
    display:block;
    font-size:24px;
    line-height:27px;
}

.bottom-nav a.active{
    color:#075b3b;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:750px){

    .wishlist-grid{
        grid-template-columns:
            repeat(2,1fr);
        gap:10px;
    }

    .product-image{
        height:150px;
    }

}

@media(max-width:500px){

    .topbar{
        font-size:10px;
    }

    .header{
        padding:8px 10px;
    }

    .logo{
        width:47px;
        height:47px;
    }

    .brand h1{
        font-size:21px;
    }

    .brand p{
        font-size:9px;
    }

    .header-links{
        gap:6px;
    }

    .header-links .icon{
        font-size:20px;
    }

    .container{
        padding:12px;
    }

    .page-title h2{
        font-size:19px;
    }

    .product-image{
        height:135px;
    }

    .product-name{
        font-size:14px;
    }

    .product-price{
        font-size:16px;
    }

    .market-price{
        font-size:10px;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<!-- TOP BAR -->

<div class="topbar">

    <div>
        ଗଞ୍ଜାମରୁ ସାରା ଓଡ଼ିଶା
    </div>

    <div>

        <a href="order-tracking.html">
            📦 Order Track
        </a>

        <a href="seller.html">
            👤 Seller Login
        </a>

    </div>

</div>


<!-- HEADER -->

<header class="header">

    <a href="index.html"
       class="brand">

        <img
            src="logo.png"
            class="logo"
            alt="Utkala Mart"
        >

        <div>

            <h1>
                <span>ଉତ୍କଳ</span> Mart
            </h1>

            <p>
                From Ganjam to Every Home
            </p>

        </div>

    </a>


    <div class="header-links">

        <a href="checkout.html">

            <span class="icon">
                🛒
            </span>

            Cart

        </a>


        <a href="account.html">

            <span class="icon">
                👤
            </span>

            ଖାତା

        </a>

    </div>

</header>


<!-- MAIN -->

<main class="container">


    <a href="account.html"
       class="back">

        ← ମୋ ଖାତାକୁ ଫେରନ୍ତୁ

    </a>


    <!-- TITLE -->

    <div class="page-title">

        <h2>
            ❤️ ମୋ ପସନ୍ଦ
        </h2>

        <p>
            ଆପଣ ପସନ୍ଦ କରିଥିବା Product ଗୁଡ଼ିକ
        </p>

    </div>


    <!-- WISHLIST -->

    <div
        class="wishlist-grid"
        id="wishlistContainer">
    </div>


</main>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">


    <a href="index.html">

        <span class="icon">
            🏠
        </span>

        Home

    </a>


    <a href="index.html#categories">

        <span class="icon">
            📁
        </span>

        ବିଭାଗ

    </a>


    <a href="checkout.html">

        <span class="icon">
            🛒
        </span>

        Cart

    </a>


    <a href="order-tracking.html">

        <span class="icon">
            📦
        </span>

        Track

    </a>


    <a href="account.html"
       class="active">

        <span class="icon">
            👤
        </span>

        ଖାତା

    </a>


</nav>


<script>

/*
========================================
UTKALA MART - WISHLIST
========================================

ବର୍ତ୍ତମାନ demo wishlist।

ପରବର୍ତ୍ତୀ step ରେ Firebase
products + customer wishlist
ସହିତ connect କରାଯିବ।

LocalStorage ରେ wishlist
save ହେଉଛି, ଯାହାଦ୍ୱାରା page
refresh କଲେ data ରହିବ।
*/


let wishlist = [

    {
        id:"P001",
        name:"ଗଞ୍ଜାମ ପାପଡ଼",
        category:"ଖାଦ୍ୟ ଉତ୍ପାଦ",
        price:120,
        marketPrice:150,
        emoji:"🥣"
    },

    {
        id:"P002",
        name:"ହସ୍ତ ତିଆରି ଝୁଡ଼ି",
        category:"ହାତ ତିଆରି ଜିନିଷ",
        price:350,
        marketPrice:420,
        emoji:"🧺"
    },

    {
        id:"P003",
        name:"ସମ୍ବଲପୁରୀ କପଡ଼ା",
        category:"ପୋଷାକ ଏବଂ କପଡ଼ା",
        price:650,
        marketPrice:800,
        emoji:"🧣"
    }

];


/* LOAD SAVED WISHLIST */

function loadWishlist(){

    const saved =
        localStorage.getItem(
            "utkalaWishlist"
        );


    if(saved){

        try{

            wishlist =
                JSON.parse(saved);

        }catch(error){

            console.log(
                "Wishlist data error"
            );

        }

    }


    displayWishlist();

}


/* SAVE */

function saveWishlist(){

    localStorage.setItem(
        "utkalaWishlist",
        JSON.stringify(wishlist)
    );

}


/* DISPLAY */

function displayWishlist(){

    const container =
        document.getElementById(
            "wishlistContainer"
        );


    if(wishlist.length === 0){

        container.style.display =
            "block";


        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    💔
                </div>

                <h3>
                    ଆପଣଙ୍କ Wishlist ଖାଲି ଅଛି
                </h3>

                <p>
                    ପସନ୍ଦ କରିଥିବା Product ରେ ❤️
                    click କରି Wishlist ରେ ରଖନ୍ତୁ।
                </p>

                <a
                    href="index.html"
                    class="shop-btn">

                    🛍️ Shopping କରନ୍ତୁ

                </a>

            </div>

        `;

        return;

    }


    container.style.display =
        "grid";


    container.innerHTML =
        wishlist.map(
            product => `

            <div
                class="product-card"
                id="product-${product.id}"
            >

                <div class="product-image">

                    <div class="product-emoji">
                        ${product.emoji}
                    </div>


                    <button
                        class="heart-btn"
                        onclick="
                        removeWishlist(
                            '${product.id}'
                        )
                        ">

                        ❤️

                    </button>

                </div>


                <div class="product-info">

                    <div class="product-name">
                        ${product.name}
                    </div>


                    <div class="product-category">
                        ${product.category}
                    </div>


                    <div class="price-row">

                        <span
                            class="product-price">

                            ₹${product.price}

                        </span>


                        <span
                            class="market-price">

                            ₹${product.marketPrice}

                        </span>

                    </div>


                    <div class="save-text">

                        💚
                        Save ₹${
                            product.marketPrice -
                            product.price
                        }

                    </div>


                    <div class="buttons">

                        <button
                            class="btn cart-btn"
                            onclick="
                            addToCart(
                                '${product.id}'
                            )
                            ">

                            🛒 Cart

                        </button>


                        <button
                            class="btn buy-btn"
                            onclick="
                            buyNow(
                                '${product.id}'
                            )
                            ">

                            ⚡ Buy Now

                        </button>

                    </div>

                </div>

            </div>

        `
        ).join("");

}


/* REMOVE */

function removeWishlist(id){

    wishlist =
        wishlist.filter(
            product =>
            product.id !== id
        );


    saveWishlist();

    displayWishlist();

    showToast(
        "❤️ Wishlist ରୁ Product remove ହେଲା"
    );

}


/* ADD CART */

function addToCart(id){

    const product =
        wishlist.find(
            item =>
            item.id === id
        );


    if(!product){
        return;
    }


    let cart =
        JSON.parse(
            localStorage.getItem(
                "utkalaCart"
            ) || "[]"
        );


    const existing =
        cart.find(
            item =>
            item.id === product.id
        );


    if(existing){

        existing.quantity =
            (existing.quantity || 1) + 1;

    }else{

        cart.push({

            id:product.id,

            name:product.name,

            price:product.price,

            quantity:1,

            emoji:product.emoji

        });

    }


    localStorage.setItem(
        "utkalaCart",
        JSON.stringify(cart)
    );


    showToast(
        "🛒 Product Cart ରେ ଯୋଡ଼ାଗଲା"
    );

}


/* BUY NOW */

function buyNow(id){

    addToCart(id);

    setTimeout(
        function(){

            window.location.href =
                "checkout.html";

        },
        500
    );

}


/* TOAST */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function(){

                toast.style.display =
                    "none";

            },
            2200
        );

}


/* START */

loadWishlist();

</script>


</body>
