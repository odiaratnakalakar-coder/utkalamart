<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#138a45">

<title>Utkala Mart - Admin Login</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:
    Arial,
    "Noto Sans Odia",
    "Noto Sans Oriya",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eaf7ef,
      #ffffff
    );
}

.login-box{

  width:92%;
  max-width:420px;

  background:#fff;

  padding:28px;

  border-radius:18px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.12);
}

.logo{

  text-align:center;

  font-size:45px;

  margin-bottom:5px;
}

h1{

  text-align:center;

  color:#138a45;

  margin:5px 0;

  font-size:25px;
}

.subtitle{

  text-align:center;

  color:#777;

  margin-bottom:25px;
}

label{

  display:block;

  font-weight:bold;

  margin-bottom:7px;
}

input{

  width:100%;

  padding:13px;

  border:1px solid #ccc;

  border-radius:9px;

  font-size:16px;

  margin-bottom:15px;
}

input:focus{

  outline:none;

  border-color:#138a45;

  box-shadow:
    0 0 0 3px
    rgba(19,138,69,.08);
}

.login-btn{

  width:100%;

  border:0;

  padding:13px;

  border-radius:9px;

  background:#138a45;

  color:#fff;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;
}

.login-btn:hover{

  background:#0d7138;
}

.login-btn:disabled{

  opacity:.6;

  cursor:not-allowed;
}

.message{

  margin-top:15px;

  text-align:center;

  font-size:14px;

  line-height:1.5;

  min-height:20px;
}

.success{

  color:#138a45;
}

.error{

  color:#d32f2f;
}

.back{

  display:block;

  text-align:center;

  margin-top:20px;

  color:#138a45;

  text-decoration:none;
}

.back:hover{

  text-decoration:underline;
}

.security{

  margin-top:18px;

  padding:10px;

  border-radius:8px;

  background:#f5faf7;

  color:#777;

  text-align:center;

  font-size:10px;

  line-height:1.5;
}

</style>

</head>


<body>


<div class="login-box">


  <div class="logo">
    🛒
  </div>


  <h1>
    Utkala Mart
  </h1>


  <div class="subtitle">
    🔐 Admin Login
  </div>


  <form id="loginForm">


    <label>
      📧 Email
    </label>


    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      required
      autocomplete="username">


    <label>
      🔑 Password
    </label>


    <input
      type="password"
      id="password"
      placeholder="Password"
      required
      autocomplete="current-password">


    <button
      type="submit"
      class="login-btn"
      id="loginBtn">

      🔐 Login

    </button>


  </form>


  <div
    id="message"
    class="message">
  </div>


  <div class="security">

    🔒 Secure Admin Access<br>

    କେବଳ authorized Utkala Mart
    administrator Office Panel
    ବ୍ୟବହାର କରିପାରିବେ।

  </div>


  <a
    href="index.html"
    class="back">

    ← Utkala Mart Home

  </a>


</div>



<script type="module">


/* =====================================
   FIREBASE SDK
===================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBYJ_KKsS_7SNz108jnw6hpOlmegofRhJg",

  authDomain:
    "utkalamart-1ec68.firebaseapp.com",

  projectId:
    "utkalamart-1ec68",

  storageBucket:
    "utkalamart-1ec68.firebasestorage.app",

  messagingSenderId:
    "664871353747",

  appId:
    "1:664871353747:web:96532fdafe78aabe7f3c66"

};


/* =====================================
   INITIALIZE FIREBASE
===================================== */

const app =
  initializeApp(
    firebaseConfig
  );


/* =====================================
   AUTH
===================================== */

const auth =
  getAuth(app);


/* =====================================
   ADMIN EMAIL
===================================== */

const ADMIN_EMAIL =
  "Suryakantabehera629@gmail.com";


/* =====================================
   ELEMENTS
===================================== */

const form =
  document.getElementById(
    "loginForm"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const loginBtn =
  document.getElementById(
    "loginBtn"
  );


const message =
  document.getElementById(
    "message"
  );


/* =====================================
   MESSAGE
===================================== */

function showMessage(
  text,
  type=""
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* =====================================
   EXISTING LOGIN CHECK
===================================== */

onAuthStateChanged(
  auth,
  async (user)=>{

    if(!user){

      return;
    }


    const userEmail =
      String(
        user.email || ""
      ).toLowerCase();


    /* ================================
       ADMIN CHECK
    ================================= */

    if(
      userEmail ===
      ADMIN_EMAIL.toLowerCase()
    ){

      /*
        Already logged in admin
        → Office Dashboard
      */

      window.location.href =
        "admin-dashboard.html";

      return;
    }


    /* ================================
       NON ADMIN
    ================================= */

    await signOut(
      auth
    );

  }
);


/* =====================================
   LOGIN
===================================== */

form.addEventListener(
  "submit",
  async (e)=>{

    e.preventDefault();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    const password =
      passwordInput.value;


    /* =================================
       EMAIL CHECK
    ================================= */

    if(
      email !==
      ADMIN_EMAIL.toLowerCase()
    ){

      showMessage(
        "❌ ଏହା Admin Email ନୁହେଁ।",
        "error"
      );

      return;
    }


    /* =================================
       PASSWORD CHECK
    ================================= */

    if(!password){

      showMessage(
        "❌ Password ଦିଅନ୍ତୁ।",
        "error"
      );

      return;
    }


    /* =================================
       BUTTON LOADING
    ================================= */

    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "⏳ Login...";


    showMessage(
      ""
    );


    try{


      /* ===============================
         FIREBASE LOGIN
      =============================== */

      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        result.user;


      /* ===============================
         FINAL ADMIN CHECK
      =============================== */

      const loggedEmail =
        String(
          user.email || ""
        ).toLowerCase();


      if(
        loggedEmail !==
        ADMIN_EMAIL.toLowerCase()
      ){

        await signOut(
          auth
        );


        showMessage(
          "❌ Admin access ନାହିଁ।",
          "error"
        );


        loginBtn.disabled =
          false;


        loginBtn.textContent =
          "🔐 Login";


        return;
      }


      /* ===============================
         SUCCESS
      =============================== */

      showMessage(
        "✅ Login successful... Office Dashboard ଖୋଲୁଛି।",
        "success"
      );


      /*
        IMPORTANT:
        Admin login ପରେ
        Orders page ନୁହେଁ,
        Dashboard ଖୋଲିବ।
      */

      setTimeout(
        ()=>{

          window.location.href =
            "admin-dashboard.html";

        },
        700
      );


    }


    catch(error){


      console.error(
        "Firebase Login Error:",
        error
      );


      let text =
        "❌ Login failed.";


      /* =================================
         API KEY
      ================================= */

      if(
        error.code ===
        "auth/api-key-not-valid"
      ){

        text =
          "❌ Firebase API Key valid ନୁହେଁ।";

      }


      /* =================================
         INVALID CREDENTIAL
      ================================= */

      else if(
        error.code ===
        "auth/invalid-credential"
      ){

        text =
          "❌ Email କିମ୍ବା Password ଭୁଲ।";

      }


      /* =================================
         USER NOT FOUND
      ================================= */

      else if(
        error.code ===
        "auth/user-not-found"
      ){

        text =
          "❌ ଏହି Email ରେ Firebase account ନାହିଁ।";

      }


      /* =================================
         WRONG PASSWORD
      ================================= */

      else if(
        error.code ===
        "auth/wrong-password"
      ){

        text =
          "❌ Password ଭୁଲ।";

      }


      /* =================================
         INVALID EMAIL
      ================================= */

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        text =
          "❌ Email ଠିକ୍ ନୁହେଁ।";

      }


      /* =================================
         TOO MANY REQUESTS
      ================================= */

      else if(
        error.code ===
        "auth/too-many-requests"
      ){

        text =
          "⚠️ ବହୁତଥର Login try ହୋଇଛି। କିଛି ସମୟ ପରେ ପୁଣି try କରନ୍ତୁ।";

      }


      /* =================================
         NETWORK
      ================================= */

      else if(
        error.code ===
        "auth/network-request-failed"
      ){

        text =
          "🌐 Internet connection କିମ୍ବା Firebase network problem।";

      }


      /* =================================
         LOGIN DISABLED
      ================================= */

      else if(
        error.code ===
        "auth/operation-not-allowed"
      ){

        text =
          "⚠️ Firebase Console ରେ Email/Password Login enable ହୋଇନାହିଁ।";

      }


      /* =================================
         DOMAIN
      ================================= */

      else if(
        error.code ===
        "auth/unauthorized-domain"
      ){

        text =
          "⚠️ ଏହି website domain Firebase ରେ authorized ନୁହେଁ।";

      }


      /* =================================
         SHOW ERROR
      ================================= */

      showMessage(
        text,
        "error"
      );


      loginBtn.disabled =
        false;


      loginBtn.textContent =
        "🔐 Login";

    }

  }
);

</script>


</body>

</html>
