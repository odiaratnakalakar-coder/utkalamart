<!DOCTYPE html>
<html lang="or">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#075b3b">

<title>Daily Market Price | Utkala Mart</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Odia","Noto Sans Oriya",sans-serif;
    background:#f3f7f5;
    color:#18352a;
}

header{
    background:#075b3b;
    color:white;
    padding:18px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:23px;
}

header p{
    margin:6px 0 0;
    font-size:13px;
}

.container{
    width:95%;
    max-width:1100px;
    margin:20px auto;
}

.date-box{
    background:white;
    padding:13px 16px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px #0000000d;
}

.date-box strong{
    color:#075b3b;
}

.topbar{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.search{
    flex:1;
    padding:13px;
    border:1px solid #ccd9d3;
    border-radius:10px;
    font-size:15px;
}

.refresh{
    border:0;
    background:#07834f;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
}

.status{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

.status.success{
    display:block;
    background:#e6f7ed;
    color:#08713f;
}

.status.error{
    display:block;
    background:#ffe8e8;
    color:#a00000;
}

.loading{
    background:white;
    padding:35px;
    text-align:center;
    border-radius:12px;
}

.product-list{
    display:grid;
    gap:15px;
}

.product-card{
    background:white;
    border-radius:15px;
    padding:16px;
    box-shadow:0 3px 12px #0000000d;
}

.product-top{
    display:flex;
    gap:14px;
    align-items:center;
}

.product-image{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:12px;
    background:#eee;
}

.product-name{
    font-size:18px;
    font-weight:bold;
    color:#075b3b;
}

.category{
    font-size:12px;
    color:#777;
    margin-top:4px;
}

.source{
    display:inline-block;
    font-size:10px;
    background:#eef5f1;
    color:#075b3b;
    padding:3px 7px;
    border-radius:6px;
    margin-top:5px;
}

.price-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.field label{
    display:block;
    font-size:12px;
    color:#666;
    margin-bottom:5px;
}

.field input{
    width:100%;
    padding:11px;
    border:1px solid #ccd9d3;
    border-radius:9px;
    font-size:15px;
}

.final-price{
    background:#eaf8f0;
    border:1px solid #c7ead5;
    padding:10px;
    border-radius:9px;
}

.final-price label{
    display:block;
    font-size:12px;
    color:#47715e;
}

.final-price strong{
    display:block;
    font-size:20px;
    color:#08713f;
    margin-top:3px;
}

.saving{
    margin-top:8px;
    color:#08713f;
    font-weight:bold;
    font-size:13px;
}

.old-price{
    margin-top:10px;
    font-size:12px;
    color:#777;
}

.update-btn{
    width:100%;
    margin-top:14px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#07834f;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.update-btn:disabled{
    opacity:.6;
}

@media(max-width:650px){

    .topbar{
        flex-direction:column;
    }

    .price-grid{
        grid-template-columns:1fr;
    }

    .product-image{
        width:65px;
        height:65px;
    }

    .product-name{
        font-size:16px;
    }
}

</style>
</head>


<body>

<header>

<h1>📊 Daily Market Price</h1>

<p>
ଉତ୍କଳ Mart — ପ୍ରତିଦିନ Market Price Update
</p>

</header>


<div class="container">

<div class="date-box">

📅 ଆଜିର ତାରିଖ:
<strong id="todayDate">Loading...</strong>

</div>


<div class="topbar">

<input
id="searchBox"
class="search"
placeholder="🔎 Product ଖୋଜନ୍ତୁ..."
>

<button
class="refresh"
onclick="loadProducts()"
>
🔄 Refresh
</button>

</div>


<div id="status" class="status"></div>

<div id="loading" class="loading">
⏳ Products Loading...
</div>

<div id="productList" class="product-list"></div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBYJ_KKsS_7SNz108jnw6hpOlmegofRhJg",

    authDomain:
    "utkalamart-1ec68.firebaseapp.com",

    projectId:
    "utkalamart-1ec68",

    storageBucket:
    "utkalamart-1ec68.firebasestorage.app",

    messagingSenderId:
    "664871353747",

    appId:
    "1:664871353747:web:96532fdafe78aabe7f3c66"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const ADMIN_EMAIL =
"Suryakantabehera629@gmail.com";


let allProducts=[];


/* =========================================
   DATE
========================================= */

function getToday(){

    const d=new Date();

    return String(d.getDate()).padStart(2,"0")
    +"/"+
    String(d.getMonth()+1).padStart(2,"0")
    +"/"+
    d.getFullYear();

}

document.getElementById("todayDate").innerText =
getToday();


/* =========================================
   STATUS
========================================= */

function showStatus(message,type){

    const box=document.getElementById("status");

    box.innerText=message;

    box.className="status "+type;

    setTimeout(()=>{

        box.className="status";

    },4000);

}


/* =========================================
   HELPERS
========================================= */

function nameOf(p){

    return String(
        p.name ||
        p.productName ||
        p.title ||
        "Unnamed Product"
    );

}


function categoryOf(p){

    return String(
        p.categoryName ||
        p.category ||
        "Product"
    );

}


function imageOf(p){

    return String(
        p.imageUrl ||
        p.image ||
        p.photo ||
        ""
    );

}


function numberOf(value){

    const n=Number(value);

    return Number.isFinite(n) ? n : 0;

}


/* =========================================
   LOAD PRODUCTS
========================================= */

window.loadProducts=async function(){

    const loading=
    document.getElementById("loading");

    const list=
    document.getElementById("productList");

    loading.style.display="block";

    list.innerHTML="";

    allProducts=[];


    try{

        const productsSnap=
        await getDocs(
            collection(db,"products")
        );


        productsSnap.forEach(item=>{

            allProducts.push({

                id:item.id,

                source:"products",

                ...item.data()

            });

        });


        try{

            const martSnap=
            await getDocs(
                collection(db,"martProducts")
            );


            martSnap.forEach(item=>{

                allProducts.push({

                    id:item.id,

                    source:"martProducts",

                    ...item.data()

                });

            });

        }catch(e){

            console.log(
                "martProducts unavailable"
            );

        }


        loading.style.display="none";

        renderProducts(allProducts);


    }catch(error){

        loading.style.display="none";

        showStatus(
            "❌ Products load ହେଲା ନାହିଁ: "
            +error.message,
            "error"
        );

    }

};


/* =========================================
   RENDER
========================================= */

function renderProducts(products){

    const list=
    document.getElementById("productList");


    if(!products.length){

        list.innerHTML=
        `<div class="loading">
        ❌ କୌଣସି Product ମିଳିଲା ନାହିଁ।
        </div>`;

        return;

    }


    list.innerHTML=
    products.map((p,index)=>{

        const market=
        numberOf(p.marketPrice);

        const discount=
        numberOf(
            p.discount ??
            p.utkalaDiscount
        );


        const currentPrice=
        numberOf(
            p.utkalaPrice ??
            p.sellingPrice ??
            p.price
        );


        const finalPrice=
        market>0
        ? Math.max(0,market-discount)
        : currentPrice;


        const saving=
        market>finalPrice
        ? market-finalPrice
        : 0;


        return `

        <div class="product-card">

            <div class="product-top">

                ${
                    imageOf(p)
                    ?
                    `<img
                    class="product-image"
                    src="${imageOf(p)}"
                    alt="${nameOf(p)}"
                    >`
                    :
                    `<div
                    class="product-image"
                    style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:28px;
                    ">
                    🛍️
                    </div>`
                }

                <div>

                    <div class="product-name">
                    ${nameOf(p)}
                    </div>

                    <div class="category">
                    ${categoryOf(p)}
                    </div>

                    <div class="source">
                    ${p.source}
                    </div>

                </div>

            </div>


            <div class="price-grid">


                <div class="field">

                    <label>
                    🏪 Today's Market Price
                    </label>

                    <input
                    type="number"
                    min="0"
                    step="0.01"
                    id="market-${index}"
                    value="${market || ""}"
                    placeholder="ଯଥା ₹60"
                    oninput="calculatePrice(${index})"
                    >

                </div>


                <div class="field">

                    <label>
                    🎁 Customer Discount
                    </label>

                    <input
                    type="number"
                    min="0"
                    step="0.01"
                    id="discount-${index}"
                    value="${discount || ""}"
                    placeholder="ଯଥା ₹5"
                    oninput="calculatePrice(${index})"
                    >

                </div>


                <div
                class="final-price">

                    <label>
                    🛒 Utkala Mart Price
                    </label>

                    <strong id="final-${index}">
                    ₹${finalPrice.toFixed(2)}
                    </strong>

                </div>


            </div>


            <div
            class="saving"
            id="saving-${index}">

            ${
                saving>0
                ?
                `🎉 Customer Saving: ₹${saving.toFixed(2)}`
                :
                ""
            }

            </div>


            <div class="old-price">

            ପୁରୁଣା Utkala Price:
            ₹${currentPrice.toFixed(2)}

            </div>


            <button
            class="update-btn"
            id="update-${index}"
            onclick="updatePrice(${index})">

            💾 Today's Price Save

            </button>


        </div>

        `;

    }).join("");

}


/* =========================================
   CALCULATE
========================================= */

window.calculatePrice=function(index){

    const market=
    numberOf(
        document.getElementById(
            `market-${index}`
        ).value
    );


    const discount=
    numberOf(
        document.getElementById(
            `discount-${index}`
        ).value
    );


    const finalPrice=
    Math.max(
        0,
        market-discount
    );


    const saving=
    Math.max(
        0,
        market-finalPrice
    );


    document.getElementById(
        `final-${index}`
    ).innerText=
    "₹"+finalPrice.toFixed(2);


    document.getElementById(
        `saving-${index}`
    ).innerText=
    saving>0
    ?
    `🎉 Customer Saving: ₹${saving.toFixed(2)}`
    :
    "";

};


/* =========================================
   SAVE PRICE
========================================= */

window.updatePrice=async function(index){

    const product=
    allProducts[index];


    if(!product) return;


    const market=
    numberOf(
        document.getElementById(
            `market-${index}`
        ).value
    );


    const discount=
    numberOf(
        document.getElementById(
            `discount-${index}`
        ).value
    );


    if(market<=0){

        showStatus(
            "⚠️ Today's Market Price ଦିଅନ୍ତୁ।",
            "error"
        );

        return;

    }


    if(discount<0){

        showStatus(
            "⚠️ Discount ଠିକ୍ ଭାବରେ ଦିଅନ୍ତୁ।",
            "error"
        );

        return;

    }


    if(discount>=market){

        showStatus(
            "⚠️ Discount Market Price ଠାରୁ କମ୍ ହେବା ଦରକାର।",
            "error"
        );

        return;

    }


    const finalPrice=
    market-discount;


    const button=
    document.getElementById(
        `update-${index}`
    );


    button.disabled=true;

    button.innerText=
    "⏳ Saving...";


    try{

        /* PRODUCT UPDATE */

        await updateDoc(

            doc(
                db,
                product.source,
                product.id
            ),

            {

                marketPrice:
                market,

                marketPriceDate:
                getToday(),

                marketPriceUpdatedAt:
                serverTimestamp(),

                discount:
                discount,

                utkalaDiscount:
                discount,

                utkalaPrice:
                finalPrice,

                sellingPrice:
                finalPrice,

                price:
                finalPrice,

                lastPriceUpdate:
                getToday()

            }

        );


        /* HISTORY */

        const historyId=
        product.id+
        "_"+
        Date.now();


        await setDoc(

            doc(
                db,
                "marketPriceHistory",
                historyId
            ),

            {

                productId:
                product.id,

                productName:
                nameOf(product),

                source:
                product.source,

                marketPrice:
                market,

                discount:
                discount,

                utkalaPrice:
                finalPrice,

                customerSaving:
                discount,

                date:
                getToday(),

                createdAt:
                serverTimestamp()

            }

        );


        /* LOCAL UPDATE */

        product.marketPrice=
        market;

        product.discount=
        discount;

        product.utkalaDiscount=
        discount;

        product.utkalaPrice=
        finalPrice;

        product.sellingPrice=
        finalPrice;

        product.price=
        finalPrice;


        showStatus(

            `✅ ${nameOf(product)} update ହେଲା — Market ₹${market} → Utkala Mart ₹${finalPrice} | Saving ₹${discount}`,

            "success"

        );


        button.innerText=
        "✅ Updated";


        setTimeout(()=>{

            button.disabled=false;

            button.innerText=
            "💾 Today's Price Save";

        },1800);


    }catch(error){

        console.error(error);

        showStatus(
            "❌ Price save ହେଲା ନାହିଁ: "
            +error.message,
            "error"
        );


        button.disabled=false;

        button.innerText=
        "💾 Today's Price Save";

    }

};


/* =========================================
   SEARCH
========================================= */

document.getElementById(
    "searchBox"
)
.addEventListener(
    "input",
    function(){

        const value=
        this.value
        .trim()
        .toLowerCase();


        if(!value){

            renderProducts(
                allProducts
            );

            return;

        }


        const filtered=
        allProducts.filter(p=>

            (
                nameOf(p)
                +" "+
                categoryOf(p)
            )
            .toLowerCase()
            .includes(value)

        );


        renderProducts(filtered);

    }
);


/* =========================================
   ADMIN AUTH
========================================= */

onAuthStateChanged(
    auth,
    user=>{

        if(!user){

            window.location.href=
            "admin-login.html";

            return;

        }


        if(
            user.email.toLowerCase()
            !==
            ADMIN_EMAIL.toLowerCase()
        ){

            alert(
                "❌ Admin Access ନାହିଁ।"
            );

            window.location.href=
            "admin-login.html";

            return;

        }


        loadProducts();

    }
);

</script>

</body>
</html>
