body{

}

.saving-box label{

    color:#80652d;
}

.saving-box strong{
    display:block;
    font-size:20px;

    margin-top:3px;
}

.old-price{

.update-btn{

    margin-top:14px;

ଉତ୍କଳ Mart — ପ୍ରତିଦିନ Market Price Update

</header>


<div class="container">


<div class="date-box">

<script type="module">


/* =====================================================

from

    collection,
    getDocs,
    doc,
    updateDoc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig={

    apiKey:
    "AIzaSyBYJ_KKsS_7SNz108jnw6hpOlmegofRhJg",

    authDomain:
    "utkalamart-1ec68.firebaseapp.com",

    projectId:
    "utkalamart-1ec68",

    storageBucket:
    "utkalamart-1ec68.firebasestorage.app",

    messagingSenderId:
    "664871353747",

    appId:
    "1:664871353747:web:96532fdafe78aabe7f3c66"

};


const app=
initializeApp(
    firebaseConfig

const auth=
getAuth(app);

const db=
getFirestore(app);


const ADMIN_EMAIL=
"Suryakantabehera629@gmail.com";


let allProducts=[];


/* =====================================================
   DATE
===================================================== */

function getToday(){

    const d=new Date();

    return String(
        d.getDate()
    ).padStart(2,"0")
    +"/"+
    String(
        d.getMonth()+1
    ).padStart(2,"0")
    +"/"+
    d.getFullYear();

}


document.getElementById(
    "todayDate"
).innerText=
getToday();


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type
){

    const box=
    document.getElementById(
        "status"
    );

    box.innerText=
    message;

    box.className=
    "status "+type;

    setTimeout(()=>{

        box.className=
        "status";

    },5000);

}


/* =====================================================
   HELPERS
===================================================== */

function productName(p){

    return String(
        p.name ||
        p.productName ||
        p.title ||
        "Unnamed Product"
    );

}


function categoryName(p){

    return String(
        p.categoryName ||
        p.category ||
        "Product"
    );

}


function productImage(p){

    return String(
        p.imageUrl ||
        p.image ||
        p.photo ||
        ""
    );

}


function num(value){

    const n=
    Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


/* =====================================================
   PRICE CALCULATION
   Market Price ଠାରୁ percentage କମ୍
===================================================== */

function calculateUtkalaPrice(
    market,
    percentage
){

    market=
    num(market);

    percentage=
    num(percentage);


    if(
        market<=0
    ){

        return 0;

    }


    if(
        percentage<0
    ){

        percentage=0;

    }


    if(
        percentage>100
    ){

        percentage=100;

    }


    const discount=
        market *
        percentage /
        100;


    const finalPrice=
        market -
        discount;


    return Math.round(
        Math.max(
            0,
            finalPrice
        ) * 100
    ) / 100;

}


/* =====================================================
   RENDER
===================================================== */

function renderProducts(
    products
){

    const list=
    document.getElementById(
        "productList"
    );


    if(!products.length){

        list.innerHTML=`

        <div class="loading">

        ❌ କୌଣସି Product ମିଳିଲା ନାହିଁ।

        </div>

        `;

        return;

    }


    list.innerHTML=

    products.map(
        (p,index)=>{


        const market=
        num(
            p.marketPrice
        );


        /*
         * ପୂର୍ବରୁ save ହୋଇଥିବା
         * percentage
         */

        const percentage=
        p.priceAdjustmentType==="percent"
        ?
        num(
            p.priceAdjustmentValue
        )
        :
        10;


        const oldPrice=
        num(
            p.utkalaPrice ??
            p.sellingPrice ??
            p.price
        );


        const finalPrice=
        market>0
        ?
        calculateUtkalaPrice(
            market,
            percentage
        )
        :
        oldPrice;


        const saving=
        market>0
        ?
        Math.max(
            0,
            market-finalPrice
        )
        :
        0;


        return `

        <div
        class="product-card"
        data-index="${index}"
        >


        <!-- PRODUCT TOP -->

        <div class="product-top">


            ${
                productImage(p)

                ?

                `<img
                class="product-image"
                src="${productImage(p)}"
                alt="${productName(p)}"
                onerror="
                this.style.display='none'
                "
                >`

                :

                `<div
                class="product-image"
                style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:28px;
                "
                >
                🛍️
                </div>`
            }


            <div>

                <div class="product-name">

                ${productName(p)}

                </div>


                <div class="category">

                ${categoryName(p)}

                </div>


                <div class="source">

                ${p.source}

                </div>


                ${
                    p.marketPriceDate
                    ?
                    `
                    <div class="today-badge">

                    📅 Last Market Update:
                    ${p.marketPriceDate}

                    </div>
                    `
                    :
                    ""
                }

            </div>


        </div>


        <!-- MARKET PRICE + PERCENTAGE -->

        <div class="price-grid">


            <div class="field">

                <label>
                🏪 Today's Market Price
                </label>


                <input
                type="number"
                min="0"
                step="0.01"
                id="market-${index}"
                value="${market || ""}"
                placeholder="ଯଥା ₹100"
                oninput="
                calculatePrice(${index})
                "
                >

            </div>


            <div class="field">

                <label>
                📉 Utkala Mart Discount %
                </label>


                <select
                id="percentage-${index}"
                onchange="
                calculatePrice(${index})
                "
                >

                    <option
                    value="5"
                    ${
                        percentage===5
                        ?
                        "selected"
                        :
                        ""
                    }
                    >
                    5% କମ୍
                    </option>


                    <option
                    value="10"
                    ${
                        percentage===10
                        ?
                        "selected"
                        :
                        ""
                    }
                    >
                    10% କମ୍
                    </option>


                    <option
                    value="15"
                    ${
                        percentage===15
                        ?
                        "selected"
                        :
                        ""
                    }
                    >
                    15% କମ୍
                    </option>


                    <option
                    value="20"
                    ${
                        percentage===20
                        ?
                        "selected"
                        :
                        ""
                    }
                    >
                    20% କମ୍
                    </option>


                    <option
                    value="25"
                    ${
                        percentage===25
                        ?
                        "selected"
                        :
                        ""
                    }
                    >
                    25% କମ୍
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                ✏️ Custom %
                </label>


                <input
                type="number"
                min="0"
                max="100"
                step="0.01"
                id="custom-${index}"
                placeholder="ଯଥା 8"
                oninput="
                calculatePrice(${index})
                "
                >

            </div>


        </div>


        <!-- RESULT -->

        <div class="price-grid">


            <div
            class="final-price"
            >

                <label>
                🛒 Utkala Mart Price
                </label>


                <strong
                id="final-${index}"
                >

                ₹${finalPrice.toFixed(2)}

                </strong>

            </div>


            <div
            class="saving-box"
            >

                <label>
                🎉 Customer Saving
                </label>


                <strong
                id="saving-${index}"
                >

                ₹${saving.toFixed(2)}

                </strong>

            </div>


            <div
            class="final-price"
            >

                <label>
                📊 Applied Discount
                </label>


                <strong
                id="percent-show-${index}"
                >

                ${percentage}%

                </strong>

            </div>


        </div>


        <!-- RULE -->

        <div
        class="rule-box"
        id="rule-${index}"
        >

        📌 Market Price ଠାରୁ
        ${percentage}% କମ୍

        </div>


        <!-- OLD PRICE -->

        <div class="old-price">

        ପୁରୁଣା Utkala Price:
        ₹${oldPrice.toFixed(2)}

        </div>


        <!-- SAVE -->

        <button
        class="update-btn"
        id="update-${index}"
        onclick="
        updatePrice(${index})
        "
        >

        💾 Today's Price Save

        </button>


        </div>

        `;

        }

    ).join("");

}


/* =====================================================
   LIVE CALCULATION
===================================================== */

window.calculatePrice=
function(index){

    const market=
    num(
        document.getElementById(
            `market-${index}`
        ).value
    );


    const selectPercentage=
    num(
        document.getElementById(
            `percentage-${index}`
        ).value
    );


    const customInput=
    document.getElementById(
        `custom-${index}`
    );


    const customValue=
    num(
        customInput.value
    );


    /*
     * Custom % ଦିଆଗଲେ
     * Custom percentage ବ୍ୟବହାର ହେବ।
     *
     * ନହେଲେ dropdown %
     */

    let percentage=
    selectPercentage;


    if(
        customInput.value.trim()!==""
    ){

        percentage=
        customValue;

    }


    percentage=
    Math.max(
        0,
        Math.min(
            100,
            percentage
        )
    );


    const finalPrice=
    calculateUtkalaPrice(
        market,
        percentage
    );


    const saving=
    Math.max(
        0,
        market-finalPrice
    );


    document.getElementById(
        `final-${index}`
    ).innerText=
    "₹"+
    finalPrice.toFixed(2);


    document.getElementById(
        `saving-${index}`
    ).innerText=
    "₹"+
    saving.toFixed(2);


    document.getElementById(
        `percent-show-${index}`
    ).innerText=
    percentage+"%";


    document.getElementById(
        `rule-${index}`
    ).innerText=

    market>0

    ?

    "📌 Market Price ଠାରୁ "+
    percentage+
    "% କମ୍ → Utkala Mart ₹"+
    finalPrice.toFixed(2)

    :

    "📌 Market Price ଦିଅନ୍ତୁ";

};


/* =====================================================
   UPDATE PRICE
===================================================== */

window.updatePrice=
async function(index){

    const product=
    allProducts[index];


    if(!product){

        return;

    }


    const button=
    document.getElementById(
        `update-${index}`
    );


    const market=
    num(
        document.getElementById(
            `market-${index}`
        ).value
    );


    const selectPercentage=
    num(
        document.getElementById(
            `percentage-${index}`
        ).value
    );


    const customInput=
    document.getElementById(
        `custom-${index}`
    );


    const customValue=
    num(
        customInput.value
    );


    let percentage=
    selectPercentage;


    if(
        customInput.value.trim()!==""
    ){

        percentage=
        customValue;

    }


    percentage=
    Math.max(
        0,
        Math.min(
            100,
            percentage
        )
    );


    if(market<=0){

        showStatus(
            "⚠️ Today's Market Price ଦିଅନ୍ତୁ।",
            "error"
        );

        return;

    }


    if(percentage<0){

        showStatus(
            "⚠️ Percentage ଠିକ୍ ଭାବରେ ଦିଅନ୍ତୁ।",
            "error"
        );

        return;

    }


    const finalPrice=
    calculateUtkalaPrice(
        market,
        percentage
    );


    const saving=
    Math.max(
        0,
        market-finalPrice
    );


    button.disabled=true;

    button.innerText=
    "⏳ Saving...";


    try{


        /* =============================================
           PRODUCT UPDATE
        ============================================= */

        await updateDoc(

            doc(
                db,
                product.source,
                product.id
            ),

            {

                /*
                 * Today's Market Price
                 */

                marketPrice:
                market,

                marketPriceDate:
                getToday(),

                marketPriceUpdatedAt:
                serverTimestamp(),


                /*
                 * Daily Percentage Rule
                 */

                priceAdjustmentType:
                "percent",

                priceAdjustmentValue:
                percentage,

                priceDirection:
                "decrease",


                /*
                 * Final Utkala Mart Price
                 */

                utkalaPrice:
                finalPrice,

                sellingPrice:
                finalPrice,

                price:
                finalPrice,


                /*
                 * Saving
                 */

                customerSaving:
                saving,


                /*
                 * Last update
                 */

                lastPriceUpdate:
                getToday(),

                priceUpdatedAt:
                serverTimestamp()

            }

        );


        /* =============================================
           PRICE HISTORY
        ============================================= */

        const historyId=
        product.id+
        "_"+
        Date.now();


        await setDoc(

            doc(
                db,
                "marketPriceHistory",
                historyId
            ),

            {

                productId:
                product.id,

                productName:
                productName(product),

                source:
                product.source,


                marketPrice:
                market,


                priceAdjustmentType:
                "percent",

                priceAdjustmentValue:
                percentage,

                priceDirection:
                "decrease",


                utkalaPrice:
                finalPrice,

                customerDifference:
                saving,

                customerSaving:
                saving,


                date:
                getToday(),

                createdAt:
                serverTimestamp()

            }

        );


        /* =============================================
           LOCAL UPDATE
        ============================================= */

        product.marketPrice=
        market;

        product.marketPriceDate=
        getToday();

        product.priceAdjustmentType=
        "percent";

        product.priceAdjustmentValue=
        percentage;

        product.priceDirection=
        "decrease";

        product.utkalaPrice=
        finalPrice;

        product.sellingPrice=
        finalPrice;

        product.price=
        finalPrice;

        product.customerSaving=
        saving;


        showStatus(

            `✅ ${productName(product)} update ହେଲା — Market ₹${market} → Utkala Mart ₹${finalPrice} — Saving ₹${saving}`,

            "success"

        );


        button.innerText=
        "✅ Updated";


        setTimeout(()=>{

            button.disabled=false;

            button.innerText=
            "💾 Today's Price Save";

        },1800);


    }
    catch(error){

        console.error(
            error
        );


        showStatus(

            "❌ Price save ହେଲା ନାହିଁ: "+
            error.message,

            "error"

        );


        button.disabled=false;

        button.innerText=
        "💾 Today's Price Save";

    }

};


/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "searchBox"
)
.addEventListener(
    "input",
    function(){

        const value=
        this.value
        .trim()
        .toLowerCase();


        if(!value){

            renderProducts(
                allProducts
            );

            return;

        }


        const filtered=
        allProducts.filter(
            p=>{

                const text=
                (
                    productName(p)
                    +" "+
                    categoryName(p)
                ).toLowerCase();


                return text.includes(
                    value
                );

            }
        );


        renderProducts(
            filtered
        );

    }
);


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    user=>{

        if(!user){

            window.location.href=
            "admin-login.html";

            return;

        }


        if(
            user.email.toLowerCase()
            !==
            ADMIN_EMAIL.toLowerCase()
        ){

            alert(
                "❌ Admin Access ନାହିଁ।"
            );

            window.location.href=
            "admin-login.html";

            return;

        }


        loadProducts();

    }
);


/* =====================================================
   LOAD PRODUCTS
===================================================== */

window.loadProducts=
async function(){

    const loading=
    document.getElementById(
        "loading"
    );

    const list=
    document.getElementById(
        "productList"
    );


    loading.style.display=
    "block";


    list.innerHTML="";

    allProducts=[];


    try{


        /* =============================================
           PRODUCTS
        ============================================= */

        const productsSnap=
        await getDocs(
            collection(
                db,
                "products"
            )
        );


        productsSnap.forEach(
            item=>{

                allProducts.push({

                    id:
                    item.id,

                    source:
                    "products",

                    ...item.data()

                });

            }
        );


        /* =============================================
           MART PRODUCTS
        ============================================= */

        try{

            const martSnap=
            await getDocs(
                collection(
                    db,
                    "martProducts"
                )
            );


            martSnap.forEach(
                item=>{

                    allProducts.push({

                        id:
                        item.id,

                        source:
                        "martProducts",

                        ...item.data()

                    });

                }
            );

        }
        catch(e){

            console.log(
                "martProducts unavailable",
                e
            );

        }


        loading.style.display=
        "none";


        renderProducts(
            allProducts
        );


    }
    catch(error){

        loading.style.display=
        "none";


        showStatus(

            "❌ Products load ହେଲା ନାହିଁ: "+
            error.message,

            "error"

        );

    }

};


</script>
