<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>UtkalaMart Admin</title>

<style>

/* ==============================
   RESET
============================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* ==============================
   BODY
============================== */

body{
    font-family:
        Arial,
        "Noto Sans Oriya",
        sans-serif;

    background:#101010;
    color:#fff;
    min-height:100vh;
}


/* ==============================
   HEADER
============================== */

.header{

    background:
        linear-gradient(
            135deg,
            #063b16,
            #087f3f
        );

    padding:22px 15px;

    text-align:center;

    box-shadow:
        0 4px 20px rgba(0,0,0,.35);
}

.header h1{

    font-size:30px;
    font-weight:bold;
}

.header h1 span{

    color:#ff8a00;
}

.header p{

    margin-top:7px;

    color:#caffdc;

    font-size:15px;
}


/* ==============================
   MAIN CONTAINER
============================== */

.container{

    width:100%;
    max-width:1100px;

    margin:auto;

    padding:20px 15px 50px;
}


/* ==============================
   LOGIN BOX
============================== */

.login-box{

    max-width:450px;

    margin:55px auto;

    background:#202020;

    padding:28px 22px;

    border-radius:20px;

    box-shadow:
        0 8px 35px rgba(0,0,0,.5);
}

.login-box h2{

    text-align:center;

    color:#8fffc0;

    margin-bottom:25px;

    font-size:25px;
}


/* ==============================
   LABEL
============================== */

label{

    display:block;

    margin-top:17px;

    margin-bottom:8px;

    font-size:16px;

    font-weight:bold;

    color:#e6e6e6;
}


/* ==============================
   INPUT
============================== */

input{

    width:100%;

    padding:14px;

    background:#303030;

    color:#fff;

    border:1px solid #555;

    border-radius:10px;

    font-size:16px;

    outline:none;
}

input:focus{

    border-color:#00b85a;

    box-shadow:
        0 0 0 2px rgba(0,184,90,.15);
}


/* ==============================
   BUTTON
============================== */

button{

    border:none;

    cursor:pointer;

    border-radius:10px;

    font-weight:bold;

    transition:.2s;
}

button:active{

    transform:scale(.97);
}

button:disabled{

    opacity:.6;

    cursor:not-allowed;
}


/* ==============================
   LOGIN BUTTON
============================== */

.login-btn{

    width:100%;

    margin-top:23px;

    padding:15px;

    background:#00a94f;

    color:#fff;

    font-size:17px;
}

.login-btn:hover{

    background:#00c45c;
}


/* ==============================
   MESSAGE
============================== */

.message{

    display:none;

    margin-top:15px;

    padding:13px;

    border-radius:10px;

    text-align:center;

    font-weight:bold;

    line-height:1.5;
}

.message.error{

    background:#481010;

    color:#ffb3b3;
}

.message.success{

    background:#063d20;

    color:#8fffc0;
}

.message.info{

    background:#102d48;

    color:#a9d9ff;
}


/* ==============================
   DASHBOARD
============================== */

#dashboard{

    display:none;
}


/* ==============================
   TOP BAR
============================== */

.topbar{

    background:#202020;

    padding:18px;

    border-radius:16px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

    margin-bottom:20px;
}

.topbar h2{

    color:#8fffc0;

    font-size:22px;
}

.admin-email{

    color:#aaa;

    margin-top:5px;

    font-size:14px;

    word-break:break-all;
}


/* ==============================
   LOGOUT
============================== */

.logout-btn{

    background:#d62828;

    color:#fff;

    padding:11px 18px;

    font-size:15px;
}

.logout-btn:hover{

    background:#ef3434;
}


/* ==============================
   STATS
============================== */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:25px;
}

.stat{

    background:#202020;

    padding:20px;

    border-radius:16px;

    text-align:center;
}

.stat-title{

    color:#aaa;

    font-size:14px;
}

.stat-number{

    display:block;

    margin-top:8px;

    font-size:32px;

    color:#ff9d25;

    font-weight:bold;
}


/* ==============================
   SECTION
============================== */

.section-title{

    color:#8fffc0;

    margin:25px 0 15px;

    font-size:23px;
}


/* ==============================
   PRODUCT CARD
============================== */

.product-card{

    background:#202020;

    border-radius:18px;

    padding:18px;

    margin-bottom:20px;

    display:grid;

    grid-template-columns:
        190px 1fr;

    gap:20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);
}


/* ==============================
   PRODUCT IMAGE
============================== */

.product-image{

    width:190px;

    height:190px;

    border-radius:15px;

    object-fit:cover;

    background:#333;

    border:1px solid #444;
}


/* ==============================
   PRODUCT NAME
============================== */

.product-name{

    color:#ff9d25;

    font-size:23px;

    margin-bottom:7px;

    word-break:break-word;
}


/* ==============================
   STATUS
============================== */

.status{

    display:inline-block;

    padding:5px 12px;

    border-radius:20px;

    background:#5b4200;

    color:#ffe08a;

    font-size:13px;

    margin:5px 0 12px;
}


/* ==============================
   DETAILS
============================== */

.details{

    color:#ddd;

    line-height:1.8;

    font-size:15px;

    word-break:break-word;
}

.details b{

    color:#fff;
}


/* ==============================
   ACTIONS
============================== */

.actions{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:16px;
}

.approve-btn{

    background:#00a94f;

    color:#fff;

    padding:12px 18px;

    font-size:15px;
}

.approve-btn:hover{

    background:#00c45c;
}

.reject-btn{

    background:#d62828;

    color:#fff;

    padding:12px 18px;

    font-size:15px;
}

.reject-btn:hover{

    background:#ef3434;
}


/* ==============================
   EMPTY
============================== */

.empty{

    background:#202020;

    padding:35px 20px;

    border-radius:16px;

    text-align:center;

    color:#aaa;

    line-height:1.7;
}


/* ==============================
   LOADING
============================== */

.loading{

    text-align:center;

    padding:30px;

    color:#8fffc0;

    font-size:16px;
}


/* ==============================
   REFRESH
============================== */

.refresh-box{

    display:flex;

    justify-content:flex-end;

    margin-bottom:15px;
}

.refresh-btn{

    background:#063b78;

    color:#fff;

    padding:10px 17px;
}

.refresh-btn:hover{

    background:#084c99;
}


/* ==============================
   RESPONSIVE
============================== */

@media(max-width:700px){

    .header h1{

        font-size:26px;
    }

    .header p{

        font-size:14px;
    }

    .container{

        padding:
            15px
            12px
            40px;
    }

    .stats{

        grid-template-columns:1fr;
    }

    .product-card{

        grid-template-columns:1fr;

        padding:15px;
    }

    .product-image{

        width:100%;

        height:250px;
    }

    .product-name{

        font-size:21px;
    }

    .topbar{

        align-items:flex-start;
    }

    .logout-btn{

        width:100%;
    }

    .actions button{

        width:100%;
    }

}


/* ==============================
   VERY SMALL MOBILE
============================== */

@media(max-width:400px){

    .login-box{

        margin:
            30px auto;

        padding:
            22px 16px;
    }

    .stat-number{

        font-size:28px;
    }

}

</style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

    <h1>
        🛒 Utkala<span>Mart</span>
    </h1>

    <p>
        🔐 Admin Dashboard
    </p>

</header>



<!-- ==========================================
     LOGIN
========================================== -->

<section
    id="loginSection"
    class="login-box"
>

    <h2>
        🔐 Admin Login
    </h2>


    <label>
        📧 Admin Email
    </label>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="email"
    >


    <label>
        🔑 Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button
        id="loginBtn"
        class="login-btn"
    >
        🔐 Login
    </button>


    <div
        id="loginMessage"
        class="message"
    ></div>

</section>



<!-- ==========================================
     DASHBOARD
========================================== -->

<section id="dashboard">

<div class="container">


    <!-- TOP BAR -->

    <div class="topbar">

        <div>

            <h2>
                🏪 UtkalaMart Admin
            </h2>

            <div
                id="adminEmail"
                class="admin-email"
            ></div>

        </div>


        <button
            id="logoutBtn"
            class="logout-btn"
        >
            🚪 Logout
        </button>

    </div>



    <!-- ======================================
         STATISTICS
    ======================================= -->

    <div class="stats">


        <div class="stat">

            <div class="stat-title">
                ⏳ Pending Products
            </div>

            <span
                id="pendingCount"
                class="stat-number"
            >
                0
            </span>

        </div>


        <div class="stat">

            <div class="stat-title">
                ✅ Approved Products
            </div>

            <span
                id="approvedCount"
                class="stat-number"
            >
                0
            </span>

        </div>


        <div class="stat">

            <div class="stat-title">
                📦 Total Products
            </div>

            <span
                id="totalCount"
                class="stat-number"
            >
                0
            </span>

        </div>


    </div>



    <!-- ======================================
         REFRESH
    ======================================= -->

    <div class="refresh-box">

        <button
            id="refreshBtn"
            class="refresh-btn"
        >
            🔄 Refresh
        </button>

    </div>



    <!-- ======================================
         PENDING
    ======================================= -->

    <h2 class="section-title">

        ⏳ Pending Products

    </h2>


    <div id="productsList">

        <div class="loading">

            ⏳ Products loading...

        </div>

    </div>


</div>

</section>



<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
    db,
    auth
}
from "./firebase.js";


import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* ==========================================
   ELEMENTS
========================================== */

const loginSection =
    document.getElementById(
        "loginSection"
    );


const dashboard =
    document.getElementById(
        "dashboard"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const logoutBtn =
    document.getElementById(
        "logoutBtn"
    );


const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


const loginMessage =
    document.getElementById(
        "loginMessage"
    );


const adminEmail =
    document.getElementById(
        "adminEmail"
    );


const productsList =
    document.getElementById(
        "productsList"
    );


const pendingCount =
    document.getElementById(
        "pendingCount"
    );


const approvedCount =
    document.getElementById(
        "approvedCount"
    );


const totalCount =
    document.getElementById(
        "totalCount"
    );



/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    element,
    text,
    type
){

    element.innerText =
        text;

    element.className =
        "message " + type;

    element.style.display =
        "block";
}



/* ==========================================
   LOGIN
========================================== */

loginBtn.addEventListener(
    "click",
    loginAdmin
);


async function loginAdmin(){

    const email =
        emailInput.value.trim();


    const password =
        passwordInput.value;


    if(!email){

        showMessage(
            loginMessage,
            "❌ Admin Email ଦିଅନ୍ତୁ।",
            "error"
        );

        return;
    }


    if(!password){

        showMessage(
            loginMessage,
            "❌ Password ଦିଅନ୍ତୁ।",
            "error"
        );

        return;
    }


    try{

        loginBtn.disabled =
            true;


        loginBtn.innerText =
            "⏳ Login ହେଉଛି...";


        loginMessage.style.display =
            "none";


        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        let msg =
            "❌ Login ବିଫଳ ହେଲା।";


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            msg =
                "❌ Email କିମ୍ବା Password ଭୁଲ ଅଛି।";
        }


        if(
            error.code ===
            "auth/user-not-found"
        ){

            msg =
                "❌ ଏହି Email ରେ Admin User ନାହିଁ।";
        }


        if(
            error.code ===
            "auth/wrong-password"
        ){

            msg =
                "❌ Password ଭୁଲ ଅଛି।";
        }


        showMessage(
            loginMessage,
            msg,
            "error"
        );


        loginBtn.disabled =
            false;


        loginBtn.innerText =
            "🔐 Login";

    }

}



/* ==========================================
   ENTER KEY
========================================== */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            loginAdmin();

        }

    }
);



/* ==========================================
   AUTH STATE
========================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(user){

            loginSection.style.display =
                "none";


            dashboard.style.display =
                "block";


            adminEmail.innerText =
                "Admin: " +
                (user.email || "Logged in");


            await loadProducts();

        }

        else{

            loginSection.style.display =
                "block";


            dashboard.style.display =
                "none";


            loginBtn.disabled =
                false;


            loginBtn.innerText =
                "🔐 Login";

        }

    }
);



/* ==========================================
   LOGOUT
========================================== */

logoutBtn.addEventListener(
    "click",
    async function(){

        try{

            await signOut(auth);

        }

        catch(error){

            console.error(
                "LOGOUT ERROR:",
                error
            );

        }

    }
);



/* ==========================================
   REFRESH
========================================== */

refreshBtn.addEventListener(
    "click",
    async function(){

        await loadProducts();

    }
);



/* ==========================================
   LOAD PRODUCTS
========================================== */

async function loadProducts(){

    productsList.innerHTML =

        `
        <div class="loading">
            ⏳ Products loading...
        </div>
        `;


    try{

        const productsRef =
            collection(
                db,
                "products"
            );


        /* =========================
           GET ALL PRODUCTS
        ========================== */

        const allSnapshot =
            await getDocs(
                productsRef
            );


        let pending = [];

        let approved = 0;


        allSnapshot.forEach(
            function(item){

                const data =
                    item.data();


                const product = {

                    id:item.id,

                    ...data

                };


                if(
                    data.status ===
                    "pending"
                ){

                    pending.push(
                        product
                    );

                }


                if(
                    data.status ===
                    "approved"
                ){

                    approved++;

                }

            }
        );


        /* =========================
           COUNTS
        ========================== */

        pendingCount.innerText =
            pending.length;


        approvedCount.innerText =
            approved;


        totalCount.innerText =
            allSnapshot.size;



        /* =========================
           NO PENDING
        ========================== */

        if(
            pending.length === 0
        ){

            productsList.innerHTML =

                `
                <div class="empty">

                    🎉 ବର୍ତ୍ତମାନ
                    କୌଣସି Pending Product ନାହିଁ।

                    <br><br>

                    ନୂଆ Seller Product Upload
                    କଲେ ଏଠାରେ ଦେଖାଯିବ।

                </div>
                `;

            return;

        }



        /* =========================
           SORT NEWEST FIRST
           WITHOUT FIRESTORE INDEX
        ========================== */

        pending.sort(
            function(a,b){

                const aTime =
                    getTime(
                        a.createdAt
                    );


                const bTime =
                    getTime(
                        b.createdAt
                    );


                return bTime - aTime;

            }
        );



        productsList.innerHTML =
            "";



        /* =========================
           DISPLAY
        ========================== */

        pending.forEach(
            function(data){

                createProductCard(
                    data
                );

            }
        );

    }

    catch(error){

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );


        productsList.innerHTML =

            `
            <div class="empty">

                ❌ Products load ହୋଇପାରିଲା ନାହିଁ।

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Unknown error"
                )}

            </div>
            `;

    }

}



/* ==========================================
   PRODUCT CARD
========================================== */

function createProductCard(
    data
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "product-card";


    const image =
        document.createElement(
            "img"
        );


    image.className =
        "product-image";


    image.alt =
        data.name ||
        "Product";


    image.src =
        data.image ||
        "";


    image.onerror =
        function(){

            this.style.display =
                "none";

        };



    const content =
        document.createElement(
            "div"
        );


    const name =
        escapeHTML(
            data.name ||
            "Product"
        );


    const category =
        escapeHTML(
            data.category ||
            "—"
        );


    const village =
        escapeHTML(
            data.village ||
            "—"
        );


    const sellerName =
        escapeHTML(
            data.sellerName ||
            "—"
        );


    const sellerMobile =
        escapeHTML(
            data.sellerMobile ||
            "—"
        );


    const description =
        escapeHTML(
            data.description ||
            "—"
        );


    const price =
        Number(
            data.price || 0
        );


    const stock =
        Number(
            data.stock || 0
        );


    content.innerHTML =

        `
        <h3 class="product-name">
            ${name}
        </h3>


        <div class="status">
            ⏳ Pending
        </div>


        <div class="details">

            💰 <b>ଦାମ:</b>
            ₹${price}

            <br>

            📦 <b>Stock:</b>
            ${stock}

            <br>

            📂 <b>ବର୍ଗ:</b>
            ${category}

            <br>

            📍 <b>ଅଞ୍ଚଳ:</b>
            ${village}

            <br>

            👤 <b>ବିକ୍ରେତା:</b>
            ${sellerName}

            <br>

            📞 <b>Mobile:</b>
            ${sellerMobile}

            <br>

            📝 <b>ବିବରଣୀ:</b>
            ${description}

        </div>


        <div class="actions">

            <button
                class="approve-btn"
            >
                ✅ Approve
            </button>


            <button
                class="reject-btn"
            >
                ❌ Reject
            </button>

        </div>
        `;



    /* =========================
       APPROVE
    ========================== */

    const approveBtn =
        content.querySelector(
            ".approve-btn"
        );


    approveBtn.addEventListener(
        "click",
        async function(){

            await approveProduct(
                data.id
            );

        }
    );



    /* =========================
       REJECT
    ========================== */

    const rejectBtn =
        content.querySelector(
            ".reject-btn"
        );


    rejectBtn.addEventListener(
        "click",
        async function(){

            await rejectProduct(
                data.id
            );

        }
    );



    card.appendChild(
        image
    );


    card.appendChild(
        content
    );


    productsList.appendChild(
        card
    );

}



/* ==========================================
   APPROVE PRODUCT
========================================== */

async function approveProduct(
    id
){

    const confirmApprove =
        confirm(
            "ଏହି Product କୁ Approve କରିବେ?"
        );


    if(!confirmApprove){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "products",
                id
            ),
            {

                status:
                    "approved"

            }
        );


        alert(
            "✅ Product Approved ହୋଇଗଲା!"
        );


        await loadProducts();

    }

    catch(error){

        console.error(
            "APPROVE ERROR:",
            error
        );


        alert(
            "❌ Product Approve ହୋଇପାରିଲା ନାହିଁ।\n\n" +
            error.message
        );

    }

}



/* ==========================================
   REJECT PRODUCT
========================================== */

async function rejectProduct(id){

    const reason = prompt(
        "❌ Product Reject କରିବାର କାରଣ ଲେଖନ୍ତୁ:"
    );

    if(reason === null){
        return;
    }

    const rejectionReason = reason.trim();

    if(!rejectionReason){

        alert(
            "⚠️ Reject reason ଦିଅନ୍ତୁ।"
        );

        return;
    }


    const confirmReject = confirm(
        "ଏହି Product କୁ Reject କରିବେ?\n\n" +
        "Reason:\n" +
        rejectionReason
    );


    if(!confirmReject){
        return;
    }


    try{

        await updateDoc(
            doc(
                db,
                "products",
                id
            ),
            {

                status:
                    "rejected",

                rejectionReason:
                    rejectionReason,

                rejectedAt:
                    new Date(),

                updatedAt:
                    new Date()

            }

/* ==========================================
   FIRESTORE TIMESTAMP
========================================== */

function getTime(
    timestamp
){

    try{

        if(
            timestamp &&
            typeof timestamp.toMillis ===
            "function"
        ){

            return timestamp.toMillis();

        }


        if(
            timestamp &&
            timestamp.seconds
        ){

            return (
                timestamp.seconds *
                1000
            );

        }

    }

    catch(error){

        console.log(error);

    }


    return 0;

}



/* ==========================================
   HTML SECURITY
========================================== */

function escapeHTML(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
