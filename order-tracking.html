<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#138a45">

<title>Utkala Mart - Order Tracking</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Odia",sans-serif;
  background:#f4f7f5;
  color:#222;
}

.header{
  background:#138a45;
  color:#fff;
  text-align:center;
  padding:18px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:6px 0 0;
  font-size:14px;
}

.container{
  max-width:850px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:18px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  color:#138a45;
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
}

input{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:9px;
  background:#138a45;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#999;
}

.back{
  display:inline-block;
  margin-bottom:15px;
  color:#138a45;
  text-decoration:none;
  font-weight:bold;
}

.message{
  padding:13px;
  border-radius:9px;
  margin-bottom:15px;
  display:none;
}

.error{
  background:#ffe8e8;
  color:#a00000;
}

.success{
  background:#e8f8ee;
  color:#087333;
}

/* ORDER */

.order-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  background:#f0f7f2;
  padding:14px;
  border-radius:10px;
}

.order-id{
  font-weight:bold;
  color:#138a45;
  word-break:break-all;
}

.date{
  color:#777;
  font-size:12px;
  margin-top:5px;
}

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  text-transform:capitalize;
}

.status-placed{
  background:#fff3cd;
  color:#856404;
}

.status-confirmed{
  background:#dbeafe;
  color:#1d4ed8;
}

.status-processing{
  background:#e0f2fe;
  color:#0369a1;
}

.status-shipped{
  background:#ede9fe;
  color:#6d28d9;
}

.status-delivered{
  background:#dcfce7;
  color:#166534;
}

.status-cancelled{
  background:#fee2e2;
  color:#b91c1c;
}

/* TIMELINE */

.timeline{
  margin:25px 0;
}

.step{
  display:flex;
  gap:15px;
  position:relative;
  padding-bottom:25px;
}

.step:last-child{
  padding-bottom:0;
}

.step-icon{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  z-index:2;
}

.step.done .step-icon{
  background:#138a45;
  color:#fff;
}

.step.active .step-icon{
  background:#138a45;
  color:#fff;
}

.step-content h3{
  margin:5px 0;
  font-size:15px;
}

.step-content p{
  margin:3px 0;
  font-size:12px;
  color:#777;
}

.step:not(:last-child)::after{
  content:"";
  position:absolute;
  left:18px;
  top:38px;
  width:2px;
  height:35px;
  background:#ddd;
}

.step.done:not(:last-child)::after{
  background:#138a45;
}

/* PRODUCTS */

.product{
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.product:last-child{
  border-bottom:0;
}

.product img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.product-info{
  flex:1;
}

.product-info h3{
  margin:0 0 5px;
  font-size:15px;
}

.product-info p{
  margin:3px 0;
  color:#666;
  font-size:13px;
}

.total{
  display:flex;
  justify-content:space-between;
  border-top:2px solid #138a45;
  margin-top:10px;
  padding-top:12px;
  font-size:19px;
  font-weight:bold;
}

/* INFO */

.info-box{
  background:#f0f7f2;
  padding:14px;
  border-radius:10px;
  margin-top:15px;
}

.info-box p{
  margin:6px 0;
  font-size:14px;
}

/* LOADING */

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

/* HIDDEN */

.hidden{
  display:none;
}

@media(max-width:600px){

  .container{
    margin:15px auto;
  }

  .card{
    padding:15px;
  }

  .product img{
    width:55px;
    height:55px;
  }

  .order-header{
    display:block;
  }

  .order-header > div:last-child{
    margin-top:10px;
  }

}

</style>

</head>


<body>


<div class="header">

  <h1>🛍️ Utkala Mart</h1>

  <p>
    ଆପଣଙ୍କ Order Track କରନ୍ତୁ
  </p>

</div>


<div class="container">


<a
  href="index.html"
  class="back">

  ← Shopping କୁ ଫେରନ୍ତୁ

</a>


<!-- SEARCH -->

<div class="card">

  <h2>
    📦 Order Tracking
  </h2>

  <p>
    ଆପଣଙ୍କ Order ID ଏବଂ Mobile Number
    ଦେଇ Order Status ଦେଖନ୍ତୁ।
  </p>


  <label>
    Order ID
  </label>

  <input
    type="text"
    id="orderId"
    placeholder="ଆପଣଙ୍କ Order ID"
    autocomplete="off"
  >


  <label>
    Mobile Number
  </label>

  <input
    type="tel"
    id="mobile"
    maxlength="10"
    inputmode="numeric"
    placeholder="10 digit mobile number"
    autocomplete="tel"
  >


  <button
    id="trackBtn"
    onclick="trackOrder()">

    🔎 Track Order

  </button>

</div>


<div
  id="message"
  class="message">
</div>


<!-- RESULT -->

<div
  id="result"
  class="hidden">

</div>


</div>


<script type="module">


/* ===================================
   FIREBASE
=================================== */

import {
  db
} from "./js/firebase-config.js";


import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ===================================
   TRACK ORDER
=================================== */

window.trackOrder =
async function(){

  const orderId =
    document
      .getElementById("orderId")
      .value
      .trim();


  const mobile =
    document
      .getElementById("mobile")
      .value
      .replace(/\D/g,"")
      .trim();


  const btn =
    document
      .getElementById("trackBtn");


  const result =
    document
      .getElementById("result");


  hideMessage();


  /* ===============================
     VALIDATION
  =============================== */

  if(!orderId){

    showMessage(
      "ଦୟାକରି Order ID ଦିଅନ୍ତୁ।",
      "error"
    );

    return;

  }


  if(
    !/^[0-9]{10}$/.test(
      mobile
    )
  ){

    showMessage(
      "ଦୟାକରି ସଠିକ୍ 10 digit Mobile Number ଦିଅନ୍ତୁ।",
      "error"
    );

    return;

  }


  btn.disabled = true;

  btn.innerText =
    "⏳ Searching...";


  result.classList.add(
    "hidden"
  );


  try{


    /* ===============================
       TRACKING DOCUMENT ID
    =============================== */

    const trackingId =
      `${orderId}_${mobile}`;


    const ref =
      doc(
        db,
        "orderTracking",
        trackingId
      );


    const snap =
      await getDoc(ref);


    /* ===============================
       ORDER NOT FOUND
    =============================== */

    if(!snap.exists()){

      showMessage(
        "❌ Order ID ଏବଂ Mobile Number match କରୁନାହିଁ କିମ୍ବା Order ମିଳିଲା ନାହିଁ।",
        "error"
      );

      result.classList.add(
        "hidden"
      );

      return;

    }


    /* ===============================
       TRACKING DATA
    =============================== */

    const tracking =
      snap.data();


    renderOrder(
      tracking
    );


    result.classList.remove(
      "hidden"
    );


    showMessage(
      "✅ Order ମିଳିଗଲା।",
      "success"
    );


  }catch(error){

    console.error(
      error
    );


    showMessage(
      "❌ Order Track କରିବା ସମୟରେ ସମସ୍ୟା ହେଲା। ପୁଣିଥରେ ଚେଷ୍ଟା କରନ୍ତୁ।",
      "error"
    );


    result.classList.add(
      "hidden"
    );

  }


  btn.disabled = false;

  btn.innerText =
    "🔎 Track Order";

};


/* ===================================
   RENDER ORDER
=================================== */

function renderOrder(
  order
){

  const result =
    document.getElementById(
      "result"
    );


  const items =
    Array.isArray(order.items)
    ? order.items
    : [];


  const status =
    String(
      order.orderStatus ||
      "placed"
    ).toLowerCase();


  const safeStatus =
    [
      "placed",
      "confirmed",
      "processing",
      "shipped",
      "delivered",
      "cancelled"
    ].includes(status)
    ? status
    : "placed";


  result.innerHTML = `

  <!-- ORDER SUMMARY -->

  <div class="card">


    <div class="order-header">

      <div>

        <div class="order-id">

          📦 Order ID:
          ${escapeHTML(
            order.orderId ||
            "Order"
          )}

        </div>


        <div class="date">

          ${formatDate(
            order.createdAt
          )}

        </div>

      </div>


      <div>

        <span
          class="status status-${safeStatus}">

          ${getStatusText(
            safeStatus
          )}

        </span>

      </div>

    </div>


    ${
      safeStatus === "cancelled"
      ? renderCancelledTimeline()
      : renderTimeline(
          safeStatus
        )
    }


  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>
      🛍️ Products
    </h2>


    ${
      items.length
      ? items.map(
          item => `

          <div class="product">

            ${
              item.image
              ? `
              <img
                src="${escapeHTML(
                  item.image
                )}"
                alt=""
                onerror="
                  this.style.display='none'
                "
              >
              `
              : `
              <div
                style="
                  width:65px;
                  height:65px;
                  border-radius:8px;
                  background:#eee;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                "
              >
                🛍️
              </div>
              `
            }


            <div class="product-info">

              <h3>

                ${escapeHTML(
                  item.name ||
                  "Product"
                )}

              </h3>


              <p>

                Qty:
                <strong>
                  ${Number(
                    item.qty || 1
                  )}
                </strong>

              </p>


              ${
                item.weight
                ? `
                <p>

                  ⚖️
                  ${escapeHTML(
                    String(
                      item.weight
                    )
                  )}

                  ${escapeHTML(
                    item.weightUnit ||
                    ""
                  )}

                </p>
                `
                : ""
              }


              <p>

                ₹${Number(
                  item.price || 0
                ).toLocaleString(
                  "en-IN"
                )}

              </p>

            </div>

          </div>

        `
        ).join("")
      : `
        <p>
          Product details ମିଳିଲା ନାହିଁ।
        </p>
      `
    }


    <div class="total">

      <span>
        Total
      </span>

      <span>

        ₹${Number(
          order.total || 0
        ).toLocaleString(
          "en-IN"
        )}

      </span>

    </div>

  </div>


  <!-- INFORMATION -->

  <div class="card">

    <h2>
      🔐 Privacy Protected
    </h2>

    <div class="info-box">

      <p>
        ✅ Order tracking information ସଫଳତାର ସହିତ ମିଳିଛି।
      </p>

      <p>
        🔒 ଆପଣଙ୍କ personal delivery details
        ସୁରକ୍ଷିତ ରଖାଯାଇଛି।
      </p>

    </div>

  </div>

  `;

}


/* ===================================
   STATUS TEXT
=================================== */

function getStatusText(
  status
){

  const names = {

    placed:
      "Order Placed",

    confirmed:
      "Order Confirmed",

    processing:
      "Processing",

    shipped:
      "Order Shipped",

    delivered:
      "Order Delivered",

    cancelled:
      "Order Cancelled"

  };


  return names[status] ||
    "Order Placed";

}


/* ===================================
   NORMAL TIMELINE
=================================== */

function renderTimeline(
  current
){

  const steps = [

    {
      id:"placed",
      icon:"📦",
      title:"Order Placed"
    },

    {
      id:"confirmed",
      icon:"✅",
      title:"Order Confirmed"
    },

    {
      id:"processing",
      icon:"⚙️",
      title:"Processing"
    },

    {
      id:"shipped",
      icon:"🚚",
      title:"Order Shipped"
    },

    {
      id:"delivered",
      icon:"🏠",
      title:"Order Delivered"
    }

  ];


  let currentIndex =
    steps.findIndex(
      x =>
        x.id === current
    );


  if(
    currentIndex < 0
  ){

    currentIndex = 0;

  }


  return `

  <div class="timeline">

    ${
      steps.map(
        (step,index) => {

          let cls = "";


          if(
            index <
            currentIndex
          ){

            cls = "done";

          }


          if(
            index ===
            currentIndex
          ){

            cls =
              "done active";

          }


          return `

          <div
            class="step ${cls}"
          >

            <div
              class="step-icon">

              ${step.icon}

            </div>


            <div
              class="step-content">

              <h3>
                ${step.title}
              </h3>


              ${
                index ===
                currentIndex
                ? `
                <p>
                  Current Status
                </p>
                `
                : ""
              }

            </div>

          </div>

          `;

        }
      ).join("")
    }

  </div>

  `;

}


/* ===================================
   CANCELLED TIMELINE
=================================== */

function renderCancelledTimeline(){

  return `

  <div class="timeline">

    <div class="step done">

      <div class="step-icon">
        📦
      </div>


      <div class="step-content">

        <h3>
          Order Placed
        </h3>

      </div>

    </div>


    <div class="step active">

      <div class="step-icon">
        ❌
      </div>


      <div class="step-content">

        <h3>
          Order Cancelled
        </h3>


        <p>
          ଏହି Order ବର୍ତ୍ତମାନ Cancelled ଅଛି।
        </p>

      </div>

    </div>

  </div>

  `;

}


/* ===================================
   DATE
=================================== */

function formatDate(
  timestamp
){

  if(!timestamp){

    return "Date unavailable";

  }


  try{

    if(
      typeof timestamp.toDate ===
      "function"
    ){

      return timestamp
        .toDate()
        .toLocaleString(
          "en-IN",
          {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
          }
        );

    }


    return "Date unavailable";

  }catch(e){

    return "Date unavailable";

  }

}


/* ===================================
   MESSAGE
=================================== */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    "message " + type;


  box.innerText =
    text;


  box.style.display =
    "block";

}


function hideMessage(){

  const box =
    document.getElementById(
      "message"
    );


  box.style.display =
    "none";

}


/* ===================================
   ESCAPE HTML
=================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* ===================================
   AUTO LOAD LAST ORDER
=================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const urlOrderId =
  urlParams.get(
    "orderId"
  );


const lastOrder =
  localStorage.getItem(
    "utkalaLastOrderId"
  );


if(urlOrderId){

  document
    .getElementById(
      "orderId"
    )
    .value =
    urlOrderId;

}else if(lastOrder){

  document
    .getElementById(
      "orderId"
    )
    .value =
    lastOrder;

}


</script>

</body>

</html>
