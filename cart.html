/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
        Arial,
        "Noto Sans Oriya",
        "Nirmala UI",
        sans-serif;

    background:#eaeded;
    color:#111;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================
   HEADER
========================= */

.header{

    background:#131921;
    color:white;

    min-height:70px;

    padding:10px 5%;

    display:flex;
    align-items:center;
    gap:25px;

    position:sticky;
    top:0;
    z-index:1000;
}

.logo{

    min-width:190px;

    font-size:25px;
    font-weight:bold;

    color:#78c7ff;
}

.logo span{
    color:#ff7518;
}

.logo small{

    display:block;

    color:#b7e9c8;

    font-size:10px;

    margin-top:3px;

    font-weight:normal;
}


.search{

    flex:1;

    height:42px;

    display:flex;

    background:white;

    border-radius:6px;

    overflow:hidden;
}

.search input{

    flex:1;

    border:0;
    outline:0;

    padding:0 15px;

    font-size:14px;
}

.search button{

    width:55px;

    border:0;

    background:#ff9900;

    font-size:19px;
}


.cart-icon{

    font-size:24px;

    white-space:nowrap;
}

.cart-icon span{

    color:#ff9900;

    font-weight:bold;
}


/* =========================
   NAV
========================= */

.nav{

    background:#232f3e;

    display:flex;

    overflow-x:auto;

    white-space:nowrap;

    scrollbar-width:none;
}

.nav::-webkit-scrollbar{
    display:none;
}

.nav a{

    color:white;

    text-decoration:none;

    padding:12px 18px;

    font-size:13px;

    border-right:
        1px solid #39485a;
}

.nav a:hover{
    background:#ff9900;
    color:#111;
}


/* =========================
   PAGE
========================= */

.container{

    max-width:1200px;

    margin:25px auto;

    padding:0 18px;
}


/* =========================
   TITLE
========================= */

.page-title{

    background:white;

    padding:22px;

    border-radius:8px;

    margin-bottom:18px;

    border:1px solid #ddd;
}

    font-size:28px;

    color:#172337;
}
