<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#087f5b">

<title>Utkala Mart - Admin Products</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Arial,
    "Noto Sans Oriya",
    sans-serif;
  background:#f3f5f4;
  color:#222;
}

/* HEADER */

.header{
  background:#086b4d;
  color:white;
  padding:20px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:7px 0 0;
  font-size:14px;
}

/* MAIN */

.container{
  width:95%;
  max-width:1100px;
  margin:25px auto;
}

/* LOGIN */

.login-box{
  max-width:600px;
  margin:30px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 5px 25px rgba(0,0,0,.10);
}

.login-box h2{
  margin-top:0;
  color:#086b4d;
  text-align:center;
  font-size:28px;
}

.login-info{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

.input-group{
  margin-bottom:18px;
}

.input-group label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.input-group input{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.input-group input:focus{
  border-color:#087f5b;
}

/* PASSWORD */

.password-box{
  position:relative;
}

.password-box input{
  padding-right:55px;
}

.show-password{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:transparent;
  font-size:24px;
  cursor:pointer;
}

/* BUTTON */

.btn{
  border:none;
  border-radius:12px;
  padding:13px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:4px;
}

.btn-login{
  width:100%;
  background:#f47721;
  color:white;
  padding:15px;
  font-size:18px;
}

.btn-login:hover{
  background:#df6413;
}

.btn-green{
  background:#087f5b;
  color:white;
}

.btn-green:hover{
  background:#056746;
}

.btn-red{
  background:#dc3545;
  color:white;
}

.btn-blue{
  background:#1769aa;
  color:white;
}

.btn-gray{
  background:#777;
  color:white;
}

/* ERROR */

.error{
  background:#ffe3e3;
  color:#b42318;
  padding:13px;
  border-radius:12px;
  margin-top:15px;
  font-weight:bold;
  display:none;
}

/* ADMIN AREA */

#adminArea{
  display:none;
}

.admin-top{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.admin-top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.admin-top h2{
  margin:0;
  color:#086b4d;
}

.admin-email{
  color:#666;
  margin-top:6px;
  font-size:14px;
}

/* SECTION */

.section{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:25px;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:18px;
}

.section-title h2{
  margin:0;
  color:#086b4d;
}

/* PRODUCT GRID */

.product-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(290px,1fr));
  gap:18px;
}

/* PRODUCT CARD */

.product-card{
  border:1px solid #ddd;
  border-radius:16px;
  overflow:hidden;
  background:#fff;
}

.product-image{
  width:100%;
  height:210px;
  object-fit:cover;
  background:#eee;
  display:block;
}

.product-body{
  padding:15px;
}

.product-name{
  font-size:20px;
  font-weight:bold;
  color:#222;
  margin-bottom:10px;
}

.product-row{
  margin:6px 0;
  color:#555;
  font-size:15px;
}

.product-row strong{
  color:#222;
}

.price{
  color:#087f5b;
  font-size:21px;
  font-weight:bold;
  margin:10px 0;
}

.stock{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  font-weight:bold;
  background:#e7f7ef;
  color:#087f5b;
}

.stock.out{
  background:#ffe5e5;
  color:#c62828;
}

.status{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.status.pending{
  background:#fff3cd;
  color:#856404;
}

.status.approved{
  background:#d1f7df;
  color:#087f5b;
}

.status.rejected{
  background:#ffe0e0;
  color:#b42318;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:15px;
}

.actions .btn{
  flex:1;
  min-width:120px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:35px 15px;
  color:#777;
  font-size:17px;
}

/* LOADING */

.loading{
  text-align:center;
  padding:30px;
  color:#666;
  font-size:17px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  z-index:9999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.65);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:420px;
  border-radius:18px;
  padding:25px;
}

.modal-box h3{
  margin-top:0;
  color:#086b4d;
}

.modal-box input{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:18px;
  margin:10px 0 15px;
}

.modal-actions{
  display:flex;
  gap:8px;
}

.modal-actions .btn{
  flex:1;
}

/* MOBILE */

@media(max-width:600px){

  .header h1{
    font-size:22px;
  }

  .container{
    width:94%;
    margin:15px auto;
  }

  .login-box{
    padding:20px;
  }

  .section{
    padding:14px;
  }

  .product-grid{
    grid-template-columns:1fr;
  }

  .product-image{
    height:220px;
  }

  .admin-top-row{
    align-items:flex-start;
  }

  .admin-top-row .btn{
    width:100%;
    margin:3px 0;
  }

  .actions{
    flex-direction:column;
  }

  .actions .btn{
    width:100%;
  }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

  <h1>🛍️ Utkala Mart Admin Products</h1>

  <p>Product Approval & Stock Management</p>

</div>


<div class="container">


<!-- ================= LOGIN ================= -->

<div id="loginBox" class="login-box">

  <h2>🔐 Admin Login</h2>

  <div class="login-info">
    Admin Email ଏବଂ Password ଦେଇ Login କରନ୍ତୁ
  </div>


  <div class="input-group">

    <label>📧 Admin Email</label>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

  </div>


  <div class="input-group">

    <label>🔑 Password</label>

    <div class="password-box">

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        type="button"
        id="showPassword"
        class="show-password"
      >👁️</button>

    </div>

  </div>


  <button
    id="loginBtn"
    class="btn btn-login"
  >
    🔐 Login
  </button>


  <div
    id="loginError"
    class="error"
  ></div>

</div>



<!-- ================= ADMIN AREA ================= -->

<div id="adminArea">


  <!-- ADMIN TOP -->

  <div class="admin-top">

    <div class="admin-top-row">

      <div>

        <h2>🛍️ Product Management</h2>

        <div
          id="adminEmail"
          class="admin-email"
        ></div>

      </div>


      <div>

        <button
          class="btn btn-green"
          id="refreshBtn"
        >
          🔄 Refresh
        </button>

        <button
          class="btn btn-red"
          id="logoutBtn"
        >
          🚪 Logout
        </button>

      </div>

    </div>

  </div>



  <!-- ================= PENDING ================= -->

  <div class="section">

    <div class="section-title">

      <h2>⏳ Pending Products</h2>

      <span id="pendingCount">
        0
      </span>

    </div>


    <div
      id="pendingProducts"
      class="product-grid"
    >

      <div class="loading">
        Loading...
      </div>

    </div>

  </div>



  <!-- ================= APPROVED ================= -->

  <div class="section">

    <div class="section-title">

      <h2>✅ Approved Products</h2>

      <span id="approvedCount">
        0
      </span>

    </div>


    <div
      id="approvedProducts"
      class="product-grid"
    >

      <div class="loading">
        Loading...
      </div>

    </div>

  </div>


</div>

</div>



<!-- ================= STOCK MODAL ================= -->

<div
  id="stockModal"
  class="modal"
>

  <div class="modal-box">

    <h3>✏️ Edit Product Stock</h3>

    <p id="stockProductName"></p>

    <label>
      New Stock:
    </label>

    <input
      type="number"
      id="newStock"
      min="0"
      step="1"
      placeholder="Enter stock"
    >

    <div class="modal-actions">

      <button
        id="cancelStock"
        class="btn btn-gray"
      >
        Cancel
      </button>

      <button
        id="saveStock"
        class="btn btn-green"
      >
        💾 Save Stock
      </button>

    </div>

  </div>

</div>



<!-- ================= FIREBASE ================= -->

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  updateDoc,
  doc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBYJ_KKs_7SNz108jnw6hpOlmegofRhJg",

  authDomain:
    "utkalamart-1ec68.firebaseapp.com",

  projectId:
    "utkalamart-1ec68",

  storageBucket:
    "utkalamart-1ec68.firebasestorage.app",

  messagingSenderId:
    "664871353747",

  appId:
    "1:664871353747:web:96532fdafe78aabe7f3c66"

};



/* ================= INITIALIZE ================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);



/* ================= ADMIN EMAIL ================= */

const ADMIN_EMAIL =
  "suryakantabehera629@gmail.com";



/* ================= ELEMENTS ================= */

const loginBox =
  document.getElementById("loginBox");

const adminArea =
  document.getElementById("adminArea");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const showPassword =
  document.getElementById("showPassword");

const logoutBtn =
  document.getElementById("logoutBtn");

const refreshBtn =
  document.getElementById("refreshBtn");

const adminEmail =
  document.getElementById("adminEmail");

const pendingProducts =
  document.getElementById("pendingProducts");

const approvedProducts =
  document.getElementById("approvedProducts");

const pendingCount =
  document.getElementById("pendingCount");

const approvedCount =
  document.getElementById("approvedCount");



/* ================= PASSWORD SHOW/HIDE ================= */

showPassword.addEventListener(
  "click",
  () => {

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      showPassword.textContent =
        "🙈";

    }else{

      passwordInput.type =
        "password";

      showPassword.textContent =
        "👁️";

    }

  }
);



/* ================= LOGIN ================= */

loginBtn.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value
      .trim()
      .toLowerCase();

    const password =
      passwordInput.value;


    loginError.style.display =
      "none";


    if(!email || !password){

      showLoginError(
        "ଦୟାକରି Email ଏବଂ Password ଦିଅନ୍ତୁ।"
      );

      return;

    }


    if(email !== ADMIN_EMAIL){

      showLoginError(
        "ଏହି Email କୁ Admin access ଦିଆଯାଇନାହିଁ।"
      );

      return;

    }


    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "⏳ Login হচ্ছে...";


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }catch(error){

      console.error(error);

      showLoginError(
        getLoginError(error)
      );

    }finally{

      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "🔐 Login";

    }

  }
);



/* ================= LOGIN ERROR ================= */

function showLoginError(message){

  loginError.textContent =
    "❌ " + message;

  loginError.style.display =
    "block";

}



function getLoginError(error){

  const code =
    error?.code || "";


  if(
    code ===
    "auth/invalid-credential"
  ){

    return "Email କିମ୍ବା Password ଭୁଲ।";

  }


  if(
    code ===
    "auth/wrong-password"
  ){

    return "Password ଭୁଲ।";

  }


  if(
    code ===
    "auth/user-not-found"
  ){

    return "ଏହି Email ର Firebase account ନାହିଁ।";

  }


  if(
    code ===
    "auth/invalid-email"
  ){

    return "Email format ଠିକ୍ ନୁହେଁ।";

  }


  if(
    code ===
    "auth/too-many-requests"
  ){

    return "ଅଧିକଥର Login attempt ହୋଇଛି। କିଛି ସମୟ ପରେ try କରନ୍ତୁ।";

  }


  return error?.message ||
    "Login ହୋଇନାହିଁ।";

}



/* ================= AUTH STATE ================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if(user){

      if(
        user.email
          ?.toLowerCase() !==
        ADMIN_EMAIL
      ){

        await signOut(auth);

        showLoginError(
          "ଏହି account ର Admin access ନାହିଁ।"
        );

        return;

      }


      loginBox.style.display =
        "none";

      adminArea.style.display =
        "block";

      adminEmail.textContent =
        "👤 " + user.email;


      await loadProducts();

    }else{

      loginBox.style.display =
        "block";

      adminArea.style.display =
        "none";

    }

  }
);



/* ================= LOAD PRODUCTS ================= */

async function loadProducts(){

  pendingProducts.innerHTML =
    `<div class="loading">
      ⏳ Products loading...
    </div>`;


  approvedProducts.innerHTML =
    `<div class="loading">
      ⏳ Products loading...
    </div>`;


  try{

    const productsQuery =
      query(
        collection(db,"products"),
        orderBy("createdAt","desc")
      );


    const snapshot =
      await getDocs(productsQuery);


    const pending = [];

    const approved = [];


    snapshot.forEach(
      productDoc => {

        const data =
          productDoc.data();


        const product = {

          id:
            productDoc.id,

          ...data

        };


        /*
          NEW SELLER PRODUCTS
        */

        if(
          data.status ===
            "approved" &&
          data.approved ===
            true &&
          data.active ===
            true
        ){

          approved.push(
            product
          );

          return;

        }


        /*
          PENDING PRODUCTS
        */

        if(
          data.status ===
            "pending"
        ){

          pending.push(
            product
          );

          return;

        }


        /*
          LEGACY PRODUCT SUPPORT

          ଯଦି ପୁରୁଣା product ରେ
          approval fields ନଥାଏ,
          ତାହେଲେ Approved ଭାବରେ
          ଦେଖାଇବ।
        */

        const hasApprovalFields =
          data.status !==
            undefined ||
          data.approved !==
            undefined ||
          data.active !==
            undefined;


        const isOldProduct =
          !hasApprovalFields &&
          data.active !== false;


        if(isOldProduct){

          approved.push(
            product
          );

        }

      }
    );


    pendingCount.textContent =
      pending.length;


    approvedCount.textContent =
      approved.length;


    renderPending(
      pending
    );


    renderApproved(
      approved
    );


  }catch(error){

    console.error(
      "Load Products Error:",
      error
    );


    pendingProducts.innerHTML =
      `<div class="empty">
        ❌ Products load ହୋଇନାହିଁ।<br><br>
        ${escapeHtml(error.message)}
      </div>`;


    approvedProducts.innerHTML =
      `<div class="empty">
        ❌ Products load ହୋଇନାହିଁ।
      </div>`;

  }

}



/* ================= GET STOCK ================= */

function getStock(product){

  return Number(
    product.stock ??
    product.stockQty ??
    product.quantity ??
    product.availableStock ??
    0
  );

}



/* ================= RENDER PENDING ================= */

function renderPending(products){

  if(!products.length){

    pendingProducts.innerHTML =
      `<div class="empty">
        🎉 କୌଣସି Pending Product ନାହିଁ।
      </div>`;

    return;

  }


  pendingProducts.innerHTML =
    products
      .map(
        product =>
          createProductCard(
            product,
            "pending"
          )
      )
      .join("");

}



/* ================= RENDER APPROVED ================= */

function renderApproved(products){

  if(!products.length){

    approvedProducts.innerHTML =
      `<div class="empty">
        ବର୍ତ୍ତମାନ କୌଣସି Approved Product ନାହିଁ।
      </div>`;

    return;

  }


  approvedProducts.innerHTML =
    products
      .map(
        product =>
          createProductCard(
            product,
            "approved"
          )
      )
      .join("");

}



/* ================= PRODUCT CARD ================= */

function createProductCard(
  product,
  type
){

  const name =
    escapeHtml(
      product.name ||
      "Unnamed Product"
    );


  const image =
    product.image ||
    product.imageUrl ||
    "https://via.placeholder.com/600x400?text=Utkala+Mart";


  const price =
    Number(
      product.utkalaPrice ??
      product.price ??
      product.sellingPrice ??
      0
    );


  const sellerPrice =
    Number(
      product.sellerPrice ??
      0
    );


  const stock =
    getStock(product);


  const weight =
    product.weight ||
    "";


  const weightUnit =
    product.weightUnit ||
    product.unit ||
    "";


  const location =
    escapeHtml(
      product.location ||
      product.sellerLocation ||
      "—"
    );


  const category =
    escapeHtml(
      product.categoryName ||
      product.category ||
      "—"
    );


  const sellerName =
    escapeHtml(
      product.sellerName ||
      "Seller"
    );


  let statusHTML = "";


  if(type === "pending"){

    statusHTML =
      `<span class="status pending">
        ⏳ Pending Approval
      </span>`;

  }else{

    statusHTML =
      `<span class="status approved">
        ✅ Approved
      </span>`;

  }


  const stockHTML =
    stock > 0

    ?

    `<span class="stock">
      📦 Stock: ${stock}
    </span>`

    :

    `<span class="stock out">
      ❌ Stock Out
    </span>`;


  let actions = "";


  if(type === "pending"){

    actions = `

      <button
        class="btn btn-green"
        onclick="approveProduct('${product.id}')"
      >
        ✅ Approve
      </button>

      <button
        class="btn btn-red"
        onclick="rejectProduct('${product.id}')"
      >
        ❌ Reject
      </button>

    `;

  }else{

    actions = `

      <button
        class="btn btn-green"
        onclick="editStock(
          '${product.id}',
          '${escapeAttr(product.name || "Product")}',
          ${stock}
        )"
      >
        ✏️ Edit Stock
      </button>

    `;

  }


  return `

    <div class="product-card">

      <img
        class="product-image"
        src="${escapeAttr(image)}"
        alt="${escapeAttr(name)}"
        onerror="
          this.src='https://via.placeholder.com/600x400?text=No+Image'
        "
      >

      <div class="product-body">

        ${statusHTML}

        <div class="product-name">
          ${name}
        </div>


        <div class="product-row">
          📂 <strong>Category:</strong>
          ${category}
        </div>


        ${
          weight
          ?
          `
          <div class="product-row">
            ⚖️ <strong>Weight:</strong>
            ${escapeHtml(weight)}
            ${escapeHtml(weightUnit)}
          </div>
          `
          :
          ""
        }


        <div class="product-row">
          👤 <strong>Seller:</strong>
          ${sellerName}
        </div>


        <div class="product-row">
          📍 <strong>Location:</strong>
          ${location}
        </div>


        <div class="product-row">
          💰 <strong>Seller Price:</strong>
          ₹${sellerPrice}
        </div>


        <div class="price">
          🛒 Utkala Mart Price:
          ₹${price}
        </div>


        <div>
          ${stockHTML}
        </div>


        <div class="actions">

          ${actions}

        </div>

      </div>

    </div>

  `;

}

/* ================= STOCK MODAL ================= */

const stockModal =
  document.getElementById(
    "stockModal"
  );

const stockProductName =
  document.getElementById(
    "stockProductName"
  );

const newStock =
  document.getElementById(
    "newStock"
  );

const saveStock =
  document.getElementById(
    "saveStock"
  );

const cancelStock =
  document.getElementById(
    "cancelStock"
  );


let editingProductId =
  null;



/* ================= EDIT STOCK ================= */

window.editStock =
  function(
    id,
    name,
    stock
  ){

    editingProductId =
      id;


    stockProductName.textContent =
      "📦 Product: " +
      name;


    newStock.value =
      stock;


    stockModal.style.display =
      "flex";


    setTimeout(
      () => {
        newStock.focus();
        newStock.select();
      },
      100
    );

  };



/* ================= CANCEL STOCK ================= */

cancelStock.addEventListener(
  "click",
  () => {

    stockModal.style.display =
      "none";

    editingProductId =
      null;

  }
);



/* ================= SAVE STOCK ================= */

saveStock.addEventListener(
  "click",
  async () => {

    if(!editingProductId){

      alert(
        "Product select ହୋଇନାହିଁ।"
      );

      return;

    }


    const stockValue =
      Number(
        newStock.value
      );


    if(
      !Number.isInteger(
        stockValue
      ) ||
      stockValue < 0
    ){

      alert(
        "ଦୟାକରି 0 କିମ୍ବା ତାଠାରୁ ବଡ଼ ସଠିକ୍ Stock ଦିଅନ୍ତୁ।"
      );

      return;

    }


    saveStock.disabled =
      true;

    saveStock.textContent =
      "⏳ Saving...";


    try{

      await updateDoc(

        doc(
          db,
          "products",
          editingProductId
        ),

        {

          /*
            ସମସ୍ତ stock field
            same value ରହିବ
          */

          stock:
            stockValue,

          stockQty:
            stockValue,

          quantity:
            stockValue,

          availableStock:
            stockValue

        }

      );


      alert(
        "✅ Stock successfully update ହୋଇଗଲା!\n\nNew Stock: " +
        stockValue
      );


      stockModal.style.display =
        "none";


      editingProductId =
        null;


      await loadProducts();


    }catch(error){

      console.error(error);

      alert(
        "❌ Stock update ହୋଇନାହିଁ:\n\n" +
        error.message
      );

    }finally{

      saveStock.disabled =
        false;

      saveStock.textContent =
        "💾 Save Stock";

    }

  }
);



/* ================= REFRESH ================= */

refreshBtn.addEventListener(

    refreshBtn.disabled =
      true;

    refreshBtn.textContent =
      "⏳ Loading...";

    refreshBtn.disabled =

    refreshBtn.textContent =

  }
);

logoutBtn.addEventListener(

      await signOut(auth);

);



/* ================= CLOSE MODAL OUTSIDE ================= */

stockModal.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      stockModal
    ){

      stockModal.style.display =
        "none";

      editingProductId =
        null;

    }

  }
);



/* ================= ESCAPE HTML ================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}



function escapeAttr(value){

  return escapeHtml(
    value
  );

}
