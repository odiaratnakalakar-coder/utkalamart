<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Utkala Mart - Admin Products</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Noto Sans Oriya",sans-serif;
background:#f3f6f4;
color:#222;
}

header{
background:#087f5b;
color:#fff;
text-align:center;
padding:16px;
}

header h1{
margin:0;
font-size:25px;
}

header p{
margin:5px 0 0;
}

.container{
width:94%;
max-width:1100px;
margin:22px auto;
}

.box,.stat,.product{
background:#fff;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.09);
}

.login{
max-width:480px;
margin:35px auto;
padding:25px;
}

h2{
color:#087f5b;
}

label{
display:block;
font-weight:bold;
margin:12px 0 6px;
}

input{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

.password{
position:relative;
}

.password input{
padding-right:55px;
}

.eye{
position:absolute;
right:5px;
top:5px;
border:0;
background:none;
font-size:24px;
cursor:pointer;
}

button{
border:0;
border-radius:9px;
padding:11px 15px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.login-btn{
width:100%;
background:#087f5b;
color:#fff;
margin-top:15px;
}

.logout{
background:#dc3545;
color:#fff;
}

.top{
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin:15px 0;
}

.stat{
text-align:center;
padding:17px;
}

.stat b{
display:block;
font-size:29px;
color:#087f5b;
}

.search{
margin:15px 0;
}

.title{
background:#087f5b;
color:#fff;
padding:14px 16px;
border-radius:11px;
margin-top:25px;
font-size:19px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px;
margin-top:15px;
}

.product{
overflow:hidden;
}

.product img{
width:100%;
height:210px;
object-fit:cover;
background:#eee;
}

.content{
padding:15px;
}

.content h3{
margin:0 0 9px;
color:#087f5b;
font-size:20px;
}

.info{
margin:6px 0;
}

.price{
font-size:19px;
font-weight:bold;
color:#e65100;
}

.stock{
font-weight:bold;
margin-top:7px;
}

.stock-ok{
color:#087f5b;
}

.stock-low{
color:#d97706;
}

.stock-out{
color:#dc3545;
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:7px;
font-size:12px;
font-weight:bold;
background:#e8f5e9;
margin-bottom:8px;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:13px;
}

.approve{
background:#087f5b;
color:#fff;
}

.reject{
background:#dc3545;
color:#fff;
}

.edit{
background:#1565c0;
color:#fff;
}

.empty{
background:#fff;
padding:25px;
border-radius:12px;
text-align:center;
color:#666;
}

.error{
display:none;
background:#ffe5e5;
color:#a00000;
padding:13px;
margin-top:12px;
border-radius:10px;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:999;
align-items:center;
justify-content:center;
padding:20px;
}

.modal-box{
background:#fff;
width:100%;
max-width:400px;
padding:22px;
border-radius:16px;
}

.modal-buttons{
display:flex;
gap:10px;
margin-top:12px;
}

.save{
background:#087f5b;
color:#fff;
flex:1;
}

.cancel{
background:#777;
color:#fff;
flex:1;
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr;
}

.grid{
grid-template-columns:1fr;
}

.top{
flex-direction:column;
align-items:stretch;
}

}
</style>
</head>

<body>

<header>
<h1>🛒 Utkala Mart</h1>
<p>Admin Product Management</p>
</header>

<div class="container">

<!-- LOGIN -->

<div id="loginSection" class="box login">

<h2>🔐 Admin Login</h2>

<label>📧 Email</label>

<input
id="email"
type="email"
value="suryakantabehera629@gmail.com"
autocomplete="username"
>

<label>🔑 Password</label>

<div class="password">

<input
id="password"
type="password"
autocomplete="current-password"
>

<button
type="button"
class="eye"
onclick="togglePassword()"
>👁️</button>

</div>

<button
id="loginBtn"
class="login-btn"
onclick="loginAdmin()"
>
🔐 Login
</button>

<div id="loginError" class="error"></div>

</div>


<!-- ADMIN SECTION -->

<div id="adminSection" style="display:none">

<div class="box top">

<div>

<h2 style="margin:0">
📦 Product Management
</h2>

<div id="adminEmail"></div>

</div>

<button
class="logout"
onclick="logoutAdmin()"
>
🚪 Logout
</button>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<b id="totalProducts">
0
</b>

Total Products

</div>

<div class="stat">

<b id="pendingProducts">
0
</b>

Pending

</div>

<div class="stat">

<b id="approvedProducts">
0
</b>

Approved

</div>

</div>


<!-- SEARCH -->

<div class="search">

<input
id="searchInput"
type="search"
placeholder="🔎 Product / Category / Seller search..."
oninput="renderProducts()"
>

</div>


<!-- PENDING -->

<div class="title">
⏳ Pending Products
</div>

<div
id="pendingList"
class="grid"
>
<div class="empty">
⏳ Loading...
</div>
</div>


<!-- APPROVED -->

<div class="title">
✅ Approved / Existing Products
</div>

<div
id="approvedList"
class="grid"
>
<div class="empty">
⏳ Loading...
</div>
</div>

</div>

</div>


<!-- STOCK MODAL -->

<div
id="stockModal"
class="modal"
>

<div class="modal-box">

<h2>
✏️ Edit Stock
</h2>

<div id="stockProductName"></div>

<br>

<input
id="stockInput"
type="number"
min="0"
step="1"
placeholder="Enter stock"
>

<div class="modal-buttons">

<button
class="save"
onclick="saveStock()"
>
💾 Save
</button>

<button
class="cancel"
onclick="closeStockModal()"
>
Cancel
</button>

</div>

</div>

</div>


<script type="module">

/* =================================
   FIREBASE IMPORT
================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =================================
   FIREBASE CONFIG
================================= */

const firebaseConfig = {

apiKey:
"AIzaSyDonHK2CtrUjAkAaro6stnJmdDUwB59JT0",

authDomain:
"utkalamart-1ec68.firebaseapp.com",

projectId:
"utkalamart-1ec68",

storageBucket:
"utkalamart-1ec68.firebasestorage.app",

messagingSenderId:
"664871353747",

appId:
"1:664871353747:web:96532fdafe78aabe7f3c66"

};


/* =================================
   FIREBASE START
================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =================================
   ADMIN EMAIL
================================= */

const ADMIN_EMAIL =
"suryakantabehera629@gmail.com";


let allProducts = [];

let selectedProductId = null;


/* =================================
   PASSWORD SHOW / HIDE
================================= */

window.togglePassword = function(){

const input =
document.getElementById("password");

const button =
document.querySelector(".eye");


if(input.type === "password"){

input.type = "text";

button.textContent = "🙈";

}else{

input.type = "password";

button.textContent = "👁️";

}

};


/* =================================
   LOGIN
================================= */

window.loginAdmin = async function(){

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;

const error =
document.getElementById("loginError");

const button =
document.getElementById("loginBtn");


error.style.display = "none";


if(!email || !password){

error.textContent =
"❌ Email ଏବଂ Password ଦିଅନ୍ତୁ।";

error.style.display =
"block";

return;

}


if(
email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

error.textContent =
"❌ ଏହି Email କୁ Admin access ନାହିଁ।";

error.style.display =
"block";

return;

}


button.disabled = true;

button.textContent =
"⏳ Login...";


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(errorObject){

console.error(errorObject);


if(
errorObject.code ===
"auth/invalid-credential"
){

error.textContent =
"❌ Email କିମ୍ବା Password ଭୁଲ।";

}else{

error.textContent =
"❌ " +
errorObject.message;

}


error.style.display =
"block";

}


button.disabled = false;

button.textContent =
"🔐 Login";

};


/* =================================
   AUTH STATE
================================= */

onAuthStateChanged(
auth,
async user => {


if(!user){

document.getElementById(
"loginSection"
).style.display =
"block";

document.getElementById(
"adminSection"
).style.display =
"none";

return;

}


if(
user.email?.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

await signOut(auth);

return;

}


document.getElementById(
"loginSection"
).style.display =
"none";


document.getElementById(
"adminSection"
).style.display =
"block";


document.getElementById(
"adminEmail"
).textContent =
"Admin: " + user.email;


await loadProducts();

});


/* =================================
   LOGOUT
================================= */

window.logoutAdmin =
function(){

return signOut(auth);

};


/* =================================
   LOAD PRODUCTS
================================= */

async function loadProducts(){

const pending =
document.getElementById(
"pendingList"
);

const approved =
document.getElementById(
"approvedList"
);


pending.innerHTML =
'<div class="empty">⏳ Loading...</div>';

approved.innerHTML = "";


try{

allProducts = [];


/* NEW SELLER PRODUCTS */

const productsSnapshot =
await getDocs(
collection(
db,
"products"
)
);


productsSnapshot.forEach(
item => {

allProducts.push({

id:item.id,

source:"products",

...item.data()

});

});


/* OLD PRODUCTS */

const oldSnapshot =
await getDocs(
collection(
db,
"martProducts"
)
);


oldSnapshot.forEach(
item => {

allProducts.push({

id:item.id,

source:"martProducts",

...item.data()

});

});


renderProducts();


}catch(error){

console.error(error);


pending.innerHTML =

`<div class="empty">

❌ Products load ହେଲା ନାହିଁ।

<br><br>

${error.message}

</div>`;

}

}


/* =================================
   STOCK
================================= */

function getStock(product){

return (

product.stock ??

product.stockQty ??

product.quantity ??

product.availableStock ??

0

);

}


/* =================================
   IMAGE
================================= */

function getImage(product){

return (

product.image ||

product.imageUrl ||

"https://via.placeholder.com/600x400?text=Utkala+Mart"

);

}


/* =================================
   PRICE
================================= */

function getPrice(product){

return (

product.price ??

product.utkalaPrice ??

product.sellingPrice ??

0

);

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHtml(value){

return String(value ?? "")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* =================================
   RENDER PRODUCTS
================================= */

window.renderProducts =
function(){

const search =
document.getElementById(
"searchInput"
)
.value
.toLowerCase()
.trim();


let pending = [];

let approved = [];


allProducts.forEach(
product => {


const text = [

product.name,

product.category,

product.categoryName,

product.sellerName,

product.sellerEmail,

product.location,

product.sellerLocation

]

.filter(Boolean)

.join(" ")

.toLowerCase();


if(
search &&
!text.includes(search)
){

return;

}


/* NEW SELLER PRODUCTS */

if(
product.source ===
"products"
){

if(
product.status ===
"pending"
){

pending.push(product);

return;

}


if(

product.status ===
"approved"

&&

product.approved ===
true

&&

product.active ===
true

){

approved.push(product);

return;

}

}


/* OLD PRODUCTS */

if(

product.source ===
"martProducts"

&&

product.active !==
false

){

approved.push(product);

}

});


/* STATS */

document.getElementById(
"totalProducts"
).textContent =
allProducts.length;


document.getElementById(
"pendingProducts"
).textContent =
pending.length;


document.getElementById(
"approvedProducts"
).textContent =
approved.length;


/* PENDING */

document.getElementById(
"pendingList"
).innerHTML =

pending.length

?

pending
.map(createPendingCard)
.join("")

:

`<div class="empty">

🎉 କୌଣସି Pending Product ନାହିଁ।

</div>`;


/* APPROVED */

document.getElementById(
"approvedList"
).innerHTML =

approved.length

?

approved
.map(createApprovedCard)
.join("")

:

`<div class="empty">

କୌଣସି Approved Product ନାହିଁ।

</div>`;

};


/* =================================
   PENDING CARD
================================= */

function createPendingCard(product){

return `

<div class="product">

<img
src="${getImage(product)}"
onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'"
>

<div class="content">

<span class="badge">
🆕 New Seller Product
</span>

<h3>
${escapeHtml(
product.name ||
"Unnamed Product"
)}
</h3>

<div class="info">
📂 Category:
${escapeHtml(
product.categoryName ||
product.category ||
"-"
)}
</div>

<div class="info">
👤 Seller:
${escapeHtml(
product.sellerName ||
product.sellerEmail ||
"-"
)}
</div>

<div class="info">
📍 Location:
${escapeHtml(
product.location ||
product.sellerLocation ||
"-"
)}
</div>

<div class="price">
₹${Number(getPrice(product))}
</div>

<div class="stock stock-ok">
📦 Stock:
${getStock(product)}
</div>

<div class="actions">

<button
class="approve"
onclick="approveProduct('${product.id}')"
>
✅ Approve
</button>

<button
class="reject"
onclick="rejectProduct('${product.id}')"
>
❌ Reject
</button>

</div>

</div>

</div>

`;

}


/* =================================
   APPROVED CARD
================================= */

function createApprovedCard(product){

const stock =
Number(getStock(product));


let stockClass =
"stock-ok";


if(stock <= 0){

stockClass =
"stock-out";

}else if(stock <= 5){

stockClass =
"stock-low";

}


const editButton =

product.source ===
"products"

?

`<button
class="edit"
onclick="openStockModal('${product.id}')"
>
✏️ Edit Stock
</button>`

:

"";


return `

<div class="product">

<img
src="${getImage(product)}"
onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'"
>

<div class="content">

<span class="badge">

${
product.source ===
"martProducts"

?

"📦 Existing Product"

:

"✅ Seller Product"

}

</span>

<h3>
${escapeHtml(
product.name ||
"Unnamed Product"
)}
</h3>

<div class="info">

📂 Category:

${escapeHtml(
product.categoryName ||
product.category ||
"-"
)}

</div>

<div class="price">

₹${Number(
getPrice(product)
)}

</div>

<div class="stock ${stockClass}">

📦 Stock:

${stock}

</div>

<div class="actions">

${editButton}

</div>

</div>

</div>

`;

}


/* =================================
   APPROVE
================================= */

window.approveProduct =
async function(id){

if(
!confirm(
"ଏହି Product କୁ Approve କରିବେ?"
)
){

return;

}


try{

await updateDoc(

doc(
db,
"products",
id
),

{

status:"approved",

approved:true,

active:true

}

);


alert(
"✅ Product Approved!"
);


await loadProducts();


}catch(error){

console.error(error);

alert(
"❌ Approve ହେଲା ନାହିଁ।"
);

}

};


/* =================================
   REJECT
================================= */

window.rejectProduct =
async function(id){

if(
!confirm(
"ଏହି Product କୁ Reject କରିବେ?"
)
){

return;

}


try{

await updateDoc(

doc(
db,
"products",
id
),

{

status:"rejected",

approved:false,

active:false

}

);


alert(
"❌ Product Rejected!"
);


await loadProducts();


}catch(error){

console.error(error);

alert(
"❌ Reject ହେଲା ନାହିଁ।"
);

}

};


/* =================================
   OPEN STOCK MODAL
================================= */

window.openStockModal =
function(id){

const product =
allProducts.find(

item =>

item.id === id &&

item.source ===
"products"

);


if(!product){

alert(
"Product ମିଳିଲା ନାହିଁ।"
);

return;

}


selectedProductId =
id;


document.getElementById(
"stockProductName"
).textContent =

"Product: " +
(product.name || "");


document.getElementById(
"stockInput"
).value =

getStock(product);


document.getElementById(
"stockModal"
).style.display =
"flex";

};


/* =================================
   CLOSE MODAL
================================= */

window.closeStockModal =
function(){

selectedProductId =
null;


document.getElementById(
"stockModal"
).style.display =
"none";

};


/* =================================
   SAVE STOCK
================================= */

window.saveStock =
async function(){

if(!selectedProductId){

return;

}


const value =
Number(
document.getElementById(
"stockInput"
).value
);


if(

!Number.isInteger(value)

||

value < 0

){

alert(
"❌ ଠିକ୍ Stock number ଦିଅନ୍ତୁ।"
);

return;

}


try{

await updateDoc(

doc(
db,
"products",
selectedProductId
),

{

stock:value,

stockQty:value,

quantity:value,

availableStock:value

}

);


alert(
"✅ Stock Update ହୋଇଗଲା।"
);


closeStockModal();


await loadProducts();


}catch(error){

console.error(error);

alert(
"❌ Stock update ହେଲା ନାହିଁ।"
);

}

};


/* =================================
   CLOSE MODAL BY OUTSIDE CLICK
================================= */

window.addEventListener(
"click",
function(event){

const modal =
document.getElementById(
"stockModal"
);


if(
event.target === modal
){

closeStockModal();

}

});

</script>

</body>
</html>
