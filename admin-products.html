<!DOCTYPE html>
<html lang="or">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Utkala Mart - Admin Products</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Oriya",sans-serif;
  background:#f4f7f5;
  color:#333;
}

/* HEADER */

header{
  background:#07845f;
  color:white;
  text-align:center;
  padding:15px 10px;
}

header h1{
  margin:0;
  font-size:22px;
}

header p{
  margin:5px 0 0;
  font-size:13px;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:420px;
  background:white;
  padding:28px 22px;
  border-radius:18px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.loginBox h2{
  text-align:center;
  color:#087d5b;
  margin-top:0;
}

.inputGroup{
  margin-bottom:16px;
}

.inputGroup label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.inputGroup input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
}

.passwordBox{
  position:relative;
}

.passwordBox input{
  padding-right:50px;
}

.eyeBtn{
  position:absolute;
  right:8px;
  top:7px;
  width:38px;
  height:38px;
  border:0;
  background:transparent;
  font-size:20px;
  cursor:pointer;
}

.loginBtn{
  width:100%;
  border:0;
  background:#07845f;
  color:white;
  padding:14px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.loginBtn:disabled{
  opacity:.6;
}

.loginMsg{
  margin-top:15px;
  text-align:center;
  font-size:14px;
}

/* ADMIN */

#adminPage{
  display:none;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.adminTop{
  background:white;
  border-radius:15px;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.adminTop h2{
  margin:0;
  color:#087d5b;
  font-size:20px;
}

.adminEmail{
  font-size:13px;
  margin-top:4px;
}

.logoutBtn{
  background:#dc3545;
  color:white;
  border:0;
  padding:11px 17px;
  border-radius:9px;
  font-weight:bold;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:15px 0;
}

.stat{
  background:white;
  padding:18px 10px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.statNumber{
  font-size:26px;
  font-weight:bold;
  color:#07845f;
}

.statLabel{
  font-size:13px;
}

/* SEARCH */

.searchBox{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
  margin-bottom:15px;
}

/* SECTION */

.sectionTitle{
  background:#07845f;
  color:white;
  padding:12px;
  border-radius:10px 10px 0 0;
  font-size:17px;
  font-weight:bold;
  margin-top:18px;
}

.empty{
  background:white;
  padding:25px;
  text-align:center;
  border-radius:0 0 10px 10px;
  color:#777;
}

/* PRODUCTS */

.productsGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:0;
}

.productCard{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.09);
}

.productImage{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eee;
  display:block;
}

.productBody{
  padding:14px;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  background:#e7f5ef;
  color:#087d5b;
  font-size:12px;
  font-weight:bold;
  margin-bottom:8px;
}

.productBody h3{
  margin:4px 0 9px;
  color:#087d5b;
  font-size:18px;
}

.info{
  font-size:14px;
  line-height:1.7;
}

.price{
  color:#e65100;
  font-size:18px;
  font-weight:bold;
  margin-top:5px;
}

.stock{
  font-weight:bold;
  margin-top:5px;
}

.stockOk{
  color:#087d5b;
}

.stockLow{
  color:#d88900;
}

.stockOut{
  color:#dc3545;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  flex:1;
  border:0;
  padding:10px 7px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.approveBtn{
  background:#07845f;
  color:white;
}

.rejectBtn{
  background:#dc3545;
  color:white;
}

.editBtn{
  background:#1769aa;
  color:white;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:1000;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modalBox{
  width:100%;
  max-width:400px;
  background:white;
  border-radius:15px;
  padding:22px;
}

.modalBox h3{
  margin-top:0;
  color:#087d5b;
}

.modalBox input{
  width:100%;
  padding:13px;
  border:1px solid #bbb;
  border-radius:9px;
  font-size:17px;
}

.modalActions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.modalActions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:9px;
  font-weight:bold;
}

.saveBtn{
  background:#07845f;
  color:white;
}

.cancelBtn{
  background:#777;
  color:white;
}

/* LOADING */

.loading{
  padding:20px;
  background:white;
  text-align:center;
  border-radius:10px;
}

.errorBox{
  padding:18px;
  background:#fff0f0;
  color:#b00020;
  border-radius:10px;
  margin-top:10px;
}

/* MOBILE */

@media(max-width:800px){

  .productsGrid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .productsGrid{
    grid-template-columns:1fr;
  }

  .adminTop{
    align-items:flex-start;
  }

  .adminTop h2{
    font-size:17px;
  }

  .logoutBtn{
    padding:9px 12px;
  }

  .productImage{
    height:210px;
  }

}

</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage">

  <div class="loginBox">

    <h2>🛒 Utkala Mart</h2>

    <p style="text-align:center;">
      Admin Product Management
    </p>

    <div class="inputGroup">

      <label>📧 Admin Email</label>

      <input
        id="email"
        type="email"
        value="suryakantabehera629@gmail.com"
        autocomplete="username"
      >

    </div>

    <div class="inputGroup">

      <label>🔐 Password</label>

      <div class="passwordBox">

        <input
          id="password"
          type="password"

<!-- =========================

<div id="adminPage">

<header>

  <h1>🛒 Utkala Mart</h1>

  <p>Admin Product Management</p>

</header>


<div class="container">

  <div class="adminTop">

    <div>

      <h2>📦 Product Management</h2>

<!-- =========================

>

<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDonHK2CtrUjAkAaro6stnJmdDUwB59JT0",

  authDomain:
    "utkalamart-1ec68.firebaseapp.com",

  projectId:
    "utkalamart-1ec68",

  storageBucket:
    "utkalamart-1ec68.firebasestorage.app",

  messagingSenderId:
    "664871353747",

  appId:
    "1:664871353747:web:96532fdafe78aabe7f3c66"

};


/* =========================
   FIREBASE INIT
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   ADMIN EMAIL
========================= */

const ADMIN_EMAIL =
  "suryakantabehera629@gmail.com";


/* =========================
   ELEMENTS
========================= */

const loginPage =
  document.getElementById("loginPage");

const adminPage =
  document.getElementById("adminPage");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const eyeBtn =
  document.getElementById("eyeBtn");

const loginBtn =
  document.getElementById("loginBtn");

const loginMsg =
  document.getElementById("loginMsg");

const logoutBtn =
  document.getElementById("logoutBtn");

const adminEmail =
  document.getElementById("adminEmail");

const searchBox =
  document.getElementById("searchBox");

const pendingArea =
  document.getElementById("pendingArea");

const approvedArea =
  document.getElementById("approvedArea");

const totalCount =
  document.getElementById("totalCount");

const pendingCount =
  document.getElementById("pendingCount");

const approvedCount =
  document.getElementById("approvedCount");

const stockModal =
  document.getElementById("stockModal");

const stockInput =
  document.getElementById("stockInput");

const stockProductName =
  document.getElementById("stockProductName");

const saveStockBtn =
  document.getElementById("saveStockBtn");

const cancelStockBtn =
  document.getElementById("cancelStockBtn");


/* =========================
   DATA
========================= */

let allProducts = [];

let currentStockProduct = null;


/* =========================
   PASSWORD SHOW / HIDE
========================= */

eyeBtn.addEventListener(
  "click",
  function(){

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      eyeBtn.textContent =
        "🙈";

    }else{

      passwordInput.type =
        "password";

      eyeBtn.textContent =
        "👁️";

    }

  }
);


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
  "click",
  async function(){

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if(!email){

      loginMsg.textContent =
        "❌ Email ଦିଅନ୍ତୁ।";

      return;

    }

    if(!password){

      loginMsg.textContent =
        "❌ Password ଦିଅନ୍ତୁ।";

      return;

    }

    loginBtn.disabled = true;

    loginBtn.textContent =
      "⏳ Login...";

    loginMsg.textContent = "";

    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }catch(error){

      console.error(error);

      loginMsg.innerHTML =
        "❌ Login failed:<br>" +
        getFirebaseError(error);

    }

    loginBtn.disabled = false;

    loginBtn.textContent =
      "🔐 Login";

  }
);


/* =========================
   FIREBASE ERROR
========================= */

function getFirebaseError(error){

  const code =
    error?.code || "";

  if(
    code.includes("invalid-api-key")
  ){

    return `
      Firebase API Key invalid।
      Firebase Console ର Web API Key
      ଯାଞ୍ଚ କରନ୍ତୁ।
    `;

  }

  if(
    code.includes(
      "invalid-credential"
    )
  ){

    return `
      Email କିମ୍ବା Password ଭୁଲ।
    `;

  }

  if(
    code.includes(
      "user-not-found"
    )
  ){

    return `
      ଏହି Email ର Firebase user ନାହିଁ।
    `;

  }

  if(
    code.includes(
      "wrong-password"
    )
  ){

    return `
      Password ଭୁଲ।
    `;

  }

  if(
    code.includes(
      "too-many-requests"
    )
  ){

    return `
      ବହୁତଥର Login ଚେଷ୍ଟା ହୋଇଛି।
      କିଛି ସମୟ ପରେ ପୁଣି try କରନ୍ତୁ।
    `;

  }

  return (
    error?.message ||
    "Unknown Firebase error"
  );

}


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async function(user){

    if(!user){

      loginPage.style.display =
        "flex";

      adminPage.style.display =
        "none";

      return;

    }


    /* ADMIN EMAIL CHECK */

    if(
      user.email?.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ){

      await signOut(auth);

      loginMsg.innerHTML =
        "❌ ଏହି account କୁ Admin access ନାହିଁ।";

      return;

    }


    /* SHOW ADMIN */

    loginPage.style.display =
      "none";

    adminPage.style.display =
      "block";

    adminEmail.textContent =
      user.email;


    await loadProducts();

  }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
  "click",
  async function(){

    await signOut(auth);

  }
);


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  pendingArea.innerHTML =
    `<div class="loading">
      ⏳ Products loading...
    </div>`;

  approvedArea.innerHTML =
    `<div class="loading">
      ⏳ Products loading...
    </div>`;


  allProducts = [];


  try{

    /* SELLER PRODUCTS */

    const productSnapshot =
      await getDocs(
        collection(
          db,
          "products"
        )
      );


    productSnapshot.forEach(
      function(productDoc){

        const data =
          productDoc.data();

        allProducts.push({

          id:
            productDoc.id,

          source:
            "products",

          ...data

        });

      }
    );


    /* OLD MART PRODUCTS */

    const martSnapshot =
      await getDocs(
        collection(
          db,
          "martProducts"
        )
      );


    martSnapshot.forEach(
      function(productDoc){

        const data =
          productDoc.data();

        allProducts.push({

          id:
            productDoc.id,

          source:
            "martProducts",

          ...data

        });

      }
    );


    updateStats();

    renderProducts();

  }catch(error){

    console.error(error);

    pendingArea.innerHTML =
      `<div class="errorBox">
        ❌ Products load ହେଲା ନାହିଁ।
        <br><br>
        Firebase Firestore permission denied।
        <br>
        Firestore Rules ଯାଞ୍ଚ କରନ୍ତୁ।
      </div>`;

    approvedArea.innerHTML = "";

  }

}


/* =========================
   STOCK
========================= */

function getStock(product){

  return Number(
    product.stock ??
    product.stockQty ??
    product.quantity ??
    product.availableStock ??
    0
  );

}


/* =========================
   PRICE
========================= */

function getPrice(product){

  return Number(
    product.price ??
    product.utkalaPrice ??
    product.sellingPrice ??
    0
  );

}


/* =========================
   IMAGE
========================= */

function getImage(product){

  return (
    product.image ||
    product.imageUrl ||
    product.photo ||
    "https://via.placeholder.com/600x400?text=No+Image"
  );

}


/* =========================
   NAME
========================= */

function getName(product){

  return (
    product.name ||
    product.productName ||
    "Unnamed Product"
  );

}


/* =========================
   CATEGORY
========================= */

function getCategory(product){

  return (
    product.categoryName ||
    product.category ||
    "-"
  );

}


/* =========================
   SELLER
========================= */

function getSeller(product){

  return (
    product.sellerName ||
    product.sellerEmail ||
    product.sellerLocation ||
    product.location ||
    "-"
  );

}


/* =========================
   APPROVED CHECK
========================= */

function isApproved(product){

  if(
    product.source ===
    "martProducts"
  ){

    return true;

  }


  return (
    product.status ===
      "approved" &&

    product.approved ===
      true &&

    product.active ===
      true
  );

}


/* =========================
   PENDING CHECK
========================= */

function isPending(product){

  return (
    product.source ===
      "products" &&

    product.status ===
      "pending"
  );

}


/* =========================
   STATS
========================= */

function updateStats(){

  const pending =
    allProducts.filter(
      isPending
    );

  const approved =
    allProducts.filter(
      isApproved
    );


  totalCount.textContent =
    allProducts.length;

  pendingCount.textContent =
    pending.length;

  approvedCount.textContent =
    approved.length;

}


/* =========================
   SEARCH
========================= */

searchBox.addEventListener(
  "input",
  function(){

    renderProducts();

  }
);


/* =========================
   RENDER
========================= */

function renderProducts(){

  const search =
    searchBox.value
      .trim()
      .toLowerCase();


  let pending =
    allProducts.filter(
      isPending
    );

  let approved =
    allProducts.filter(
      isApproved
    );


  if(search){

    pending =
      pending.filter(
        productMatches
      );

    approved =
      approved.filter(
        productMatches
      );

  }


  renderPending(
    pending
  );

  renderApproved(
    approved
  );

}


/* =========================
   SEARCH MATCH
========================= */

function productMatches(product){

  const text = (

    getName(product) +
    " " +
    getCategory(product) +
    " " +
    getSeller(product)

  ).toLowerCase();


  return text.includes(
    searchBox.value
      .trim()
      .toLowerCase()
  );

}


/* =========================
   PENDING RENDER
========================= */

function renderPending(products){

  if(!products.length){

    pendingArea.innerHTML =
      `<div class="empty">
        🎉 କୌଣସି Pending Product ନାହିଁ
      </div>`;

    return;

  }


  const grid =
    document.createElement(
      "div"
    );

  grid.className =
    "productsGrid";


  products.forEach(
    function(product){

      grid.appendChild(
        createPendingCard(
          product
        )
      );

    }
  );


  pendingArea.innerHTML = "";

  pendingArea.appendChild(
    grid
  );

}


/* =========================
   PENDING CARD
========================= */

function createPendingCard(product){

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "productCard";


  card.innerHTML = `

    <img
      class="productImage"
      src="${getImage(product)}"
      alt=""
    >

    <div class="productBody">

      <span class="badge">
        ⏳ Pending Seller Product
      </span>

      <h3>
        ${escapeHtml(
          getName(product)
        )}
      </h3>

      <div class="info">
        📁 Category:
        ${escapeHtml(
          getCategory(product)
        )}
      </div>

      <div class="info">
        👤 Seller:
        ${escapeHtml(
          getSeller(product)
        )}
      </div>

      <div class="price">
        ₹${getPrice(product)}
      </div>

      <div class="stock">
        📦 Stock:
        ${getStock(product)}
      </div>

      <div class="actions">

        <button
          class="approveBtn"
          data-action="approve"
        >
          ✅ Approve
        </button>

        <button
          class="rejectBtn"
          data-action="reject"
        >
          ❌ Reject
        </button>

      </div>

    </div>
  `;


  card
    .querySelector(
      '[data-action="approve"]'
    )
    .addEventListener(
      "click",
      function(){

        approveProduct(
          product
        );

      }
    );


  card
    .querySelector(
      '[data-action="reject"]'
    )
    .addEventListener(
      "click",
      function(){

        rejectProduct(
          product
        );

      }
    );


  return card;

}


/* =========================
   APPROVED RENDER
========================= */

function renderApproved(products){

  if(!products.length){

    approvedArea.innerHTML =
      `<div class="empty">
        କୌଣସି Approved Product ନାହିଁ
      </div>`;

    return;

  }


  const grid =
    document.createElement(
      "div"
    );

  grid.className =
    "productsGrid";


  products.forEach(
    function(product){

      grid.appendChild(
        createApprovedCard(
          product
        )
      );

    }
  );


  approvedArea.innerHTML = "";

  approvedArea.appendChild(
    grid
  );

}


/* =========================
   APPROVED CARD
========================= */

function createApprovedCard(product){

  const stock =
    getStock(product);


  let stockClass =
    "stockOk";

  if(stock <= 0){

    stockClass =
      "stockOut";

  }else if(stock <= 5){

    stockClass =
      "stockLow";

  }


  const card =
    document.createElement(
      "div"
    );

  card.className =
    "productCard";


  card.innerHTML = `

    <img
      class="productImage"
      src="${getImage(product)}"
      alt=""
    >

    <div class="productBody">

      <span class="badge">

        ${
          product.source ===
          "martProducts"

          ? "📦 Existing Product"

          : "✅ Seller Product"

        }

      </span>

      <h3>
        ${escapeHtml(
          getName(product)
        )}
      </h3>

      <div class="info">
        📁 Category:
        ${escapeHtml(
          getCategory(product)
        )}
      </div>

      <div class="info">
        👤 Seller:
        ${escapeHtml(
          getSeller(product)
        )}
      </div>

      <div class="price">
        ₹${getPrice(product)}
      </div>

      <div class="stock ${stockClass}">
        📦 Stock:
        ${stock}
      </div>

      <div class="actions">

        <button
          class="editBtn"
        >
          ✏️ Edit Stock
        </button>

      </div>

    </div>
  `;


  card
    .querySelector(
      ".editBtn"
    )
    .addEventListener(
      "click",
      function(){

        openStockModal(
          product
        );

      }
    );


  return card;

}


/* =========================
   APPROVE
========================= */

async function approveProduct(product){

  if(
    !confirm(
      "ଏହି Product କୁ Approve କରିବେ?"
    )
  ){

    return;

  }


  try{

    await updateDoc(

      doc(
        db,
        "products",
        product.id
      ),

      {
        status:
          "approved",

        approved:
          true,

        active:
          true
      }

    );


    alert(
      "✅ Product Approved!"
    );


    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "❌ Approve failed:\n" +
      getFirebaseError(error)
    );

  }

}


/* =========================
   REJECT
========================= */

async function rejectProduct(product){

  if(
    !confirm(
      "ଏହି Product କୁ Reject କରିବେ?"
    )
  ){

    return;

  }


  try{

    await updateDoc(

      doc(
        db,
        "products",
        product.id
      ),

      {
        status:
          "rejected",

        approved:
          false,

        active:
          false
      }

    );


    alert(
      "❌ Product Rejected!"
    );


    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "❌ Reject failed:\n" +
      getFirebaseError(error)
    );

  }

}


/* =========================
   STOCK MODAL
========================= */

function openStockModal(product){

  currentStockProduct =
    product;

  stockProductName.textContent =
    "Product: " +
    getName(product);

  stockInput.value =
    getStock(product);

  stockModal.style.display =
    "flex";

  stockInput.focus();

}


function closeStockModal(){

  stockModal.style.display =
    "none";

  currentStockProduct =
    null;

}


/* CANCEL */

cancelStockBtn.addEventListener(
  "click",
  function(){

    closeStockModal();

  }
);


/* SAVE STOCK */

saveStockBtn.addEventListener(
  "click",
  async function(){

    if(
      !currentStockProduct
    ){

      return;

    }


    const value =
      Number(
        stockInput.value
      );


    if(
      !Number.isInteger(value) ||
      value < 0
    ){

      alert(
        "❌ Valid stock number ଦିଅନ୍ତୁ।"
      );

      return;

    }


    saveStockBtn.disabled =
      true;

    saveStockBtn.textContent =
      "⏳ Saving...";


    try{

      await updateDoc(

        doc(
          db,
          currentStockProduct.source,
          currentStockProduct.id
        ),

        {

          stock:
            value,

          stockQty:
            value,

          quantity:
            value,

          availableStock:
            value

        }

      );


      alert(
        "✅ Stock updated successfully!"
      );


      closeStockModal();

      await loadProducts();

    }catch(error){

      console.error(error);

      alert(
        "❌ Stock update failed:\n" +
        getFirebaseError(error)
      );

    }


    saveStockBtn.disabled =
      false;

    saveStockBtn.textContent =
      "💾 Save Stock";

  }
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
