<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Utkala Mart - Admin Products</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Oriya",sans-serif;
  background:#f3f6f4;
  color:#222;
}

header{
  background:#087f5b;
  color:white;
  padding:18px 20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  opacity:.9;
}

.container{
  width:95%;
  max-width:1100px;
  margin:25px auto;
}

/* LOGIN */

.login-box{
  max-width:500px;
  margin:50px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.login-box h2{
  text-align:center;
  color:#087f5b;
  font-size:30px;
}

.input-group{
  margin:18px 0;
}

.input-group label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

.input-group input{
  width:100%;
  padding:15px;
  font-size:17px;
  border:2px solid #ddd;
  border-radius:12px;
  outline:none;
}

.input-group input:focus{
  border-color:#087f5b;
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:55px;
}

.password-toggle{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  font-size:25px;
  cursor:pointer;
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn{
  width:100%;
  background:#087f5b;
  color:white;
  padding:15px;
  font-size:18px;
}

.login-btn:hover{
  background:#056b4c;
}

.logout-btn{
  background:#dc3545;
  color:white;
}

/* ADMIN */

.admin-top{
  background:white;
  padding:18px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.admin-top h2{
  margin:0;
  color:#087f5b;
}

.search-box{
  width:100%;
  margin:20px 0;
}

.search-box input{
  width:100%;
  padding:14px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:20px;
  text-align:center;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.stat strong{
  display:block;
  font-size:30px;
  color:#087f5b;
}

/* SECTION */

.section{
  margin-top:30px;
}

.section-title{
  background:#087f5b;
  color:white;
  padding:15px 18px;
  border-radius:12px 12px 0 0;
  font-size:21px;
  font-weight:bold;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-top:18px;
}

.product-card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.1);
}

.product-image{
  width:100%;
  height:230px;
  object-fit:cover;
  background:#eee;
}

.product-content{
  padding:18px;
}

.product-content h3{
  margin:0 0 10px;
  font-size:22px;
  color:#087f5b;
}

.info{
  margin:7px 0;
  line-height:1.5;
}

.price{
  font-size:20px;
  font-weight:bold;
  color:#e65100;
}

.stock{
  font-size:18px;
  font-weight:bold;
}

.stock.ok{
  color:#087f5b;
}

.stock.low{
  color:#e67700;
}

.stock.out{
  color:#dc3545;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.approve{
  background:#087f5b;
  color:white;
}

.reject{
  background:#dc3545;
  color:white;
}

.edit{
  background:#1565c0;
  color:white;
}

.empty{
  background:white;
  padding:30px;
  text-align:center;
  border-radius:12px;
  color:#666;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:rgba(0,0,0,.65);
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:420px;
  background:white;
  padding:25px;
  border-radius:18px;
}

.modal-box h3{
  margin-top:0;
  color:#087f5b;
}

.modal-box input{
  width:100%;
  padding:14px;
  font-size:18px;
  border:2px solid #ddd;
  border-radius:10px;
  margin:12px 0;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.save-stock{
  background:#087f5b;
  color:white;
  flex:1;
}

.cancel-stock{
  background:#777;
  color:white;
  flex:1;
}

/* ERROR */

.error{
  display:none;
  margin-top:18px;
  padding:15px;
  background:#ffe5e5;
  color:#b00020;
  border-radius:12px;
  font-weight:bold;
  line-height:1.5;
}

.success{
  display:none;
  margin-top:18px;
  padding:15px;
  background:#e3f8ed;
  color:#087f5b;
  border-radius:12px;
  font-weight:bold;
}

/* LOADING */

.loading{
  text-align:center;
  padding:30px;
  font-size:18px;
}

/* MOBILE */

@media(max-width:700px){

  header h1{
    font-size:23px;
  }

  .container{
    width:94%;
  }

  .login-box{
    margin:25px auto;
    padding:22px;
  }

  .admin-top{
    flex-direction:column;
    align-items:stretch;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr;
  }

  .product-image{
    height:220px;
  }

  .actions .btn{
    flex:1;
    min-width:100px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛒 Utkala Mart</h1>
  <p>Admin Product Management</p>
</header>

<div class="container">

  <!-- LOGIN -->

  <div id="loginSection" class="login-box">

    <h2>🔐 Admin Login</h2>

    <div class="input-group">
      <label>📧 Admin Email</label>
      <input
        type="email"
        id="email"
        value="suryakantabehera629@gmail.com"
        autocomplete="username"
      >
    </div>

    <div class="input-group">

      <label>🔑 Password</label>

      <div class="password-wrap">

        <input
          type="password"
          id="password"

        >

        <button

</div>


<!-- STOCK MODAL -->

<div id="stockModal" class="modal">

  <div class="modal-box">

    <h3>✏️ Edit Stock</h3>

    <div id="stockProductName"></div>

    <input
      type="number"
      id="newStock"
      min="0"

    >

    <div class="modal-actions">

      <button
        class="btn save-stock"

        💾 Save

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {

  apiKey:
   " AIzaSyDonHK2CtrUjAkAaro6stnJmdDUwB59JT0",

  authDomain:
    "utkalamart-1ec68.firebaseapp.com",

  projectId:
    "utkalamart-1ec68",

  storageBucket:
    "utkalamart-1ec68.firebasestorage.app",

  messagingSenderId:
    "664871353747",

  appId:
    "1:664871353747:web:96532fdafe78aabe7f3c66"

};


/* =========================================================
   FIREBASE INIT
   ========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   ADMIN EMAIL
   ========================================================= */

const ADMIN_EMAIL =
  "suryakantabehera629@gmail.com";


/* =========================================================
   VARIABLES
   ========================================================= */

let allProducts = [];

let selectedProductId = null;


/* =========================================================
   PASSWORD SHOW / HIDE
   ========================================================= */

window.togglePassword = function(){

  const password =
    document.getElementById("password");

  const button =
    document.querySelector(".password-toggle");

  if(password.type === "password"){

    password.type = "text";

    button.textContent = "🙈";

  }else{

    password.type = "password";

    button.textContent = "👁️";

  }

};


/* =========================================================
   LOGIN
   ========================================================= */

window.loginAdmin = async function(){

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;

  const errorBox =
    document.getElementById("loginError");

  const loginBtn =
    document.getElementById("loginBtn");


  errorBox.style.display = "none";


  if(!email || !password){

    errorBox.textContent =
      "ଦୟାକରି Email ଏବଂ Password ଦିଅନ୍ତୁ।";

    errorBox.style.display = "block";

    return;

  }


  if(email.toLowerCase() !==
     ADMIN_EMAIL.toLowerCase()){

    errorBox.textContent =
      "ଏହି Email କୁ Admin access ନାହିଁ।";

    errorBox.style.display = "block";

    return;

  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    "⏳ Login...";


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    let message =
      error?.message || "Login failed";


    if(
      error.code ===
      "auth/api-key-not-valid"
    ){

      message =
        "Firebase API Key valid ନୁହେଁ। API key 2 settings ଯାଞ୍ଚ କରନ୍ତୁ।";

    }

    else if(
      error.code ===
      "auth/invalid-credential"
    ){

      message =
        "Email କିମ୍ବା Password ଭୁଲ ଅଛି।";

    }

    else if(
      error.code ===
      "auth/user-not-found"
    ){

      message =
        "ଏହି Email ର Firebase user ମିଳିଲା ନାହିଁ।";

    }

    else if(
      error.code ===
      "auth/wrong-password"
    ){

      message =
        "Password ଭୁଲ ଅଛି।";

    }

    else if(
      error.code ===
      "auth/too-many-requests"
    ){

      message =
        "ଅଧିକଥର Login try ହୋଇଛି। କିଛି ସମୟ ପରେ try କରନ୍ତୁ।";

    }


    errorBox.textContent =
      "❌ " + message;

    errorBox.style.display =
      "block";

  }


  loginBtn.disabled = false;

  loginBtn.textContent =
    "🔐 Login";

};


/* =========================================================
   AUTH STATE
   ========================================================= */

onAuthStateChanged(
  auth,
  async(user) => {

    if(user){

      if(
        user.email?.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ){

        await signOut(auth);

        return;

      }


      document.getElementById(
        "loginSection"
      ).style.display = "none";


      document.getElementById(
        "adminSection"
      ).style.display = "block";


      document.getElementById(
        "adminEmailText"
      ).textContent =
        "Admin: " + user.email;


      await loadProducts();

    }else{

      document.getElementById(
        "loginSection"
      ).style.display = "block";


      document.getElementById(
        "adminSection"
      ).style.display = "none";

    }

  }
);


/* =========================================================
   LOGOUT
   ========================================================= */

window.logoutAdmin = async function(){

  await signOut(auth);

};


/* =========================================================
   LOAD PRODUCTS
   ========================================================= */

async function loadProducts(){

  const pendingList =
    document.getElementById("pendingList");

  const approvedList =
    document.getElementById("approvedList");


  pendingList.innerHTML =
    '<div class="loading">⏳ Loading products...</div>';

  approvedList.innerHTML =
    '<div class="loading">⏳ Loading products...</div>';


  try{

    const snapshot =
      await getDocs(
        collection(db,"products")
      );


    allProducts = [];


    snapshot.forEach((productDoc) => {

      allProducts.push({

        id: productDoc.id,

        ...productDoc.data()

      });

    });


    renderProducts();

  }catch(error){

    console.error(
      "Products loading error:",
      error
    );


    const message =
      getFirebaseErrorMessage(error);


    pendingList.innerHTML =
      `<div class="empty">
        ❌ Products load ହେଲା ନାହିଁ.<br><br>
        ${message}
      </div>`;


    approvedList.innerHTML = "";

  }

}


/* =========================================================
   RENDER PRODUCTS
   ========================================================= */

function renderProducts(){

  const pendingList =
    document.getElementById("pendingList");

  const approvedList =
    document.getElementById("approvedList");


  const search =
    document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  let pending = [];

  let approved = [];


  allProducts.forEach(p => {

    const dataText = [

      p.name,

      p.category,

      p.categoryName,

      p.sellerName,

      p.sellerEmail,

      p.location,

      p.sellerLocation

    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();


    if(
      search &&
      !dataText.includes(search)
    ){

      return;

    }


    const hasApprovalFields =
      p.status !== undefined ||
      p.approved !== undefined ||
      p.active !== undefined;


    const isPending =
      p.status === "pending";


    const isApproved =
      p.status === "approved" &&
      p.approved === true &&
      p.active === true;


    /*
      OLD PRODUCTS SUPPORT

      If product has no approval fields,
      treat it as an old/legacy product.
    */

    const isOldProduct =
      !hasApprovalFields &&
      p.active !== false;


    if(isPending){

      pending.push(p);

    }

    else if(
      isApproved ||
      isOldProduct
    ){

      approved.push(p);

    }

  });


  document.getElementById(
    "totalProducts"
  ).textContent =
    allProducts.length;


  document.getElementById(
    "pendingProducts"
  ).textContent =
    pending.length;


  document.getElementById(
    "approvedProducts"
  ).textContent =
    approved.length;


  /* PENDING */

  if(pending.length === 0){

    pendingList.innerHTML =
      `<div class="empty">
        🎉 କୌଣସି Pending Product ନାହିଁ।
      </div>`;

  }else{

    pendingList.innerHTML =
      pending
        .map(productCardPending)
        .join("");

  }


  /* APPROVED */

  if(approved.length === 0){

    approvedList.innerHTML =
      `<div class="empty">
        କୌଣସି Approved Product ନାହିଁ।
      </div>`;

  }else{

    approvedList.innerHTML =
      approved
        .map(productCardApproved)
        .join("");

  }

}


/* =========================================================
   PENDING CARD
   ========================================================= */

function productCardPending(p){

  const stock =
    getStock(p);


  return `

  <div class="product-card">

    <img
      class="product-image"
      src="${safe(p.image || p.imageUrl)}"
      onerror="this.src='https://via.placeholder.com/600x400?text=Utkala+Mart'"
      alt="${safe(p.name || "Product")}"
    >

    <div class="product-content">

      <h3>
        ${safe(p.name || "Unnamed Product")}
      </h3>

      <div class="info">
        <b>Category:</b>
        ${safe(p.category || p.categoryName || "-")}
      </div>

      <div class="info">
        <b>Weight:</b>
        ${safe(p.weight || "-")}
        ${safe(p.weightUnit || p.unit || "")}
      </div>

      <div class="info price">
        ₹${Number(
          p.price ??
          p.utkalaPrice ??
          p.sellingPrice ??
          0
        )}
      </div>

      <div class="info stock">
        📦 Stock:
        ${stock}
      </div>

      <div class="info">
        <b>Seller:</b>
        ${safe(p.sellerName || "-")}
      </div>

      <div class="info">
        <b>Location:</b>
        ${safe(
          p.location ||
          p.sellerLocation ||
          "-"
        )}
      </div>

      <div class="info">
        <b>Status:</b>
        ⏳ Pending
      </div>

      <div class="actions">

        <button
          class="btn approve"
          onclick="approveProduct('${p.id}')"
        >
          ✅ Approve
        </button>

        <button
          class="btn reject"
          onclick="rejectProduct('${p.id}')"
        >
          ❌ Reject
        </button>

      </div>

    </div>

  </div>

  `;

}


/* =========================================================
   APPROVED CARD
   ========================================================= */

function productCardApproved(p){

  const stock =
    getStock(p);


  let stockClass =
    "ok";


  if(stock <= 0){

    stockClass = "out";

  }

  else if(stock <= 5){

    stockClass = "low";

  }


  return `

  <div class="product-card">

    <img
      class="product-image"
      src="${safe(p.image || p.imageUrl)}"
      onerror="this.src='https://via.placeholder.com/600x400?text=Utkala+Mart'"
      alt="${safe(p.name || "Product")}"
    >

    <div class="product-content">

      <h3>
        ${safe(p.name || "Unnamed Product")}
      </h3>

      <div class="info">
        <b>Category:</b>
        ${safe(p.category || p.categoryName || "-")}
      </div>

      <div class="info price">
        ₹${Number(
          p.price ??
          p.utkalaPrice ??
          p.sellingPrice ??
          0
        )}
      </div>

      <div class="info">
        <b>Seller Price:</b>
        ₹${Number(
          p.sellerPrice ??
          0
        )}
      </div>

      <div class="info stock ${stockClass}">
        📦 Stock:
        ${stock}
      </div>

      <div class="info">
        <b>Seller:</b>
        ${safe(p.sellerName || "-")}
      </div>

      <div class="info">
        <b>Location:</b>
        ${safe(
          p.location ||
          p.sellerLocation ||
          "-"
        )}
      </div>

      <div class="info">
        <b>Status:</b>
        ✅ Approved
      </div>

      <div class="actions">

        <button
          class="btn edit"
          onclick="openStockModal(
            '${p.id}',
            '${escapeJs(p.name || "Product")}',
            ${stock}
          )"
        >
          ✏️ Edit Stock
        </button>

      </div>

    </div>

  </div>

  `;

}


/* =========================================================
   GET STOCK
   ========================================================= */

function getStock(p){

  const value =
    p.stock ??
    p.stockQty ??
    p.quantity ??
    p.availableStock ??
    0;


  const number =
    Number(value);


  if(
    !Number.isFinite(number) ||
    number < 0
  ){

    return 0;

  }


  return number;

}


/* =========================================================
   APPROVE
   ========================================================= */

window.approveProduct =
async function(productId){

  const product =
    allProducts.find(
      p => p.id === productId
    );


  if(!product){

    alert(
      "Product ମିଳିଲା ନାହିଁ।"
    );

    return;

  }


  const yes =
    confirm(
      `"${product.name || "Product"}" କୁ Approve କରିବେ କି?`
    );


  if(!yes) return;


  try{

    await updateDoc(
      doc(db,"products",productId),
      {

        status:"approved",

        approved:true,

        active:true

      }
    );


    alert(
      "✅ Product Approved!"
    );


    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "❌ Approve failed:\n" +
      getFirebaseErrorMessage(error)
    );

  }

};


/* =========================================================
   REJECT
   ========================================================= */

window.rejectProduct =
async function(productId){

  const product =
    allProducts.find(
      p => p.id === productId
    );


  if(!product) return;


  const yes =
    confirm(
      `"${product.name || "Product"}" କୁ Reject କରିବେ କି?`
    );


  if(!yes) return;


  try{

    await updateDoc(
      doc(db,"products",productId),
      {

        status:"rejected",

        approved:false,

        active:false

      }
    );


    alert(
      "❌ Product Rejected!"
    );


    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Reject failed:\n" +
      getFirebaseErrorMessage(error)
    );

  }

};

    "stockModal"
  ).style.display =

/* =========================================================
   SAVE STOCK
   ========================================================= */

window.saveStock =
async function(){

  if(!selectedProductId){

    alert(
      "Product select ହୋଇନାହିଁ।"
    );

    return;

  }


  const input =
    document.getElementById(
      "newStock"
    );


  const stock =
    Number(input.value);


  if(
    !Number.isInteger(stock) ||
    stock < 0
  ){

    alert(
      "ଦୟାକରି 0 କିମ୍ବା ତାଠାରୁ ବଡ଼ valid stock ଦିଅନ୍ତୁ।"
    );

    return;

  }


  try{

    await updateDoc(
      doc(
        db,
        "products",
        selectedProductId
      ),
      {

        stock:stock,

        stockQty:stock,

        quantity:stock,

        availableStock:stock

      }
    );


    alert(
      "✅ Stock updated successfully!"
    );


    closeStockModal();

    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "❌ Stock update failed:\n" +
      getFirebaseErrorMessage(error)
    );

  }

};

/* =========================================================
   FIREBASE ERROR
   ========================================================= */

function getFirebaseErrorMessage(error){

  if(!error){

    return "Unknown error";

  }


  if(
    error.code ===
    "permission-denied"
  ){

    return `
      Firebase Firestore permission denied.
      <br>
      Firestore API / Security Rules ଯାଞ୍ଚ କରନ୍ତୁ।
    `;

  }


  if(
    error.code ===
    "auth/api-key-not-valid"
  ){

    return `
      API key valid ନୁହେଁ।
      <br>
      Google Cloud API key settings ଯାଞ୍ଚ କରନ୍ତୁ।
    `;

  }


  return (
    error.message ||
    error.code ||
    "Firebase error"
  );

}


/* =========================================================
   HTML SAFE
   ========================================================= */

function safe(value){

  if(value === undefined ||
     value === null){

    return "";

  }


  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================================================
   JAVASCRIPT SAFE
   ========================================================= */

function escapeJs(value){

  return String(value)

    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n"," ")
    .replaceAll("\r"," ");

}
