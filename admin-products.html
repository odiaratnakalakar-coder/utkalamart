<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Utkala Mart - Admin Products</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0}
header{background:#075b3b;color:#fff;padding:16px;text-align:center;font-size:22px;font-weight:bold}
.wrap{max-width:950px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.row{display:flex;gap:14px;align-items:center}
img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#eee}
.btn{border:0;padding:10px 16px;border-radius:8px;font-weight:bold;color:#fff;cursor:pointer}
.ok{background:#0a8755}.no{background:#d9272e}.login{background:#ef761d;width:100%;margin-top:10px}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:6px 0}
.hidden{display:none}
small{color:#666}
</style>
</head>
<body>
<header>🛍️ Utkala Mart Admin Product Approval</header>

<div class="wrap">
<div class="card" id="loginBox">
<h3>🔐 Admin Login</h3>
<small>ADMIN_EMAIL ରେ ଆପଣଙ୍କ Email ବଦଳାନ୍ତୁ।</small>
<input id="email" type="email" placeholder="Admin Email">
<input id="pass" type="password" placeholder="Password">
<button class="btn login" id="loginBtn">Login</button>
<p id="msg"></p>
</div>

<div id="panel" class="hidden">
<div class="card"><h3>Pending Products</h3><p id="count">Loading...</p></div>
<div id="list"></div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,query,where,onSnapshot,doc,updateDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBYJ_KKsS_7SNz108jnw6hpOlmegofRhJg",
authDomain:"utkalamart-1ec68.firebaseapp.com",
projectId:"utkalamart-1ec68",
storageBucket:"utkalamart-1ec68.firebasestorage.app",
messagingSenderId:"664871353747",
appId:"1:664871353747:web:96532fdafe78aabe7f3c66"
};

const ADMIN_EMAIL="admin@utkalamart.in"; // ଏଠାରେ ନିଜ Email ଦିଅନ୍ତୁ
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

loginBtn.onclick=async()=>{
try{
await signInWithEmailAndPassword(auth,email.value.trim(),pass.value);
}catch(e){msg.textContent="Login ହେଲା ନାହିଁ";}
};

onAuthStateChanged(auth,user=>{
if(!user)return;
if(user.email!==ADMIN_EMAIL){
msg.textContent="ଏହି Email Admin ନୁହେଁ";return;
}
loginBox.classList.add("hidden");
panel.classList.remove("hidden");

const q=query(collection(db,"products"),where("status","==","pending"));
onSnapshot(q,snap=>{
count.textContent="Pending: "+snap.size;
list.innerHTML="";
snap.forEach(d=>{
const p=d.data();
const div=document.createElement("div");
div.className="card";
div.innerHTML=`
<div class="row">
<img src="${p.imageUrl||p.image||'logo.png'}">
<div style="flex:1">
<b>${p.name||''}</b><br>
${p.category||''}<br>
⚖️ ${p.weight||''} ${p.weightUnit||''}<br>
💰 Seller: ₹${p.sellerPrice||0} | Utkala: ₹${p.price||0}<br>
📦 Stock: ${p.stock||0}<br>
📍 ${p.location||''}
</div>
</div>
<div style="margin-top:12px;display:flex;gap:8px">
<button class="btn ok" data-id="${d.id}" data-a="approve">Approve</button>
<button class="btn no" data-id="${d.id}" data-a="reject">Reject</button>
</div>`;
list.appendChild(div);
});
});
});

document.addEventListener("click",async(e)=>{
const b=e.target.closest("button[data-id]");
if(!b)return;
const id=b.dataset.id;
if(b.dataset.a==="approve"){
await updateDoc(doc(db,"products",id),{status:"approved",approved:true,active:true});
}else{
await updateDoc(doc(db,"products",id),{status:"rejected",approved:false,active:false});
}
});
</script>
</body>
</html>
