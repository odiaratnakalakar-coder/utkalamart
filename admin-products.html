<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Utkala Mart - Admin Products</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Odia",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#075b3b;
  color:white;
  padding:18px 12px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.wrap{
  max-width:950px;
  margin:auto;
  padding:16px;
}

.card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.login-title{
  color:#075b3b;
  margin-top:0;
}

.info{
  color:#666;
  font-size:13px;
  line-height:1.6;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:9px;
  margin:7px 0;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#075b3b;
}

/* PASSWORD */

.password-box{
  position:relative;
}

.password-box input{
  padding-right:55px;
}

.show-password{
  position:absolute;
  right:5px;
  top:5px;
  width:44px;
  height:44px;
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:21px;
  padding:0;
}

/* BUTTON */

.btn{
  border:0;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
  color:white;
  cursor:pointer;
  font-size:14px;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.login{
  width:100%;
  background:#ef761d;
  margin-top:8px;
}

.ok{
  background:#0a8755;
}

.no{
  background:#d9272e;
}

.stock{
  background:#1677d2;
}

.refresh{
  background:#555;
  margin-top:10px;
}

/* HIDDEN */

.hidden{
  display:none !important;
}

/* SECTION */

.section-title{
  color:#075b3b;
  margin:0 0 5px;
}

.count{
  color:#666;
  margin:5px 0 0;
}

/* PRODUCT */

.row{
  display:flex;
  gap:14px;
  align-items:center;
}

.product-image{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
  flex-shrink:0;
}

.product-info{
  flex:1;
  min-width:0;
}

.product-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:5px;
}

.line{
  font-size:14px;
  color:#555;
  margin-top:4px;
}

/* STATUS */

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-top:8px;
}

.pending{
  background:#fff3cd;
  color:#856404;
}

.approved{
  background:#d1fae5;
  color:#065f46;
}

/* STOCK */

.stock-box{
  margin-top:10px;
  padding:11px;
  background:#f3f7f5;
  border-radius:9px;
}

.stock-number{
  font-size:20px;
  font-weight:bold;
  color:#075b3b;
}

.stock-out{
  color:#d9272e;
}

/* ACTIONS */

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px;
}

/* MESSAGE */

.message{
  margin-top:10px;
  padding:11px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
}

.error{
  background:#ffe8e8;
  color:#b00000;
}

.success{
  background:#e8f8ee;
  color:#087b3e;
}

.empty{
  text-align:center;
  color:#666;
  padding:20px;
}

/* MOBILE */

@media(max-width:600px){

  header{
    font-size:19px;
  }

  .wrap{
    padding:10px;
  }

  .card{
    padding:13px;
  }

  .row{
    align-items:flex-start;
    gap:10px;
  }

  .product-image{
    width:75px;
    height:75px;
  }

  .product-name{
    font-size:15px;
  }

  .line{
    font-size:12px;
  }

  .btn{
    padding:9px 12px;
    font-size:13px;
  }

}

</style>

</head>


<body>


<header>

🛍️ Utkala Mart Admin Products

</header>


<div class="wrap">


<!-- =================================
     LOGIN
================================= -->

<div
  class="card"
  id="loginBox">

  <h2 class="login-title">

    🔐 Admin Login

  </h2>

  <div class="info">

    Admin Email ଏବଂ Password ଦେଇ Login କରନ୍ତୁ।

  </div>


  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="Admin Email"
  >


  <div class="password-box">

    <input
      id="pass"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
    >

    <button
      type="button"
      class="show-password"
      id="showPass">

      👁️

    </button>

  </div>


  <button
    class="btn login"
    id="loginBtn">

    🔐 Login

  </button>


  <div
    id="loginMsg">
  </div>

</div>



<!-- =================================
     ADMIN PANEL
================================= -->

<div
  id="panel"
  class="hidden">


  <!-- =================================
       PENDING
  ================================== -->

  <div class="card">

    <h3 class="section-title">

      ⏳ Pending Products

    </h3>

    <p
      class="count"
      id="pendingCount">

      Loading...

    </p>

  </div>


  <div
    id="pendingList">
  </div>



  <!-- =================================
       APPROVED
  ================================== -->

  <div class="card">

    <h3 class="section-title">

      ✅ Approved Products

    </h3>

    <p
      class="count"
      id="approvedCount">

      Loading...

    </p>

  </div>


  <div
    id="approvedList">
  </div>


</div>


</div>



<script type="module">


/* =================================
   FIREBASE
================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot,
  doc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =================================
   CONFIG
================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBYJ_KKs_7SNz108jnw6hpOlmegofRhJg",

  authDomain:
  "utkalamart-1ec68.firebaseapp.com",

  projectId:
  "utkalamart-1ec68",

  storageBucket:
  "utkalamart-1ec68.firebasestorage.app",

  messagingSenderId:
  "664871353747",

  appId:
  "1:664871353747:web:96532fdafe78aabe7f3c66"

};


/* =================================
   ADMIN EMAIL
================================= */

const ADMIN_EMAIL =
"admin@utkalamart.in";


/* =================================
   INIT
================================= */

const app =
initializeApp(
  firebaseConfig
);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =================================
   DOM
================================= */

const loginBox =
document.getElementById(
  "loginBox"
);

const panel =
document.getElementById(
  "panel"
);

const emailInput =
document.getElementById(
  "email"
);

const passInput =
document.getElementById(
  "pass"
);

const loginBtn =
document.getElementById(
  "loginBtn"
);

const loginMsg =
document.getElementById(
  "loginMsg"
);

const showPass =
document.getElementById(
  "showPass"
);

const pendingCount =
document.getElementById(
  "pendingCount"
);

const approvedCount =
document.getElementById(
  "approvedCount"
);

const pendingList =
document.getElementById(
  "pendingList"
);

const approvedList =
document.getElementById(
  "approvedList"
);



/* =================================
   PASSWORD SHOW / HIDE
================================= */

showPass.addEventListener(
  "click",
  ()=>{

    if(
      passInput.type ===
      "password"
    ){

      passInput.type =
      "text";

      showPass.textContent =
      "🙈";

    }else{

      passInput.type =
      "password";

      showPass.textContent =
      "👁️";

    }

  }
);



/* =================================
   LOGIN
================================= */

loginBtn.addEventListener(
  "click",
  async()=>{

    const email =
    emailInput.value.trim();

    const password =
    passInput.value;


    loginMsg.innerHTML =
    "";


    if(!email){

      showError(
        "ଦୟାକରି Admin Email ଦିଅନ୍ତୁ।"
      );

      return;

    }


    if(!password){

      showError(
        "ଦୟାକରି Password ଦିଅନ୍ତୁ।"
      );

      return;

    }


    loginBtn.disabled =
    true;

    loginBtn.textContent =
    "⏳ Login...";


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }catch(error){

      console.error(error);

      showError(
        loginErrorMessage(
          error
        )
      );

    }


    loginBtn.disabled =
    false;

    loginBtn.textContent =
    "🔐 Login";

  }
);



/* =================================
   LOGIN ERROR
================================= */

function loginErrorMessage(
  error
){

  if(
    error.code ===
    "auth/invalid-credential"
  ){

    return "❌ Email କିମ୍ବା Password ଭୁଲ।";

  }


  if(
    error.code ===
    "auth/user-not-found"
  ){

    return "❌ Firebase Authentication ରେ ଏହି Email ନାହିଁ।";

  }


  if(
    error.code ===
    "auth/wrong-password"
  ){

    return "❌ Password ଭୁଲ।";

  }


  return (
    "❌ Login ହେଲା ନାହିଁ।"
  );

}


function showError(
  text
){

  loginMsg.innerHTML = `

    <div class="message error">

      ${escapeHTML(text)}

    </div>

  `;

}



/* =================================
   AUTH
================================= */

onAuthStateChanged(
  auth,
  user=>{

    if(!user){

      return;

    }


    if(
      user.email !==
      ADMIN_EMAIL
    ){

      showError(
        "❌ ଏହି Email Admin ନୁହେଁ।"
      );

      return;

    }


    loginBox.classList.add(
      "hidden"
    );

    panel.classList.remove(
      "hidden"
    );


    loadPendingProducts();

    loadApprovedProducts();

  }
);



/* =================================
   PENDING PRODUCTS
================================= */

function loadPendingProducts(){

  const q =
  query(
    collection(
      db,
      "products"
    ),
    where(
      "status",
      "==",
      "pending"
    )
  );


  onSnapshot(
    q,
    snap=>{

      pendingCount.textContent =
      "Pending: " +
      snap.size;


      pendingList.innerHTML =
      "";


      if(
        snap.empty
      ){

        pendingList.innerHTML = `

          <div class="card empty">

            👍 ବର୍ତ୍ତମାନ କୌଣସି
            Pending Product ନାହିଁ।

          </div>

        `;

        return;

      }


      snap.forEach(
        productDoc=>{

          const p =
          productDoc.data();


          const stock =
          getStock(p);


          const div =
          document.createElement(
            "div"
          );


          div.className =
          "card";


          div.innerHTML = `

            <div class="row">

              <img
                class="product-image"
                src="${
                  escapeHTML(
                    p.imageUrl ||
                    p.image ||
                    "logo.png"
                  )
                }"
                onerror="
                  this.src='logo.png'
                "
              >


              <div
                class="product-info">

                <div
                  class="product-name">

                  ${
                    escapeHTML(
                      p.name || ""
                    )
                  }

                </div>


                <div class="line">

                  🏷️
                  ${
                    escapeHTML(
                      p.category || ""
                    )
                  }

                </div>


                <div class="line">

                  ⚖️
                  ${
                    escapeHTML(
                      p.weight || ""
                    )
                  }

                  ${
                    escapeHTML(
                      p.weightUnit ||
                      p.unit ||
                      ""
                    )
                  }

                </div>


                <div class="line">

                  💰 Seller:
                  ₹${
                    Number(
                      p.sellerPrice || 0
                    ).toLocaleString(
                      "en-IN"
                    )
                  }

                  <br>

                  💰 Utkala:
                  ₹${
                    Number(
                      p.price || 0
                    ).toLocaleString(
                      "en-IN"
                    )
                  }

                </div>


                <div class="line">

                  📦 Stock:
                  <b>${stock}</b>

                </div>


                <div class="line">

                  📍
                  ${
                    escapeHTML(
                      p.location || ""
                    )
                  }

                </div>


                <span
                  class="status pending">

                  ⏳ Pending

                </span>

              </div>

            </div>


            <div class="actions">

              <button
                class="btn ok"
                data-id="${productDoc.id}"
                data-action="approve">

                ✅ Approve

              </button>


              <button
                class="btn no"
                data-id="${productDoc.id}"
                data-action="reject">

                ❌ Reject

              </button>

            </div>

          `;


          pendingList.appendChild(
            div
          );

        }
      );

    },

    error=>{

      console.error(error);

      pendingList.innerHTML = `

        <div class="card">

          ❌ Pending Products load
          ହୋଇପାରିଲା ନାହିଁ।

        </div>

      `;

    }

  );

}



/* =================================
   APPROVED PRODUCTS
================================= */

function loadApprovedProducts(){

  const q =
  query(
    collection(
      db,
      "products"
    ),
    where(
      "status",
      "==",
      "approved"
    )
  );


  onSnapshot(
    q,
    snap=>{

      approvedCount.textContent =
      "Approved: " +
      snap.size;


      approvedList.innerHTML =
      "";


      if(
        snap.empty
      ){

        approvedList.innerHTML = `

          <div class="card empty">

            📦 ବର୍ତ୍ତମାନ କୌଣସି
            Approved Product ନାହିଁ।

          </div>

        `;

        return;

      }


      snap.forEach(
        productDoc=>{

          const p =
          productDoc.data();


          const stock =
          getStock(p);


          const div =
          document.createElement(
            "div"
          );


          div.className =
          "card";


          div.innerHTML = `

            <div class="row">

              <img
                class="product-image"
                src="${
                  escapeHTML(
                    p.imageUrl ||
                    p.image ||
                    "logo.png"
                  )
                }"
                onerror="
                  this.src='logo.png'
                "
              >


              <div
                class="product-info">

                <div
                  class="product-name">

                  ${
                    escapeHTML(
                      p.name || ""
                    )
                  }

                </div>


                <div class="line">

                  🏷️
                  ${
                    escapeHTML(
                      p.category || ""
                    )
                  }

                </div>


                <div class="line">

                  ⚖️
                  ${
                    escapeHTML(
                      p.weight || ""
                    )
                  }

                  ${
                    escapeHTML(
                      p.weightUnit ||
                      p.unit ||
                      ""
                    )
                  }

                </div>


                <div class="line">

                  💰 Utkala Price:

                  <b>

                    ₹${
                      Number(
                        p.price || 0
                      ).toLocaleString(
                        "en-IN"
                      )
                    }

                  </b>

                </div>


                <div
                  class="stock-box">

                  📦 Current Stock:

                  <span
                    class="
                    stock-number
                    ${
                      stock === 0
                      ? "stock-out"
                      : ""
                    }
                    ">

                    ${stock}

                  </span>


                  ${
                    stock === 0
                    ? `
                      <span
                        style="
                        color:#d9272e;
                        font-weight:bold;
                        margin-left:6px;
                        ">

                        Stock Out

                      </span>
                    `
                    : ""
                  }

                </div>


                <span
                  class="status approved">

                  ✅ Approved

                </span>

              </div>

            </div>


            <div class="actions">

              <button
                class="btn stock"
                data-id="${productDoc.id}"
                data-action="stock">

                ✏️ Edit Stock

              </button>

            </div>

          `;


          approvedList.appendChild(
            div
          );

        }
      );

    },

    error=>{

      console.error(error);

      approvedList.innerHTML = `

        <div class="card">

          ❌ Approved Products load
          ହୋଇପାରିଲା ନାହିଁ।

        </div>

      `;

    }

  );

}



/* =================================
   BUTTON ACTIONS
================================= */

document.addEventListener(
  "click",
  async event=>{

    const button =
    event.target.closest(
      "button[data-id]"
    );


    if(!button){

      return;

    }


    const id =
    button.dataset.id;


    const action =
    button.dataset.action;



    /* =============================
       APPROVE
    ============================== */

    if(
      action ===
      "approve"
    ){

      button.disabled =
      true;

      button.textContent =
      "⏳ Approving...";


      try{

        await updateDoc(
          doc(
            db,
            "products",
            id
          ),
          {

            status:
            "approved",

            approved:
            true,

            active:
            true

          }
        );


        alert(
          "✅ Product Approved"
        );


      }catch(error){

        console.error(error);

        alert(
          "❌ Approve failed: " +
          error.message
        );


        button.disabled =
        false;

        button.textContent =
        "✅ Approve";

      }


      return;

    }



    /* =============================
       REJECT
    ============================== */

    if(
      action ===
      "reject"
    ){

      const confirmReject =
      confirm(
        "ଏହି Product କୁ Reject କରିବେ କି?"
      );


      if(
        !confirmReject
      ){

        return;

      }


      button.disabled =
      true;

      button.textContent =
      "⏳ Rejecting...";


      try{

        await updateDoc(
          doc(
            db,
            "products",
            id
          ),
          {

            status:
            "rejected",

            approved:
            false,

            active:
            false

          }
        );


        alert(
          "❌ Product Rejected"
        );


      }catch(error){

        console.error(error);

        alert(
          "❌ Reject failed: " +
          error.message
        );


        button.disabled =
        false;

        button.textContent =
        "❌ Reject";

      }


      return;

    }



    /* =============================
       EDIT STOCK
    ============================== */

    if(
      action ===
      "stock"
    ){

      const card =
      button.closest(
        ".card"
      );


      const stockElement =
      card.querySelector(
        ".stock-number"
      );


      const oldStock =
      Number(
        stockElement.textContent
      );


      const newValue =
      prompt(
        "📦 ନୂଆ Stock କେତେ ରଖିବେ?",
        oldStock
      );


      if(
        newValue ===
        null
      ){

        return;

      }


      const clean =
      newValue.trim();


      if(
        clean === ""
      ){

        alert(
          "❌ Stock ଦିଅନ୍ତୁ।"
        );

        return;

      }


      const newStock =
      Number(
        clean
      );


      if(
        !Number.isInteger(
          newStock
        ) ||
        newStock < 0
      ){

        alert(
          "❌ Stock 0 କିମ୍ବା ତାଠାରୁ ଅଧିକ whole number ହେବା ଦରକାର।"
        );

        return;

      }


      button.disabled =
      true;

      button.textContent =
      "⏳ Updating...";


      try{

        await updateDoc(
          doc(
            db,
            "products",
            id
          ),
          {

            stock:
            newStock,

            stockQty:
            newStock,

            quantity:
            newStock,

            availableStock:
            newStock

          }
        );


        alert(
          "✅ Stock update ହୋଇଗଲା: " +
          newStock
        );


      }catch(error){

        console.error(error);

        alert(
          "❌ Stock update failed: " +
          error.message
        );

      }


      button.disabled =
      false;

      button.textContent =
      "✏️ Edit Stock";

    }

  }
);



/* =================================
   GET STOCK
================================= */

function getStock(
  product
){

  const value =
    product.stock ??
    product.stockQty ??
    product.quantity ??
    product.availableStock ??
    0;


  const number =
    Number(
      value
    );


  if(
    Number.isFinite(
      number
    )
  ){

    return number;

  }


  return 0;

}



/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>


</body>

</html>
